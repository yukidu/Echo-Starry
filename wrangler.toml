#:schema node_modules/wrangler/config-schema.json
name = "echostars"
main = "worker/starryIdGateway.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Pull request previews are intentionally isolated from production resources.
# Storage bindings are omitted here so preview branches cannot read/write production D1, KV or R2.
previews = { }

# 保留原本 Cloudflare 建置流程；回歸測試由 GitHub Actions 額外把關。
[build]
command = "npm run build"

# 靜態前端資源 (Vite build 產出之 dist 目錄)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 所有請求先經過 Starry ID gateway，再進 privacyCrawlerRouter；既有隱私／爬蟲規則維持不變。
run_worker_first = ["/*"]

# 1. Cloudflare D1：EchoStars App 專屬資料
[[d1_databases]]
binding = "DB"
database_name = "echoes_db"
database_id = "e0a696a9-0233-4186-be4d-229435b19a27"

# 2. Cloudflare D1：Starry ID 中央會員資料（跨 App 共用）
[[d1_databases]]
binding = "STARRY_ID_DB"
database_name = "starry_id_db"
database_id = "01195c92-555e-4816-bddc-5b8cb2e795db"

# 3. Cloudflare R2 物件儲存桶 (音檔與圖檔直傳)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "echoes-audio-bucket"

# 4. Cloudflare KV 快取與連線狀態儲存庫
[[kv_namespaces]]
binding = "KV"
id = "a2e345e244cb40b4a804be3f89584b90"

[vars]
ENVIRONMENT = "production"
