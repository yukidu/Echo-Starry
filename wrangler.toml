#:schema node_modules/wrangler/config-schema.json
name = "echostars"
main = "worker/privacyCrawlerRouter.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 保留原本 workers.dev 正式備援入口與 PR Preview URL。
# Wrangler 在設定 routes 後會把 workers_dev 預設改為 false，因此這裡明確保持開啟。
workers_dev = true
preview_urls = true

# 正式自訂網域：Cloudflare Workers Custom Domain。
# 只供 Production 使用；PR Preview 仍使用 workers.dev。
[[routes]]
pattern = "echo.starry.phd"
custom_domain = true
enabled = true
previews_enabled = false

# Pull request previews are intentionally isolated from production resources.
# Storage bindings are omitted here so preview branches cannot read/write production D1, KV or R2.
previews = { }

# 保留原本 Cloudflare 建置流程；回歸測試由 GitHub Actions 額外把關。
[build]
command = "npm run build"

# 靜態前端資源 (Vite build 產出之 dist 目錄)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 所有請求先經過 privacyCrawlerRouter，才能對首頁、分享頁、靜態資源與 API
# 一致套用 X-Robots-Tag，並阻擋已知搜尋引擎／AI crawler。
run_worker_first = ["/*"]

# 1. Cloudflare D1 資料庫 (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "echoes_db"
database_id = "e0a696a9-0233-4186-be4d-229435b19a27"

# 2. Cloudflare R2 物件儲存桶 (音檔與圖檔直傳)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "echoes-audio-bucket"

# 3. Cloudflare KV 快取與連線狀態儲存庫
[[kv_namespaces]]
binding = "KV"
id = "a2e345e244cb40b4a804be3f89584b90"

[vars]
ENVIRONMENT = "production"
