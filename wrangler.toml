#:schema node_modules/wrangler/config-schema.json
name = "echostars"
# v225 adds a very thin Schema-driven gateway, then delegates every existing
# request to privacyCrawlerRouter unchanged.
main = "worker/starryProfileSchemaGateway.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 保留原本 workers.dev 正式備援入口與 PR Preview URL。
# Wrangler 在設定 routes 後可能關閉 workers.dev，因此這裡明確保持開啟。
workers_dev = true
preview_urls = true

# Pull request previews are intentionally isolated from production resources.
# Storage bindings are omitted here so preview branches cannot read/write production D1, KV or R2.
previews = { }

# 正式自訂網域：Cloudflare Workers Custom Domain。
# EchoStars 與 Starry ID 暫時共用同一 Worker，但由 hostname 完全分流。
[[routes]]
pattern = "echo.starry.phd"
custom_domain = true

[[routes]]
pattern = "id.starry.phd"
custom_domain = true

# 保留原本 Cloudflare 建置流程；回歸測試由 GitHub Actions 額外把關。
[build]
command = "npm run build"

# 靜態前端資源 (Vite build 產出之 dist 目錄)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Schema gateway 僅處理中央欄位規則／動態欄位及 EchoStars 表單同步；
# 其他流量立即委派給既有 privacyCrawlerRouter，保留原安全路由鏈。
run_worker_first = ["/*"]

# 1. Cloudflare D1 資料庫 (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "echoes_db"
database_id = "e0a696a9-0233-4186-be4d-229435b19a27"

# Starry ID 中央會員資料庫。只同步跨 App 共用的身份與固定基本資料；
# EchoStars 專屬播放、收藏、學習、徽章與權限仍留在原資料庫。
[[d1_databases]]
binding = "STARRY_ID_DB"
database_name = "starry_id_db"
database_id = "01195c92-555e-4816-bddc-5b8cb2e795db"

# 2. Cloudflare R2 物件儲存桶 (音檔與圖檔直傳)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "echoes-audio-bucket"

# 3. Cloudflare KV 快取與連線狀態儲存庫
[[kv_namespaces]]
binding = "KV"
id = "a2e345e244cb40b4a804be3f89584b90"

[vars]
ENVIRONMENT = "production"
# Google OAuth Client ID 是公開識別碼，不是秘密；Client Secret 不進 GitHub / 前端。
STARRY_ID_GOOGLE_CLIENT_ID = "661055525630-ndcq5gtr16h7rqqprlqqkkvineea87lc.apps.googleusercontent.com"
# App 必須先在 Starry ID 登記，不能由瀏覽器任意宣稱 appId 自行取得會員資格。
STARRY_ID_ALLOWED_APPS = "starry-id,downloadstarry,gostarry"
STARRY_ID_SELF_ENROLL_APPS = "starry-id,downloadstarry,gostarry"