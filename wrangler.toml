#:schema node_modules/wrangler/config-schema.json
name = "echostars"
main = "worker/previewFastRouter.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Fixed Preview channel: all mutable data is isolated from production.
[previews.vars]
ENVIRONMENT = "preview"

[[previews.d1_databases]]
binding = "DB"
database_name = "preview-db"
database_id = "2bfa1862-025a-4e0a-9011-1d42162d7dd1"

[[previews.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "preview-audio"

[[previews.kv_namespaces]]
binding = "KV"
id = "cce48dd354e74a7abfdd9d10894c76c5"

# 保留原本 Cloudflare 建置流程；回歸測試由 GitHub Actions 額外把關。
[build]
command = "npm run build"

# 靜態前端資源 (Vite build 產出之 dist 目錄)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 所有請求先經過入口 Worker；Preview 入口會讓一般前端頁面直接走 Assets，
# API / 分享 / robots 仍交由原 privacyCrawlerRouter 處理。
run_worker_first = ["/*"]

# 1. Cloudflare D1 資料庫 (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "echoes_db"
database_id = "e0a696a9-0233-4186-be4d-229435b19a27"

# 2. Cloudflare R2 物件儲存桶 (音檔與圖檔直傳)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "echoes-audio-bucket"

# 3. Cloudflare KV 快取與連線狀態儲存庫
[[kv_namespaces]]
binding = "KV"
id = "a2e345e244cb40b4a804be3f89584b90"

[vars]
ENVIRONMENT = "production"
