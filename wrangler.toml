#:schema node_modules/wrangler/config-schema.json
name = "echostars"
main = "worker/privacyCrawlerRouter.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Dedicated v189 Preview: same application/runtime as the safe v189 branch,
# intentionally reading the same D1 / R2 / KV data as Production for playback testing.
# WARNING: any write/delete action from this Preview affects Production data.
[previews.vars]
ENVIRONMENT = "preview"

[[previews.d1_databases]]
binding = "DB"
database_name = "echoes_db"
database_id = "e0a696a9-0233-4186-be4d-229435b19a27"

[[previews.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "echoes-audio-bucket"

[[previews.kv_namespaces]]
binding = "KV"
id = "a2e345e244cb40b4a804be3f89584b90"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "echoes_db"
database_id = "e0a696a9-0233-4186-be4d-229435b19a27"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "echoes-audio-bucket"

[[kv_namespaces]]
binding = "KV"
id = "a2e345e244cb40b4a804be3f89584b90"

[vars]
ENVIRONMENT = "production"
