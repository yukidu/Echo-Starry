#:schema node_modules/wrangler/config-schema.json
name = "echostars"
main = "worker/trackVisibilityPersistenceRouter.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Pull request previews are intentionally isolated from production resources.
# Storage bindings are omitted here so preview branches cannot read/write production D1, KV or R2.
previews = { }

# 保留原本 Cloudflare 建置流程；回歸測試由 GitHub Actions 額外把關。
[build]
command = "npm run build"

# 靜態前端資源 (Vite build 產出之 dist 目錄)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 所有請求先經過 v188 顯示權限保存層，再完整進入 privacyCrawlerRouter，
# 所以首頁、分享頁、靜態資源與 API 仍一致套用 X-Robots-Tag 與 crawler 阻擋。
run_worker_first = ["/*"]

# 1. Cloudflare D1 資料庫 (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "echoes_db"
database_id = "e0a696a9-0233-4186-be4d-229435b19a27"

# 2. Cloudflare R2 物件儲存桶 (音檔與圖檔直傳)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "echoes-audio-bucket"

# 3. Cloudflare KV 快取與連線狀態儲存庫
[[kv_namespaces]]
binding = "KV"
id = "a2e345e244cb40b4a804be3f89584b90"

[vars]
ENVIRONMENT = "production"