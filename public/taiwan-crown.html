<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c06c84" />
  <title>臺灣皇冠大使｜繁星回聲</title>
  <style>
    :root {
      --crown-primary: #c06c84;
      --crown-primary-soft: color-mix(in srgb, var(--crown-primary) 14%, white);
      --crown-primary-deep: color-mix(in srgb, var(--crown-primary) 72%, #111827);
      --crown-gold: #d4af37;
      --crown-gold-light: #fff2a8;
      --page-bg: #f8fafc;
      --card-bg: rgba(255,255,255,.88);
      --card-border: rgba(148,163,184,.24);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --shadow: 0 16px 38px rgba(15,23,42,.12);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page-bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-main);
      background:
        radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--crown-primary) 28%, transparent) 0%, transparent 38%),
        linear-gradient(180deg, color-mix(in srgb, var(--crown-primary) 5%, #ffffff) 0%, var(--page-bg) 42%, color-mix(in srgb, var(--crown-primary) 8%, #ffffff) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body.dark {
      --page-bg: #020617;
      --card-bg: rgba(15,23,42,.86);
      --card-border: rgba(148,163,184,.18);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --shadow: 0 18px 44px rgba(0,0,0,.36);
      background:
        radial-gradient(circle at 50% -10%, color-mix(in srgb, var(--crown-primary) 30%, transparent) 0%, transparent 34%),
        linear-gradient(180deg, #020617 0%, #0f172a 44%, #020617 100%);
    }

    button, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .page-shell {
      width: min(100%, 620px);
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0 12px;
      backdrop-filter: blur(18px);
    }

    .back-button, .profile-button {
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 4px 16px rgba(15,23,42,.08);
      border-radius: 999px;
      min-height: 42px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

    .back-button:active, .profile-button:active, .ambassador-card:active { transform: scale(.98); }

    .hero {
      text-align: center;
      padding: 28px 10px 26px;
      animation: fadeDown .55s ease both;
    }

    .hero-crown {
      width: 64px;
      height: 64px;
      border-radius: 22px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      font-size: 32px;
      color: white;
      background: linear-gradient(145deg, var(--crown-primary), color-mix(in srgb, var(--crown-primary) 58%, #f6d365));
      box-shadow: 0 12px 28px color-mix(in srgb, var(--crown-primary) 35%, transparent);
    }

    .page-title {
      margin: 0 0 8px;
      font-size: clamp(26px, 7vw, 38px);
      line-height: 1.08;
      letter-spacing: .06em;
      font-weight: 950;
      background: linear-gradient(100deg, var(--crown-primary) 0%, var(--crown-gold) 35%, var(--crown-gold-light) 52%, var(--crown-primary) 100%);
      background-size: 210% auto;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      animation: shine 5s linear infinite;
    }

    .greeting {
      margin: 0;
      min-height: 24px;
      font-size: clamp(14px, 4vw, 18px);
      font-weight: 800;
      color: var(--text-main);
      opacity: .88;
    }

    .identity-note {
      margin: 9px auto 0;
      width: fit-content;
      max-width: 100%;
      padding: 6px 10px;
      border-radius: 999px;
      color: var(--crown-primary-deep);
      background: var(--crown-primary-soft);
      font-size: 11px;
      font-weight: 900;
    }

    body.dark .identity-note { color: #fff; background: color-mix(in srgb, var(--crown-primary) 26%, #0f172a); }

    .cards { display: grid; gap: 12px; }

    .ambassador-card {
      width: 100%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: inherit;
      box-shadow: var(--shadow);
      border-radius: 26px;
      min-height: 112px;
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr) 24px;
      align-items: center;
      gap: 14px;
      padding: 14px;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: transform .16s ease, border-color .2s ease, box-shadow .2s ease;
      animation: fadeUp .5s ease both;
    }

    .ambassador-card:hover {
      border-color: color-mix(in srgb, var(--crown-primary) 46%, var(--card-border));
      box-shadow: 0 18px 44px color-mix(in srgb, var(--crown-primary) 14%, rgba(15,23,42,.14));
      transform: translateY(-2px);
    }

    .ambassador-card.user-card {
      border: 2px solid color-mix(in srgb, var(--crown-primary) 64%, var(--crown-gold));
      background: linear-gradient(135deg, color-mix(in srgb, var(--crown-primary) 13%, var(--card-bg)) 0%, var(--card-bg) 68%);
      box-shadow: 0 14px 38px color-mix(in srgb, var(--crown-primary) 20%, transparent);
      margin-bottom: 8px;
    }

    .avatar-ring {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(145deg, var(--crown-primary), var(--crown-gold-light), var(--crown-gold), var(--crown-primary));
      box-shadow: 0 0 20px color-mix(in srgb, var(--crown-primary) 22%, transparent);
      position: relative;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: color-mix(in srgb, var(--crown-primary) 12%, #e2e8f0);
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 900;
      color: var(--crown-primary);
    }

    body.dark .avatar { background: #0f172a; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .edit-dot {
      position: absolute;
      right: -2px;
      bottom: 1px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--crown-primary);
      color: white;
      border: 2px solid var(--card-bg);
      font-size: 12px;
      box-shadow: 0 3px 10px rgba(15,23,42,.22);
    }

    .card-name {
      margin: 0 0 4px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 950;
      color: var(--text-main);
    }

    .user-card .card-name { color: var(--crown-primary); }

    .quote-row { display: flex; align-items: flex-start; gap: 4px; }
    .quote-mark { color: var(--crown-primary); opacity: .48; font-size: 26px; line-height: .9; font-family: Georgia, serif; }
    .card-quote { margin: 0; color: var(--text-sub); font-size: 13px; line-height: 1.55; font-style: italic; font-weight: 650; }
    .open-mark { color: var(--crown-primary); font-size: 20px; font-weight: 900; text-align: center; }

    .section-label {
      margin: 20px 3px 10px;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .footer {
      margin-top: 34px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
      text-align: center;
      color: var(--text-sub);
    }

    .footer p { margin: 0 0 14px; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .footer .dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 16px; }
    .footer .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--crown-primary); animation: pulse 1.5s ease-in-out infinite; opacity: .35; }
    .footer .dots i:nth-child(2) { animation-delay: .2s; }
    .footer .dots i:nth-child(3) { animation-delay: .4s; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2,6,23,.72);
      backdrop-filter: blur(10px);
    }
    .modal.open { display: flex; }
    .modal-card {
      width: min(100%, 390px);
      border-radius: 28px;
      border: 1px solid color-mix(in srgb, var(--crown-primary) 36%, var(--card-border));
      background: var(--card-bg);
      box-shadow: 0 24px 70px rgba(0,0,0,.34);
      padding: 22px;
      animation: zoomIn .2s ease both;
    }
    .modal-icon { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 18px; display: grid; place-items: center; background: var(--crown-primary-soft); font-size: 28px; }
    .modal-title { margin: 0; text-align: center; font-size: 21px; font-weight: 950; color: var(--crown-primary); }
    .modal-sub { margin: 6px 0 18px; text-align: center; color: var(--text-sub); font-size: 11px; }
    .auto-name { padding: 12px 14px; border-radius: 16px; background: var(--crown-primary-soft); color: var(--text-main); font-weight: 900; font-size: 14px; margin-bottom: 14px; }
    .field-label { display: block; margin: 0 0 7px 3px; color: var(--crown-primary); font-size: 11px; font-weight: 900; letter-spacing: .08em; }
    textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      border: 1px solid var(--card-border);
      outline: none;
      color: var(--text-main);
      background: color-mix(in srgb, var(--card-bg) 92%, transparent);
      border-radius: 16px;
      padding: 13px;
      line-height: 1.5;
    }
    textarea:focus { border-color: var(--crown-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--crown-primary) 16%, transparent); }
    .modal-actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; margin-top: 14px; }
    .modal-actions button { min-height: 46px; border-radius: 15px; border: 0; font-weight: 900; cursor: pointer; }
    .secondary { background: color-mix(in srgb, var(--card-bg) 76%, #94a3b8); color: var(--text-main); }
    .primary { background: var(--crown-primary); color: white; box-shadow: 0 8px 20px color-mix(in srgb, var(--crown-primary) 26%, transparent); }

    #photo-upload { display: none; }

    @keyframes shine { to { background-position: 210% center; } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 50% { opacity: 1; transform: scale(1.25); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }

    @media (max-width: 390px) {
      .page-shell { padding-left: 12px; padding-right: 12px; }
      .ambassador-card { grid-template-columns: 74px minmax(0, 1fr) 18px; gap: 11px; padding: 12px; border-radius: 22px; }
      .avatar-ring { width: 72px; height: 72px; }
      .card-name { font-size: 16px; }
      .card-quote { font-size: 12px; }
      .topbar { gap: 6px; }
      .back-button, .profile-button { padding: 0 11px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="topbar">
      <a class="back-button" href="/" aria-label="返回繁星回聲">← 返回繁星回聲</a>
      <button id="open-profile" class="profile-button" type="button">個人化設定</button>
    </div>

    <header class="hero">
      <div class="hero-crown" aria-hidden="true">👑</div>
      <h1 class="page-title" id="display-name">臺灣皇冠大使</h1>
      <p class="greeting" id="display-greeting"></p>
      <p class="identity-note" id="identity-note"></p>
    </header>

    <main>
      <div id="user-card-root" class="cards"></div>
      <div class="section-label">臺灣皇冠大使成功故事</div>
      <div id="ambassador-container" class="cards"></div>
      <input id="photo-upload" type="file" accept="image/*" />
    </main>

    <footer class="footer">
      <p>APP設計：杜杜龍 2026/5/12</p>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <button id="reset-profile" type="button" class="profile-button">重新設定個人照片與座右銘</button>
    </footer>
  </div>

  <div id="profile-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
    <div class="modal-card">
      <div class="modal-icon" aria-hidden="true">👑</div>
      <h2 id="profile-modal-title" class="modal-title">開啟您的傳奇故事</h2>
      <p class="modal-sub">Helping People Live Better Lives</p>
      <div id="auto-name" class="auto-name"></div>
      <label class="field-label" for="motto-input">您的座右銘</label>
      <textarea id="motto-input" maxlength="180" placeholder="留下一句激勵夥伴的話…"></textarea>
      <div class="modal-actions">
        <button id="close-profile" type="button" class="secondary">稍後再說</button>
        <button id="save-profile" type="button" class="primary">儲存並進入</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const ambassadors = [
        { id: '2', name: '陳婉芬 嵇龍生', quote: '成功不是你贏過多少人，而是你幫助過多少人。', url: 'https://www.amway.com.tw/wechat/aep/member/member2.html' },
        { id: '3', name: '傅後堅', quote: '每個人都應該給自己一個機會，一個可以改變一生的機會。', url: 'https://www.amway.com.tw/wechat/aep/member/member3.html' },
        { id: '9', name: '王儷凱', quote: '一個人的成就，絕不會超過他的夢想。', url: 'https://www.amway.com.tw/wechat/aep/member/member9.html' },
        { id: '7', name: '許旭昇 謝淑芬', quote: '誠信是我們事業的核心，也是給夥伴最好的承諾。', url: 'https://www.amway.com.tw/wechat/aep/member/member7.html' },
        { id: '1', name: '雷宇鳴', quote: '成功不是將來才有的，而是從決定去做的那一刻起，持續累積而成。', url: 'https://www.amway.com.tw/wechat/aep/member/member1.html' },
        { id: '5', name: '鍾易宏', quote: '堅持，是通往成功的唯一捷徑。', url: 'https://www.amway.com.tw/wechat/aep/member/member5.html' },
        { id: '4', name: '楊嘉譁 陳仕騏', quote: '追求卓越，成功自然就會跟隨你。', url: 'https://www.amway.com.tw/wechat/aep/member/member4.html' },
        { id: '6', name: '曾玉玲 呂森林', quote: '在安麗，我們不只看到事業，更看到生命的無限可能。', url: 'https://www.amway.com.tw/wechat/aep/member/member6.html' },
        { id: '8', name: '游麗珠 謝建宗', quote: '選擇大於努力，正確的選擇讓努力更有價值。', url: 'https://www.amway.com.tw/wechat/aep/member/member8.html' },
        { id: '10', name: '涂永松 黃玉燕', quote: '把簡單的事情重覆做，就是專家；把重覆的事情用心做，就是贏家。', url: 'https://www.amway.com.tw/wechat/aep/member/member10.html' },
        { id: '12', name: '楊貫一 鄭家華', quote: '知識可以改變命運，學習可以創造未來。', url: 'https://www.amway.com.tw/wechat/aep/member/member12.html' },
        { id: '11', name: '許明哲 張瓅文', quote: '勇於嘗試，是邁向非凡人生的第一步。', url: 'https://www.amway.com.tw/wechat/aep/member/member11.html' },
        { id: '13', name: '施素真', quote: '做自己生命中的貴人，活出最亮麗的人生。', url: 'https://www.amway.com.tw/wechat/aep/member/member13.html' }
      ];

      const PROFILE_KEY = 'echostars_crown_profile_v1';
      const LAST_PRIMARY_KEY = 'echostars_crown_primary_v1';
      const imageBase = 'https://raw.githubusercontent.com/yukidu/amway_crown/main/img/';

      const parseStorage = (key) => {
        try { return JSON.parse(localStorage.getItem(key) || 'null'); }
        catch { return null; }
      };

      const params = new URLSearchParams(location.search);
      const requestedPrimary = (params.get('primary') || '').trim();
      const lastPrimary = localStorage.getItem(LAST_PRIMARY_KEY) || '';
      const primary = /^#[0-9a-f]{3,8}$/i.test(requestedPrimary)
        ? requestedPrimary
        : (/^#[0-9a-f]{3,8}$/i.test(lastPrimary) ? lastPrimary : '#c06c84');
      document.documentElement.style.setProperty('--crown-primary', primary);
      localStorage.setItem(LAST_PRIMARY_KEY, primary);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', primary);

      const darkRequested = params.get('dark');
      const dark = darkRequested === '1' || (darkRequested !== '0' && localStorage.getItem('sq_theme_dark') === 'true');
      document.body.classList.toggle('dark', dark);

      const currentUser = parseStorage('sq_current_user_v1');
      const visitor = parseStorage('sq_visitor_identity_v1');
      const identityName = String(currentUser?.name || visitor?.fullName || '勇敢的獅子').trim() || '勇敢的獅子';
      const identityKind = currentUser ? '已登入會員' : '目前訪客暱稱';
      const fallbackAvatar = currentUser?.avatar || (!currentUser ? visitor?.emoji : '') || '';
      const storedProfile = parseStorage(PROFILE_KEY);
      let profile = {
        motto: typeof storedProfile?.motto === 'string' ? storedProfile.motto : '',
        photo: typeof storedProfile?.photo === 'string' ? storedProfile.photo : '',
        initialized: Boolean(storedProfile?.initialized)
      };

      const displayName = document.getElementById('display-name');
      const displayGreeting = document.getElementById('display-greeting');
      const identityNote = document.getElementById('identity-note');
      const userCardRoot = document.getElementById('user-card-root');
      const ambassadorContainer = document.getElementById('ambassador-container');
      const photoUpload = document.getElementById('photo-upload');
      const modal = document.getElementById('profile-modal');
      const mottoInput = document.getElementById('motto-input');
      const autoName = document.getElementById('auto-name');

      function getGreeting() {
        const hour = new Date().getHours();
        if (hour < 5) return '別熬夜太晚啊！你很重要～';
        if (hour < 11) return '早安 你今天營養早餐吃什麼？';
        if (hour < 14) return '午安 準備和哪位夥伴談OPP呢？';
        if (hour < 18) return '下午好 你最推薦R＆J哪款特調飲呢？';
        if (hour < 21) return '晚上好 正在前往教室或聚會的路上嗎？';
        return '夜深了 明天邀約幾場了呢？';
      }

      function saveProfile() {
        localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      }

      function avatarContent(container, source, fallbackText) {
        container.replaceChildren();
        if (source && /^(?:https?:|data:|blob:|\/)/i.test(source)) {
          const img = document.createElement('img');
          img.src = source;
          img.alt = fallbackText || '';
          img.loading = 'lazy';
          img.onerror = () => {
            container.replaceChildren();
            container.textContent = (fallbackText || '👑').charAt(0) || '👑';
          };
          container.appendChild(img);
        } else {
          container.textContent = source || (fallbackText || '👑').charAt(0) || '👑';
        }
      }

      function createCard(data, options = {}) {
        const card = document.createElement(options.href ? 'a' : 'button');
        card.className = `ambassador-card${options.user ? ' user-card' : ''}`;
        card.style.animationDelay = `${options.delay || 0}ms`;
        if (options.href) {
          card.href = options.href;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';
          card.setAttribute('aria-label', `開啟${data.name}皇冠大使成功故事`);
        } else {
          card.type = 'button';
        }

        const ring = document.createElement('div');
        ring.className = 'avatar-ring';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatarContent(avatar, data.photo, data.name);
        ring.appendChild(avatar);

        if (options.user) {
          const edit = document.createElement('span');
          edit.className = 'edit-dot';
          edit.textContent = '✎';
          edit.setAttribute('aria-hidden', 'true');
          ring.appendChild(edit);
        }

        const content = document.createElement('div');
        const name = document.createElement('h2');
        name.className = 'card-name';
        name.textContent = data.name;
        const quoteRow = document.createElement('div');
        quoteRow.className = 'quote-row';
        const quoteMark = document.createElement('span');
        quoteMark.className = 'quote-mark';
        quoteMark.textContent = '“';
        const quote = document.createElement('p');
        quote.className = 'card-quote';
        quote.textContent = data.quote;
        quoteRow.append(quoteMark, quote);
        content.append(name, quoteRow);

        const openMark = document.createElement('div');
        openMark.className = 'open-mark';
        openMark.textContent = options.user ? '✎' : '›';
        openMark.setAttribute('aria-hidden', 'true');

        card.append(ring, content, openMark);
        if (options.user) {
          card.setAttribute('aria-label', '更換我的皇冠大使照片');
          card.addEventListener('click', () => photoUpload.click());
        }
        return card;
      }

      function render() {
        displayName.textContent = `${identityName} 皇冠大使您好`;
        displayGreeting.textContent = getGreeting();
        identityNote.textContent = `${identityKind}：${identityName}`;
        autoName.textContent = `姓名已自動串接：${identityName}`;

        userCardRoot.replaceChildren(createCard({
          name: identityName,
          quote: profile.motto || '點擊左側照片，可上傳自己的照片；座右銘可由右上角「個人化設定」修改。',
          photo: profile.photo || fallbackAvatar
        }, { user: true }));

        ambassadorContainer.replaceChildren(...ambassadors.map((person, index) => createCard({
          ...person,
          photo: `${imageBase}${person.id}.jpg`
        }, { href: person.url, delay: (index + 1) * 55 })));
      }

      function openProfileEditor() {
        mottoInput.value = profile.motto;
        autoName.textContent = `姓名已自動串接：${identityName}`;
        modal.classList.add('open');
        window.setTimeout(() => mottoInput.focus(), 50);
      }

      function closeProfileEditor() {
        modal.classList.remove('open');
      }

      document.getElementById('open-profile').addEventListener('click', openProfileEditor);
      document.getElementById('close-profile').addEventListener('click', closeProfileEditor);
      document.getElementById('save-profile').addEventListener('click', () => {
        profile.motto = mottoInput.value.trim();
        profile.initialized = true;
        saveProfile();
        closeProfileEditor();
        render();
      });
      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeProfileEditor();
      });

      photoUpload.addEventListener('change', () => {
        const file = photoUpload.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxWidth = 1024;
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const context = canvas.getContext('2d');
            if (!context) return;
            context.drawImage(img, 0, 0, canvas.width, canvas.height);
            profile.photo = canvas.toDataURL('image/jpeg', .82);
            profile.initialized = true;
            saveProfile();
            render();
          };
          img.src = String(reader.result || '');
        };
        reader.readAsDataURL(file);
        photoUpload.value = '';
      });

      document.getElementById('reset-profile').addEventListener('click', () => {
        profile = { motto: '', photo: '', initialized: false };
        localStorage.removeItem(PROFILE_KEY);
        render();
        openProfileEditor();
      });

      render();
      if (!profile.initialized) openProfileEditor();
    })();
  </script>
</body>
</html>
