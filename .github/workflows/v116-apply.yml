name: v116 apply

on:
  push:
    branches:
      - safe/v116-notification-tabs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply requested changes
        run: python3 scripts/v116_apply.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: TypeScript diagnostic
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit verified source
        run: |
          rm -f scripts/v116_apply.py .github/workflows/v116-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified source changes to commit"
            exit 0
          fi
          git commit -m "v116：通知分頁與訊息版面精簡"
          git push origin HEAD:safe/v116-notification-tabs
