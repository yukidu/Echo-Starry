name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echostars-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Upload Cloudflare Worker version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          export WRANGLER_OUTPUT_FILE="$RUNNER_TEMP/wrangler-output.jsonl"
          rm -f "$WRANGLER_OUTPUT_FILE"

          set +e
          npx wrangler versions upload --message "GitHub ${GITHUB_SHA}"
          WRANGLER_STATUS=$?
          set -e

          if [ ! -s "$WRANGLER_OUTPUT_FILE" ]; then
            echo "Wrangler did not report a completed version upload."
            exit "$WRANGLER_STATUS"
          fi

          VERSION_ID="$(node -e 'const fs=require("fs"); const p=process.env.WRANGLER_OUTPUT_FILE; const xs=fs.readFileSync(p,"utf8").trim().split(/\n+/).map(x=>JSON.parse(x)); const hit=[...xs].reverse().find(x=>x.type==="version-upload"&&x.version_id); if(!hit) process.exit(2); process.stdout.write(hit.version_id)')"
          test -n "$VERSION_ID"
          echo "Uploaded Worker version: $VERSION_ID"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

          if [ "$WRANGLER_STATUS" -ne 0 ]; then
            echo "Wrangler returned $WRANGLER_STATUS after Cloudflare accepted the version; continuing with the verified version ID."
          fi
      - name: Promote version to Cloudflare Production
        shell: bash
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/cloudflare-deployment.json"
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/echostars/deployments" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"strategy\":\"percentage\",\"versions\":[{\"version_id\":\"${VERSION_ID}\",\"percentage\":100}]}" \
            -o "$OUT"
          DEPLOY_JSON="$OUT" node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.env.DEPLOY_JSON,"utf8")); if(x.success!==true||!x.result?.id){console.error("Cloudflare deployment API did not return success"); process.exit(1)}'
      - name: Verify production domains
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://echo.starry.phd/ \
            https://id.starry.phd/auth/starry-ai; do
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 --max-time 30 "$url" >/dev/null
          done
