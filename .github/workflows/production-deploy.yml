name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echostars-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Verify Cloudflare Production deployment
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/echostars/deployments"
          OUT="$RUNNER_TEMP/cloudflare-deployments.json"
          COMMIT_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"

          for attempt in $(seq 1 12); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$API" -o "$OUT"

            if DEPLOY_JSON="$OUT" COMMIT_EPOCH="$COMMIT_EPOCH" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.DEPLOY_JSON, 'utf8'));
          const raw = payload?.result;
          const deployments = Array.isArray(raw) ? raw : (Array.isArray(raw?.deployments) ? raw.deployments : []);
          const latest = deployments[0];
          if (payload?.success !== true || !latest?.id || !latest?.created_on) process.exit(1);
          const createdEpoch = Math.floor(Date.parse(latest.created_on) / 1000);
          const commitEpoch = Number(process.env.COMMIT_EPOCH || 0);
          const versions = Array.isArray(latest.versions) ? latest.versions : [];
          const totalPercentage = versions.reduce((sum, item) => sum + Number(item?.percentage || 0), 0);
          if (!Number.isFinite(createdEpoch) || createdEpoch < commitEpoch || totalPercentage < 99.99) process.exit(1);
          console.log(`Cloudflare Production deployment ${latest.id} is active at ${totalPercentage}%`);
          NODE
            then
              exit 0
            fi

            echo "Waiting for Cloudflare Production deployment (${attempt}/12)..."
            sleep 5
          done

          echo "No fresh 100% Cloudflare Production deployment was confirmed for this main commit."
          cat "$OUT"
          exit 1
      - name: Verify production domains
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://starry.phd/ \
            https://id.starry.phd/auth/starry-ai \
            https://echo.starry.phd/ \
            https://go.starry.phd/ \
            https://download.starry.phd/ \
            https://mirror.starry.phd/ \
            https://eye.starry.phd/ \
            https://sync.starry.phd/ \
            https://ai.starry.phd/; do
            echo "Verifying $url"
            curl --fail --silent --show-error --location --retry 6 --retry-delay 3 --max-time 30 "$url" >/dev/null
          done
