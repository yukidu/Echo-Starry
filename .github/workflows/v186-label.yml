name: v186 authorized-only label

on:
  push:
    branches: [safe/v186-authorized-only-label]
    paths:
      - '.github/workflows/v186-label.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v186-authorized-only-label
          fetch-depth: 0
      - name: Update label copy and commit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/UploadModal.tsx')
          text = path.read_text()
          old_label = '                  只對有權限者顯示\n'
          new_label = '                  只對有權限者顯示(從首頁隱藏)\n'
          old_help = '勾選「只對有權限者顯示」後，未達瀏覽權限的會員與所有訪客都不會在首頁看到此音檔；「訪客可見」會自動取消並鎖定。'
          new_help = '勾選「只對有權限者顯示(從首頁隱藏)」後，未達瀏覽權限的會員與所有訪客都不會在首頁看到此音檔；「訪客可見」會自動取消並鎖定。'
          if old_label not in text or old_help not in text:
              raise SystemExit('target copy not found')
          path.write_text(text.replace(old_label, new_label, 1).replace(old_help, new_help, 1))
          PY
          git config user.name "EchoStars Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/UploadModal.tsx
          git commit -m "v186: clarify authorized-only home-hidden label"
          git push origin HEAD:safe/v186-authorized-only-label
