name: Apply offline audio v94

# retry after synchronizing the new offline-retention tests
on:
  push:
    branches:
      - fix/offline-audio-loading-v94
    paths:
      - '.github/workflows/apply-offline-audio-v94.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-audio-loading-v94
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source changes
        run: node .github/scripts/apply-offline-audio-v94.mjs
      - name: Install dependencies
        run: npm install
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "優化播放緩衝與真正離線音檔保存"
          git push origin HEAD:fix/offline-audio-loading-v94
