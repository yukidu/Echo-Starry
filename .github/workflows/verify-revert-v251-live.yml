name: verify reverted Starry ID live

on:
  push:
    branches:
      - verify/revert-v251-live
    paths:
      - .github/workflows/verify-revert-v251-live.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live site has no v251 card theme selector
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 StarryProductionCheck/1.0'
          curl -fsSL --retry 3 --retry-delay 2 -A "$UA" 'https://id.starry.phd/' -o /tmp/home.html
          curl -fsSL --retry 3 --retry-delay 2 -A "$UA" 'https://id.starry.phd/7392157' -o /tmp/card.html
          grep -Fq 'Starry ID' /tmp/home.html
          grep -Fq '張佑安' /tmp/card.html
          grep -Fq '7392157' /tmp/card.html
          for marker in 'v251CardThemeSelect' 'v251-card-theme-style' 'v251-card-theme-script' 'data-card-theme='; do
            if grep -Fq "$marker" /tmp/home.html || grep -Fq "$marker" /tmp/card.html; then
              echo "Unexpected v251 marker still live: $marker" >&2
              exit 1
            fi
          done
          echo 'Reverted production verified: no v251 card theme selector/style markers remain.'
