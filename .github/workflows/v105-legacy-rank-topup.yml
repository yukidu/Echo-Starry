name: v105 legacy rank inventory topup

on:
  push:
    branches:
      - safe/v105-one-time-rank-sticker-topup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v105-one-time-rank-sticker-topup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply patch
        run: python scripts/v105_topup_patch.py
      - name: Full test suite
        run: npm test
      - name: TypeScript diagnostic
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/stickerRouter.ts tests/stickerTransactions.test.ts src/changelogReleaseNotes.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "v105: one-time legacy rank sticker inventory topup"
          git push origin HEAD:safe/v105-one-time-rank-sticker-topup
