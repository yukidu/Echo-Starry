name: Finalize v102 organization model

on:
  push:
    branches: [safe/v102-clean-architecture]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v102-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply organization model cleanup
        run: node .github/scripts/finalize-v102-organization.mjs
      - name: Verify TypeScript and build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit cleanup and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/finalize-v102-organization.mjs .github/workflows/finalize-v102-organization.yml
          git add worker/organizationModel.ts schema.sql
          git commit -m "v102: stabilize organization identity and schema"
          git push origin HEAD:safe/v102-clean-architecture
