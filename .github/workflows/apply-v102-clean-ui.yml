name: Apply v102 clean UI refactor

on:
  push:
    branches: [safe/v102-clean-architecture]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v102-clean-architecture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic refactor
        run: node .github/scripts/apply-v102-ui-refactor.mjs
      - name: Verify changed sources compile
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit clean refactor and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-v102-ui-refactor.mjs .github/workflows/apply-v102-clean-ui.yml
          git add src/App.tsx src/components/AdminModal.tsx
          git commit -m "v102: clean immediate lucky draw and full-page admin"
          git push origin HEAD:safe/v102-clean-architecture
