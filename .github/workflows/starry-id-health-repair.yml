name: Repair Starry ID Central Database Health

# Never run production D1 mutations on a main push.
# Manual execution additionally requires the exact typed approval phrase.
on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: 'Type REPAIR_STARRY_ID_PRODUCTION to authorize production D1 changes'
        required: true
        type: string

permissions:
  contents: read

# Serialize all privileged workflows across this repository.
concurrency:
  group: starry-production-write
  cancel-in-progress: false

env:
  STARRY_ID_D1_ID: 01195c92-555e-4816-bddc-5b8cb2e795db

jobs:
  repair-and-verify:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approval_phrase == 'REPAIR_STARRY_ID_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: starry-production-write
    steps:
      - name: Verify independent production approval gate
        shell: bash
        env:
          STARRY_PRODUCTION_WRITE_APPROVAL_KEY: ${{ secrets.STARRY_PRODUCTION_WRITE_APPROVAL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STARRY_PRODUCTION_WRITE_APPROVAL_KEY:-}" ]; then
            echo 'Production access disabled: configure protected environment and approval secret.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate code before production database access
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          node --check starry-id/repairCentralHealth.mjs
          node --check starry-id/verifyCentralHealth.mjs
          node --check starry-id/capture-time-travel-bookmark.mjs
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${STARRY_ID_D1_ID:-}"
      - name: Capture immediate pre-repair D1 recovery point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p starry-id/audit-output
          node starry-id/capture-time-travel-bookmark.mjs | tee starry-id/audit-output/pre-repair-backup-bookmark.json
      - name: Execute controlled central health repair
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node starry-id/repairCentralHealth.mjs | tee starry-id/audit-output/repair-console.json
      - name: Install central database protections
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute starry_id_db --remote --file=starry-id/migrations/20261016_central_health_guards.sql --yes
          npx wrangler d1 execute starry_id_db --remote --file=starry-id/migrations/20261017_profile_semantic_guards.sql --yes
      - name: Deep verify repaired central database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node starry-id/verifyCentralHealth.mjs | tee starry-id/audit-output/verify-public.json
      - name: Encrypt duplicate distributor ID private report
        shell: bash
        run: |
          set -euo pipefail
          private='starry-id/audit-output/duplicate-amway-private.json'
          test -s "$private"
          base64 --decode starry-id/repair-report-public-key.txt > /tmp/report-public.der
          openssl pkey -pubin -inform DER -in /tmp/report-public.der -noout
          openssl rand -base64 48 > /tmp/report-passphrase.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$private" \
            -out starry-id/audit-output/duplicate-amway-private.json.enc \
            -pass file:/tmp/report-passphrase.txt
          openssl pkeyutl -encrypt -pubin -keyform DER -inkey /tmp/report-public.der \
            -in /tmp/report-passphrase.txt \
            -out starry-id/audit-output/duplicate-amway-private.key.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          printf '{"containsPII":true,"plaintextUploaded":false,"encryption":"AES-256-CBC/PBKDF2-200000 + RSA-OAEP-SHA256"}\n' \
            > starry-id/audit-output/duplicate-amway-private.manifest.json
          rm -f "$private" /tmp/report-passphrase.txt /tmp/report-public.der
          test ! -e "$private"
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starry-id-v307-health-repair
          path: |
            starry-id/audit-output/pre-repair-backup-bookmark.json
            starry-id/audit-output/repair-public.json
            starry-id/audit-output/verify-public.json
            starry-id/audit-output/duplicate-amway-private.json.enc
            starry-id/audit-output/duplicate-amway-private.key.enc
            starry-id/audit-output/duplicate-amway-private.manifest.json
          if-no-files-found: warn
          retention-days: 7
