name: Verify v103 sticker guide integration

on:
  push:
    branches:
      - safe/v103-sticker-guide-table
    paths:
      - .github/workflows/v103-sticker-guide-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v103-sticker-guide-table
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Connect sticker guide to current v102 code
        run: python3 scripts/patch-v103-sticker-guide.py
      - name: Full tests
        run: npm test
      - name: TypeScript diagnostic
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified integration and remove temporary tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-v103-sticker-guide.mjs scripts/patch-v103-sticker-guide.py .github/workflows/v103-sticker-guide.yml .github/workflows/v103-sticker-guide-patch.yml
          git add -A
          git commit -m "v103: connect personalized sticker guide to history page"
          git push origin HEAD:safe/v103-sticker-guide-table
