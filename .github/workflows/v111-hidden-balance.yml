name: v111 hidden balance correction

on:
  push:
    branches: [safe/v111-hidden-balance-correction]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v111-hidden-balance-correction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v111 wiring
        run: python3 scripts/apply_v111_hidden_balance.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run every regression test file
        shell: bash
        run: |
          set +e
          failed=0
          total=0
          passed=0
          for test_file in tests/*.test.ts; do
            total=$((total + 1))
            echo "TEST FILE: ${test_file}"
            node --import tsx --test "${test_file}"
            status=$?
            if [ ${status} -eq 0 ]; then
              passed=$((passed + 1))
            else
              failed=1
              echo "FAIL: ${test_file} (exit ${status})"
            fi
          done
          echo "Regression files passed: ${passed}/${total}"
          exit ${failed}
      - name: TypeScript diagnostic
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified source only
        shell: bash
        run: |
          rm -f scripts/apply_v111_hidden_balance.py .github/workflows/v111-hidden-balance.yml
          git config user.name "yukidu"
          git config user.email "yukidu@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 1
          fi
          git commit -m "v111：加入會員不可見的貼紙餘額校正機制"
          git push origin HEAD:safe/v111-hidden-balance-correction
