name: One-off v82 keyword controls

on:
  push:
    branches: [ui/keyword-controls-v82]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/keyword-controls-v82
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/App.tsx')
          text = app.read_text()
          replacements = [
            ('網友關鍵字（可複選多個條件）', '網友關鍵字(可複選多個)'),
            ('className="text-[10px] text-slate-400"', 'className="text-sm font-bold text-slate-400"'),
            ('清除條件', '重設'),
            ('className="text-[11px] text-slate-400 hover:text-rose-500 underline cursor-pointer"', 'className="text-sm font-bold text-slate-500 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-300 underline cursor-pointer"'),
            ('className="absolute top-1 right-1 z-10 text-slate-400 hover:text-slate-600 text-xs px-1"', 'className="absolute top-1 right-1 z-10 w-11 h-11 rounded-full flex items-center justify-center bg-rose-100/95 dark:bg-rose-950/90 text-rose-600 dark:text-rose-300 hover:bg-rose-200 dark:hover:bg-rose-900 hover:text-rose-700 dark:hover:text-rose-200 text-4xl font-black leading-none shadow-md border-2 border-rose-300 dark:border-rose-700 cursor-pointer"'),
          ]
          for old, new in replacements:
            assert old in text, old
            text = text.replace(old, new, 1)
          app.write_text(text)

          test = Path('tests/homeKeywordCounts.test.ts')
          t = test.read_text()
          t = t.replace('網友關鍵字（可複選多個條件）', '網友關鍵字\\(可複選多個\\)')
          t += "\n\ntest('keyword controls use consistent readable sizing and an oversized close control', () => {\n  assert.match(app, /網友關鍵字\\(可複選多個\\)/);\n  assert.match(app, />重設<\\/button>/);\n  assert.match(app, /showKeywordsDrawer \? '▲ 收起' : '▼ 展開'/);\n  assert.match(app, /text-sm font-bold text-slate-400/);\n  assert.match(app, /w-11 h-11[\\s\\S]*text-4xl font-black/);\n});\n"
          test.write_text(t)

          changelog = Path('src/changelogReleaseNotes.ts')
          c = changelog.read_text()
          anchor = "    '交叉篩選後結果為 0 的候選關鍵字會立即隱藏；取消條件後只要重新有符合音檔就會自動出現。已選條件仍保留可移除入口。',\n"
          note = "    '首頁網友關鍵字操作再整理：標題改為「網友關鍵字(可複選多個)」，「清除條件」簡化為「重設」，收起、展開、重設文字與標題同級放大，關鍵字面板右上角關閉 X 改成大型高對比按鈕，手機更容易辨識與點擊。',\n"
          assert anchor in c
          changelog.write_text(c.replace(anchor, anchor + note, 1))

          sw = Path('public/sw.js')
          s = sw.read_text()
          assert 'echostars-shell-v81' in s
          sw.write_text(s.replace('echostars-shell-v81', 'echostars-shell-v82', 1))

          release = Path('tests/releaseIntegrity.test.ts')
          r = release.read_text()
          assert "test('v81 is the single current PWA cache version'" in r
          r = r.replace("test('v81 is the single current PWA cache version'", "test('v82 is the single current PWA cache version'", 1)
          r = r.replace('echostars-shell-v81', 'echostars-shell-v82')
          release.write_text(r)
          PY
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx tests/homeKeywordCounts.test.ts src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts
          git diff --cached --check
          git commit -m '調整網友關鍵字控制文字與關閉按鈕'
          git push origin HEAD:ui/keyword-controls-v82
