name: One-off v83 keyword toolbar polish

on:
  push:
    branches: [ui/keyword-toolbar-polish-v83]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/keyword-toolbar-polish-v83
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          def rep(old, new, count=1):
              global text
              assert old in text, old
              text = text.replace(old, new, count)

          rep('w-full pl-10 pr-9 py-2.5 rounded-2xl', 'w-full pl-10 pr-9 h-[46px] py-0 rounded-2xl')
          rep('px-3.5 sm:px-4 py-2.5 rounded-2xl text-white font-bold', 'h-[46px] px-3.5 sm:px-4 py-0 rounded-2xl text-white font-bold')
          rep('className="absolute top-1 right-1 z-10 w-11 h-11 rounded-full flex items-center justify-center bg-rose-100/95 dark:bg-rose-950/90 text-rose-600 dark:text-rose-300 hover:bg-rose-200 dark:hover:bg-rose-900 hover:text-rose-700 dark:hover:text-rose-200 text-4xl font-black leading-none shadow-md border-2 border-rose-300 dark:border-rose-700 cursor-pointer"', 'className="absolute top-1 right-1 z-10 w-11 h-11 rounded-full flex items-center justify-center hover:brightness-110 text-4xl font-black leading-none shadow-md border-2 cursor-pointer transition-all"\n                    style={{ backgroundColor: \'var(--color-light-pill, #ffffff)\', color: \'var(--color-primary, #c06c84)\', borderColor: \'var(--color-primary, #c06c84)\' }}')
          rep('px-2 py-1 rounded-lg text-sm font-semibold transition-colors cursor-pointer border', 'px-2 py-1 rounded-lg text-sm font-normal transition-colors cursor-pointer border')
          rep('rounded-full text-sm font-semibold bg-amber-100', 'rounded-full text-sm font-normal bg-amber-100')
          rep('px-2.5 py-1 rounded-xl text-sm font-medium transition-colors cursor-pointer flex items-center gap-1', 'px-2.5 py-1 rounded-xl text-sm font-normal transition-colors cursor-pointer flex items-center gap-1')
          rep('border border-amber-300 font-bold', 'border border-amber-300')
          rep('w-full min-w-0 px-0 py-1 rounded-xl text-[10px] sm:text-xs font-bold transition-all', 'w-full h-[46px] min-w-0 px-0 py-0 rounded-xl text-[10px] sm:text-xs font-bold transition-all')
          rep('ring-2 ring-white/95 text-white brightness-110 font-black scale-102', 'ring-2 ring-white/95 text-white brightness-110 font-black')
          rep('w-full min-w-0 px-0 py-1 rounded-xl text-[10px] sm:text-xs font-bold text-white flex items-center justify-center gap-0 shadow-2xs hover:brightness-105 transition-all', 'w-full h-[46px] min-w-0 px-0 py-0 rounded-xl text-[10px] sm:text-xs font-bold text-white flex items-center justify-center gap-0 shadow-2xs hover:brightness-105 transition-all', 2)
          app.write_text(text)

          test = Path('tests/homeKeywordCounts.test.ts')
          t = test.read_text()
          assert 'px-2 py-1 rounded-lg text-sm font-semibold' in t
          t = t.replace('px-2 py-1 rounded-lg text-sm font-semibold', 'px-2 py-1 rounded-lg text-sm font-normal', 1)
          t += "\n\ntest('keyword chips stay regular weight, close button follows palette, and sort controls match search height', () => {\n  assert.match(app, /px-2 py-1 rounded-lg text-sm font-normal/);\n  assert.match(app, /rounded-full text-sm font-normal bg-amber-100/);\n  assert.match(app, /px-2\\.5 py-1 rounded-xl text-sm font-normal/);\n  assert.match(app, /backgroundColor: 'var\\(--color-light-pill, #ffffff\\)'/);\n  assert.match(app, /color: 'var\\(--color-primary, #c06c84\\)'/);\n  assert.match(app, /borderColor: 'var\\(--color-primary, #c06c84\\)'/);\n  assert.match(app, /pl-10 pr-9 h-\\[46px\\] py-0 rounded-2xl/);\n  assert.match(app, /h-\\[46px\\] px-3\\.5 sm:px-4 py-0 rounded-2xl/);\n  assert.ok((app.match(/w-full h-\\[46px\\] min-w-0/g) || []).length >= 3);\n});\n"
          test.write_text(t)

          changelog = Path('src/changelogReleaseNotes.ts')
          c = changelog.read_text()
          anchor = "    '首頁網友關鍵字操作再整理：標題改為「網友關鍵字(可複選多個)」，「清除條件」簡化為「重設」，收起、展開、重設文字與標題同級放大，關鍵字面板右上角關閉 X 改成大型高對比按鈕，手機更容易辨識與點擊。',\n"
          note = "    '首頁網友關鍵字視覺再統一：關閉 X 會跟著目前調色盤主色同步；展開清單與已選條件中的關鍵字都改為一般字重；排序整排按鈕與上方搜尋框統一高度，切換排序時不再因縮放造成高度跳動。',\n"
          assert anchor in c
          changelog.write_text(c.replace(anchor, anchor + note, 1))

          sw = Path('public/sw.js')
          s = sw.read_text()
          assert 'echostars-shell-v82' in s
          sw.write_text(s.replace('echostars-shell-v82', 'echostars-shell-v83', 1))

          release = Path('tests/releaseIntegrity.test.ts')
          r = release.read_text()
          assert "test('v82 is the single current PWA cache version'" in r
          r = r.replace("test('v82 is the single current PWA cache version'", "test('v83 is the single current PWA cache version'", 1)
          r = r.replace('echostars-shell-v82', 'echostars-shell-v83')
          release.write_text(r)
          PY
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx tests/homeKeywordCounts.test.ts src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts
          git diff --cached --check
          git commit -m '統一關鍵字字重與排序工具列高度'
          git push origin HEAD:ui/keyword-toolbar-polish-v83
