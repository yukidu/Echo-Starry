name: Preview v185 feature patch

on:
  push:
    branches: [preview-v185-access-profile-social]
    paths:
      - '.github/workflows/preview-v185-feature-patch.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-v185-access-profile-social
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply preview feature changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def once(path, old, new):
              s = read(path)
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              write(path, s.replace(old, new, 1))
          def remove_between(path, start, end):
              s = read(path)
              a = s.find(start)
              if a < 0: raise SystemExit(f'Start marker missing in {path}: {start}')
              b = s.find(end, a)
              if b < 0: raise SystemExit(f'End marker missing in {path}: {end}')
              write(path, s[:a] + s[b:])

          # ---------- shared types ----------
          once('src/types.ts',
          "export interface ExternalLinkItem {\n  name: string;\n  url: string;\n}\n",
          "export interface ExternalLinkItem {\n  name: string;\n  url: string;\n}\n\nexport type SocialPlatform = 'IG' | 'FB' | 'Youtube' | 'Threads(脆)' | '抖音' | '自訂文字';\nexport interface SocialLinkItem {\n  platform: SocialPlatform;\n  name: string;\n  url: string;\n}\n")
          once('src/types.ts',
          "  guestVisible?: boolean; // Only adds this recording to the guest home list; never grants playback permission.\n",
          "  guestVisible?: boolean; // Only adds this recording to the guest home list; never grants playback permission.\n  authorizedOnlyVisible?: boolean; // Hide completely unless the signed-in member meets browse permission.\n")
          once('src/types.ts',
          "  externalFiles?: ExternalLinkItem[];\n",
          "  externalFiles?: ExternalLinkItem[];\n  socialLinks?: SocialLinkItem[];\n")

          # ---------- profile completion: phone/email never gate reward ----------
          once('shared/profileCompletion.ts',
          "export const PROFILE_REQUIRED_FIELDS = ['name','avatar','amwayId','phone','residence','center','rank','joinReason','stayReason','sponsor','platinumUpline','diamondUpline','birthday'] as const;",
          "export const PROFILE_REQUIRED_FIELDS = ['name','avatar','amwayId','residence','center','rank','joinReason','stayReason','sponsor','platinumUpline','diamondUpline','birthday'] as const;")

          # ---------- visitor/member visibility policy ----------
          once('src/visitorTrackPolicy.ts',
          "  guestVisible?: boolean | number;\n  stickerUnlockCost?: number | null;",
          "  guestVisible?: boolean | number;\n  authorizedOnlyVisible?: boolean | number;\n  stickerUnlockCost?: number | null;")
          once('src/visitorTrackPolicy.ts',
          "  return isPublicRecording(track) && !track.isPrivateVip && isFreeForGuest(track);",
          "  return !Boolean(track.authorizedOnlyVisible) && isPublicRecording(track) && !track.isPrivateVip && isFreeForGuest(track);")
          once('src/visitorTrackPolicy.ts',
          "  return isGuest && isSharedDetail && isPublicRecording(track) && !track.isPrivateVip;",
          "  return isGuest && isSharedDetail && !Boolean(track.authorizedOnlyVisible) && isPublicRecording(track) && !track.isPrivateVip;")

          Path('src/trackVisibilityPolicy.ts').write_text("""type PermissionVisibilityTrack = { authorizedOnlyVisible?: boolean | number };

export function canAppearInHomeForViewer(
  track: PermissionVisibilityTrack,
  isLoggedIn: boolean,
  canAccess: boolean
): boolean {
  if (!Boolean(track.authorizedOnlyVisible)) return true;
  return isLoggedIn && canAccess;
}
""")

          # ---------- App home filtering + direct detail guard ----------
          once('src/App.tsx',
          "import { isVisibleOnGuestHome, canGuestPlayPublicShare } from './visitorTrackPolicy';\n",
          "import { isVisibleOnGuestHome, canGuestPlayPublicShare } from './visitorTrackPolicy';\nimport { canAppearInHomeForViewer } from './trackVisibilityPolicy';\n")
          once('src/App.tsx',
          "      ...(track.externalPpts || []).flatMap(file => [file.name, file.url])\n",
          "      ...(track.externalPpts || []).flatMap(file => [file.name, file.url]),\n      ...(track.socialLinks || []).flatMap(link => [link.platform, link.name, link.url])\n")
          once('src/App.tsx',
          "              if (found) {\n                visitorShareTrackId.current = found.id;",
          "              if (found && canAppearInHomeForViewer(found, Boolean(currentUser), checkCanAccess(found))) {\n                visitorShareTrackId.current = found.id;")
          once('src/App.tsx',
          "    const filtered = trackList.filter(t => {\n      if (!currentUser && !isVisibleOnGuestHome(t)) return false;",
          "    const filtered = trackList.filter(t => {\n      if (!canAppearInHomeForViewer(t, Boolean(currentUser), checkCanAccess(t))) return false;\n      if (!currentUser && !isVisibleOnGuestHome(t)) return false;")

          # ---------- D1 schema migration wrapper ----------
          once('worker/favoriteRouter.ts',
          "      if (!columns.has('favoriteCount')) {\n        try { await db.prepare('ALTER TABLE tracks ADD COLUMN favoriteCount INTEGER DEFAULT 0').run(); }\n        catch (error) {\n          const check = await db.prepare('PRAGMA table_info(tracks)').all();\n          if (!check.results.some((row: any) => row.name === 'favoriteCount')) throw error;\n        }\n      }",
          "      if (!columns.has('favoriteCount')) {\n        try { await db.prepare('ALTER TABLE tracks ADD COLUMN favoriteCount INTEGER DEFAULT 0').run(); }\n        catch (error) {\n          const check = await db.prepare('PRAGMA table_info(tracks)').all();\n          if (!check.results.some((row: any) => row.name === 'favoriteCount')) throw error;\n        }\n      }\n      if (!columns.has('authorizedOnlyVisible')) {\n        try { await db.prepare('ALTER TABLE tracks ADD COLUMN authorizedOnlyVisible INTEGER DEFAULT 0').run(); }\n        catch (error) {\n          const check = await db.prepare('PRAGMA table_info(tracks)').all();\n          if (!check.results.some((row: any) => row.name === 'authorizedOnlyVisible')) throw error;\n        }\n      }\n      if (!columns.has('socialLinks')) {\n        try { await db.prepare(\"ALTER TABLE tracks ADD COLUMN socialLinks TEXT DEFAULT '[]'\").run(); }\n        catch (error) {\n          const check = await db.prepare('PRAGMA table_info(tracks)').all();\n          if (!check.results.some((row: any) => row.name === 'socialLinks')) throw error;\n        }\n      }")
          once('worker/favoriteRouter.ts',
          "    const favoriteAction = url.pathname.match(/^\\/api\\/tracks\\/([^/]+)\\/favorite$/);\n    const trackList = url.pathname === '/api/tracks' && method === 'GET';\n\n    if (!favoriteAction && !trackList) return appWorker.fetch(request, env);",
          "    const favoriteAction = url.pathname.match(/^\\/api\\/tracks\\/([^/]+)\\/favorite$/);\n    const trackRoute = url.pathname === '/api/tracks' || url.pathname.startsWith('/api/tracks/');\n\n    if (!favoriteAction && !trackRoute) return appWorker.fetch(request, env);")
          once('worker/favoriteRouter.ts',
          "    if (trackList) return appWorker.fetch(request, env);\n",
          "    if (!favoriteAction) return appWorker.fetch(request, env);\n")

          # ---------- Worker track persistence ----------
          once('worker/index.ts',
          "                  externalFiles: t.externalFiles ? JSON.parse(t.externalFiles) : [],\n                  likedBy: t.likedBy ? JSON.parse(t.likedBy) : [],",
          "                  externalFiles: t.externalFiles ? JSON.parse(t.externalFiles) : [],\n                  socialLinks: t.socialLinks ? JSON.parse(t.socialLinks) : [],\n                  likedBy: t.likedBy ? JSON.parse(t.likedBy) : [],")
          once('worker/index.ts',
          "                  guestVisible: Boolean(t.guestVisible),\n                  isPrivateVip: Boolean(t.isPrivateVip)",
          "                  guestVisible: Boolean(t.guestVisible),\n                  authorizedOnlyVisible: Boolean(t.authorizedOnlyVisible),\n                  isPrivateVip: Boolean(t.isPrivateVip)")
          once('worker/index.ts',
          "          if (body.guestVisible !== undefined && typeof body.guestVisible !== 'boolean') return errorResponse('訪客可見格式錯誤', 400);",
          "          if (body.guestVisible !== undefined && typeof body.guestVisible !== 'boolean') return errorResponse('訪客可見格式錯誤', 400);\n          if (body.authorizedOnlyVisible !== undefined && typeof body.authorizedOnlyVisible !== 'boolean') return errorResponse('只對有權限者顯示格式錯誤', 400);")
          once('worker/index.ts',
          "          const cleanFiles = Array.isArray(body.externalFiles) ? body.externalFiles : [];\n",
          "          const cleanFiles = Array.isArray(body.externalFiles) ? body.externalFiles : [];\n          const cleanSocialLinks = Array.isArray(body.socialLinks) ? body.socialLinks : [];\n")
          once('worker/index.ts',
          "            ...body,\n            guestVisible: body.guestVisible === true,",
          "            ...body,\n            authorizedOnlyVisible: body.authorizedOnlyVisible === true,\n            guestVisible: body.authorizedOnlyVisible === true ? false : body.guestVisible === true,")
          once('worker/index.ts',
          "            externalFiles: cleanFiles,\n            likedBy: cleanLikedBy,",
          "            externalFiles: cleanFiles,\n            socialLinks: cleanSocialLinks,\n            likedBy: cleanLikedBy,")
          once('worker/index.ts',
          "                  externalVideos, externalPpts, externalFiles, likedBy, ratings, vipToken, vipExpiresAt, vipDurationDays, keywordMeta, guestVisible\n                ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)",
          "                  externalVideos, externalPpts, externalFiles, likedBy, ratings, vipToken, vipExpiresAt, vipDurationDays, keywordMeta, guestVisible, socialLinks, authorizedOnlyVisible\n                ) VALUES (${Array(36).fill('?').join(', ')})")
          once('worker/index.ts',
          "                JSON.stringify(newTrack.externalPpts), JSON.stringify(newTrack.externalFiles),\n                JSON.stringify(newTrack.likedBy), JSON.stringify(newTrack.ratings), newTrack.vipToken, newTrack.vipExpiresAt, newTrack.vipDurationDays, JSON.stringify(newTrack.keywordMeta), newTrack.guestVisible ? 1 : 0\n",
          "                JSON.stringify(newTrack.externalPpts), JSON.stringify(newTrack.externalFiles),\n                JSON.stringify(newTrack.likedBy), JSON.stringify(newTrack.ratings), newTrack.vipToken, newTrack.vipExpiresAt, newTrack.vipDurationDays, JSON.stringify(newTrack.keywordMeta), newTrack.guestVisible ? 1 : 0, JSON.stringify(newTrack.socialLinks), newTrack.authorizedOnlyVisible ? 1 : 0\n")
          once('worker/index.ts',
          "            if (has('guestVisible')) {\n              if (typeof body.guestVisible !== 'boolean') return errorResponse('訪客可見格式錯誤', 400);\n              add('guestVisible', body.guestVisible ? 1 : 0);\n            }",
          "            if (has('authorizedOnlyVisible') && typeof body.authorizedOnlyVisible !== 'boolean') return errorResponse('只對有權限者顯示格式錯誤', 400);\n            const nextAuthorizedOnlyVisible = has('authorizedOnlyVisible') ? body.authorizedOnlyVisible === true : Boolean(existing.authorizedOnlyVisible);\n            if (has('authorizedOnlyVisible')) add('authorizedOnlyVisible', nextAuthorizedOnlyVisible ? 1 : 0);\n            if (has('guestVisible')) {\n              if (typeof body.guestVisible !== 'boolean') return errorResponse('訪客可見格式錯誤', 400);\n              add('guestVisible', nextAuthorizedOnlyVisible ? 0 : (body.guestVisible ? 1 : 0));\n            } else if (nextAuthorizedOnlyVisible && Boolean(existing.guestVisible)) {\n              add('guestVisible', 0);\n            }")
          once('worker/index.ts',
          "            for (const field of ['externalVideos', 'externalPpts', 'externalFiles'] as const) {",
          "            for (const field of ['externalVideos', 'externalPpts', 'externalFiles', 'socialLinks'] as const) {")
          once('worker/index.ts',
          "              externalFiles: parseArray(row.externalFiles),\n              likedBy: parseArray(row.likedBy),",
          "              externalFiles: parseArray(row.externalFiles),\n              socialLinks: parseArray(row.socialLinks),\n              likedBy: parseArray(row.likedBy),")
          once('worker/index.ts',
          "              ratings: parseObject(row.ratings),\n              isPrivateVip: Boolean(row.isPrivateVip)",
          "              ratings: parseObject(row.ratings),\n              guestVisible: Boolean(row.guestVisible),\n              authorizedOnlyVisible: Boolean(row.authorizedOnlyVisible),\n              isPrivateVip: Boolean(row.isPrivateVip)")

          # ---------- Upload/Edit modal ----------
          once('src/components/UploadModal.tsx',
          "import { Track, CategoryType, AmwayRank, RANK_ORDER, ExternalLinkItem, UserProfile, SPEAKER_RANK_OPTIONS, GAR_ELIGIBLE_RANKS } from '../types';",
          "import { Track, CategoryType, AmwayRank, RANK_ORDER, ExternalLinkItem, SocialLinkItem, SocialPlatform, UserProfile, SPEAKER_RANK_OPTIONS, GAR_ELIGIBLE_RANKS } from '../types';")
          once('src/components/UploadModal.tsx',
          "const COVER_LIBRARY_CACHE_KEY = 'echostars_cover_library_v3_6';\n",
          "const COVER_LIBRARY_CACHE_KEY = 'echostars_cover_library_v3_6';\nconst SOCIAL_PLATFORM_OPTIONS: SocialPlatform[] = ['IG', 'FB', 'Youtube', 'Threads(脆)', '抖音', '自訂文字'];\n")
          once('src/components/UploadModal.tsx',
          "  const [guestVisible, setGuestVisible] = useState(false);\n  const [requiredRank, setRequiredRank] = useState<AmwayRank>('無');",
          "  const [guestVisible, setGuestVisible] = useState(false);\n  const [authorizedOnlyVisible, setAuthorizedOnlyVisible] = useState(false);\n  const [requiredRank, setRequiredRank] = useState<AmwayRank>('無');")
          once('src/components/UploadModal.tsx',
          "  const [externalFiles, setExternalFiles] = useState<ExternalLinkItem[]>([\n    { name: '', url: '' }\n  ]);",
          "  const [externalFiles, setExternalFiles] = useState<ExternalLinkItem[]>([\n    { name: '', url: '' }\n  ]);\n  const [socialLinks, setSocialLinks] = useState<SocialLinkItem[]>([\n    { platform: 'IG', name: 'IG', url: '' }\n  ]);")
          # Keep existing keyword state only to preserve old data on edit; stop loading/rendering it here.
          once('src/components/UploadModal.tsx', "      loadDbKeywords();\n", "")
          once('src/components/UploadModal.tsx',
          "      setGuestVisible(Boolean(trackToEdit.guestVisible));\n",
          "      setAuthorizedOnlyVisible(Boolean(trackToEdit.authorizedOnlyVisible));\n      setGuestVisible(Boolean(trackToEdit.guestVisible) && !Boolean(trackToEdit.authorizedOnlyVisible));\n")
          once('src/components/UploadModal.tsx',
          "      setExternalFiles(trackToEdit.externalFiles && trackToEdit.externalFiles.length > 0 ? trackToEdit.externalFiles : [{ name: '', url: '' }]);\n",
          "      setExternalFiles(trackToEdit.externalFiles && trackToEdit.externalFiles.length > 0 ? trackToEdit.externalFiles : [{ name: '', url: '' }]);\n      setSocialLinks(trackToEdit.socialLinks && trackToEdit.socialLinks.length > 0 ? trackToEdit.socialLinks.map(link => ({ ...link })) : [{ platform: 'IG', name: 'IG', url: '' }]);\n")
          once('src/components/UploadModal.tsx',
          "      setGuestVisible(false);\n      setStickerUnlockCost(0);",
          "      setGuestVisible(false);\n      setAuthorizedOnlyVisible(false);\n      setStickerUnlockCost(0);")
          once('src/components/UploadModal.tsx',
          "      setExternalFiles([{ name: '', url: '' }]);\n      setAudioFile(null);",
          "      setExternalFiles([{ name: '', url: '' }]);\n      setSocialLinks([{ platform: 'IG', name: 'IG', url: '' }]);\n      setAudioFile(null);")
          once('src/components/UploadModal.tsx',
          "      const cleanFiles = externalFiles.filter(f => f.url.trim());\n",
          "      const cleanFiles = externalFiles.filter(f => f.url.trim());\n      const cleanSocialLinks = socialLinks\n        .filter(link => link.url.trim())\n        .map(link => ({\n          platform: link.platform,\n          name: link.platform === '自訂文字' ? (link.name.trim() || '自訂連結') : link.platform,\n          url: link.url.trim()\n        }));\n")
          once('src/components/UploadModal.tsx',
          "        requiredRank,\n        guestVisible,",
          "        requiredRank,\n        authorizedOnlyVisible,\n        guestVisible: authorizedOnlyVisible ? false : guestVisible,")
          once('src/components/UploadModal.tsx',
          "        externalFiles: cleanFiles,\n        duration: resolvedDurationLabel,",
          "        externalFiles: cleanFiles,\n        socialLinks: cleanSocialLinks,\n        duration: resolvedDurationLabel,")
          once('src/components/UploadModal.tsx',
          "        commentStickerReward: Number(trackObj?.commentStickerReward ?? commentStickerReward ?? 0)\n",
          "        commentStickerReward: Number(trackObj?.commentStickerReward ?? commentStickerReward ?? 0),\n        authorizedOnlyVisible: Boolean(trackObj?.authorizedOnlyVisible ?? authorizedOnlyVisible),\n        guestVisible: Boolean(trackObj?.guestVisible ?? (authorizedOnlyVisible ? false : guestVisible)),\n        socialLinks: Array.isArray(trackObj?.socialLinks) ? trackObj.socialLinks : cleanSocialLinks\n")
          remove_between('src/components/UploadModal.tsx',
                         '          {/* 3.5 網友關鍵字',
                         '          {/* 4. Text Fields Grid */}')
          once('src/components/UploadModal.tsx',
          "            {/* 新需求: 獎銜＝閱讀瀏覽權限 */}\n            <div data-upload-guest-visibility=\"true\">\n              <label className=\"flex items-center gap-2 font-bold text-slate-700 dark:text-slate-300\">\n                <input type=\"checkbox\" checked={guestVisible} onChange={event => setGuestVisible(event.target.checked)} />\n                訪客可見\n              </label>\n              <p className=\"mt-1 text-xs text-slate-500\">讓訪客在首頁看到此音檔；播放仍依權限與貼紙設定判斷。公開音檔預設可見，分享連結可開啟詳細頁。</p>\n            </div>\n",
          "            {/* 瀏覽清單可見性 */}\n            <div data-upload-guest-visibility=\"true\" className=\"sm:col-span-2 rounded-xl border border-slate-200 dark:border-slate-700 p-3\">\n              <div className=\"flex flex-wrap items-center gap-x-5 gap-y-2\">\n                <label className={`flex items-center gap-2 font-bold ${authorizedOnlyVisible ? 'text-slate-400 cursor-not-allowed' : 'text-slate-700 dark:text-slate-300'}`}>\n                  <input type=\"checkbox\" checked={guestVisible} disabled={authorizedOnlyVisible} onChange={event => setGuestVisible(event.target.checked)} />\n                  訪客可見\n                </label>\n                <label className=\"flex items-center gap-2 font-bold text-slate-700 dark:text-slate-300 cursor-pointer\">\n                  <input type=\"checkbox\" checked={authorizedOnlyVisible} onChange={event => { const checked = event.target.checked; setAuthorizedOnlyVisible(checked); if (checked) setGuestVisible(false); }} />\n                  只對有權限者顯示\n                </label>\n              </div>\n              <p className=\"mt-1 text-xs text-slate-500\">勾選「只對有權限者顯示」後，未達瀏覽權限的會員與所有訪客都不會在首頁看到此音檔；「訪客可見」會自動取消並鎖定。</p>\n            </div>\n")
