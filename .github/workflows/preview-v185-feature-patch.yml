name: Preview v185 feature patch

on:
  push:
    branches: [preview-v185-access-profile-social]
    paths:
      - '.github/workflows/preview-v185-feature-patch.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-v185-access-profile-social
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply preview feature changes
        run: python3 scripts/applyV185PreviewPatch.py
      - name: Align profile completion runtime and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bridge_path = Path('src/googleIdentityBridge.ts')
          bridge = bridge_path.read_text()
          old_bridge = """const REQUIRED_PROFILE_FIELDS = [
            'name',
            'amwayId',
            'phone',
            'residence',"""
          new_bridge = """const REQUIRED_PROFILE_FIELDS = [
            'name',
            'amwayId',
            'residence',"""
          if old_bridge not in bridge:
              raise SystemExit('Legacy phone-required runtime field list not found')
          bridge_path.write_text(bridge.replace(old_bridge, new_bridge, 1))

          test_path = Path('tests/profileLoginUx.test.ts')
          test = test_path.read_text()
          old_test = "['name', 'amwayId', 'phone', 'residence', 'center', 'rank', 'joinReason', 'stayReason', 'sponsor', 'platinumUpline', 'diamondUpline', 'birthday']"
          new_test = "['name', 'amwayId', 'residence', 'center', 'rank', 'joinReason', 'stayReason', 'sponsor', 'platinumUpline', 'diamondUpline', 'birthday']"
          if old_test not in test:
              raise SystemExit('Legacy phone-required profile login regression list not found')
          test_path.write_text(test.replace(old_test, new_test, 1))

          print('Aligned profile completion runtime and regression')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        id: regression
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ "$code" -ne 0 ]; then
            {
              echo "Regression failed (exit $code)"
              echo
              echo "--- matching failure lines ---"
              grep -n -E 'not ok|AssertionError|ERR_ASSERTION|Expected|actual|error|fail' test-output.txt | tail -n 160 || true
              echo
              echo "--- final output ---"
              tail -n 180 test-output.txt
            } > ci-failure-summary.txt
            exit "$code"
          fi
      - name: Commit regression failure summary
        if: failure() && steps.regression.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "EchoStars Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci-failure-summary.txt
          git commit -m "chore: capture preview regression failure" || true
          git push origin HEAD:preview-v185-access-profile-social
      - name: TypeScript diagnostic
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit tested feature changes
        shell: bash
        run: |
          git config user.name "EchoStars Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src worker shared tests
          if git diff --cached --quiet; then
            echo "No feature changes to commit"
            exit 1
          fi
          git commit -m "v185-preview: permission-only visibility, profile email and social links"
          git push origin HEAD:preview-v185-access-profile-social
