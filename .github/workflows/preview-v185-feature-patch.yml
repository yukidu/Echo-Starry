name: Preview v185 feature patch

on:
  push:
    branches: [preview-v185-access-profile-social]
    paths:
      - '.github/workflows/preview-v185-feature-patch.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-v185-access-profile-social
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply preview feature changes
        run: python3 scripts/applyV185PreviewPatch.py
      - name: Align profile completion regression with new fields
        shell: bash
        run: >-
          python3 -c "from pathlib import Path; old=\"expect(missingProfileFields(profile)).toEqual(['phone']);\"; new='expect(missingProfileFields(profile)).toEqual([]);'; paths=[p for p in Path('tests').rglob('*.test.ts') if old in p.read_text()]; [p.write_text(p.read_text().replace(old,new,1)) for p in paths]; assert paths, 'Expected legacy phone-required assertion was not found'; print('Updated:', ', '.join(map(str,paths)))"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        run: npm test
      - name: TypeScript diagnostic
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit tested feature changes
        shell: bash
        run: |
          git config user.name "EchoStars Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src worker shared tests
          if git diff --cached --quiet; then
            echo "No feature changes to commit"
            exit 1
          fi
          git commit -m "v185-preview: permission-only visibility, profile email and social links"
          git push origin HEAD:preview-v185-access-profile-social
