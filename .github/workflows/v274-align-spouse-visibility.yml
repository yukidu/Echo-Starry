name: Align v274 spouse visibility policy

on:
  push:
    branches: [fix/v274-spouse-public-card-number]
    paths:
      - 'scripts/v274AlignSpouseVisibilityTests.mjs'
      - '.github/workflows/v274-align-spouse-visibility.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v274-spouse-public-card-number
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align spouse public-display policy and regressions
        run: node scripts/v274AlignSpouseVisibilityTests.mjs
      - name: Remove helper and commit product/test changes
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/v274AlignSpouseVisibilityTests.mjs .github/workflows/v274-align-spouse-visibility.yml
          git add worker/starryIdV222Enhancer.ts tests/starryIdV224SpouseDistributor.test.ts tests/starryIdV253InstantNavigation.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v274): align spouse public display policy and legacy regressions'
          git push origin HEAD:fix/v274-spouse-public-card-number
