name: v271 profile codemod

on:
  push:
    branches:
      - fix/profile-native-motto-fast-sync-v271
    paths:
      - .github/workflows/v271-profile-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-native-motto-fast-sync-v271
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v271 profile cleanup
        run: node scripts/v271-profile-codemod.mjs
      - name: Remove one-time codemod files
        run: |
          rm -f scripts/v271-profile-codemod.mjs
          rm -f .github/workflows/v271-profile-codemod.yml
      - name: Commit cleaned profile architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "v271：原生單一座右銘與同步儲存優化"
          git push origin HEAD:fix/profile-native-motto-fast-sync-v271
