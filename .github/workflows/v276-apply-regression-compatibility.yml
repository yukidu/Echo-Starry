name: Apply v276 regression compatibility
on:
  push:
    branches: [refactor/v276-central-profile-source]
    paths:
      - scripts/v276RegressionCompatibilityPatch.mjs
      - .github/workflows/v276-apply-regression-compatibility.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v276-central-profile-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded compatibility patch
        run: node scripts/v276RegressionCompatibilityPatch.mjs
      - name: Remove one-time helpers and commit
        run: |
          rm scripts/v276RegressionCompatibilityPatch.mjs
          rm .github/workflows/v276-apply-regression-compatibility.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/authRouter.ts worker/batteryRouter.ts tests/starryIdProfileSchema.test.ts tests/v271ProfileNativeMottoFinal.test.ts scripts/v276RegressionCompatibilityPatch.mjs .github/workflows/v276-apply-regression-compatibility.yml
          git commit -m "fix(v276): preserve local-test compatibility and central profile rewards"
          git push origin HEAD:refactor/v276-central-profile-source
