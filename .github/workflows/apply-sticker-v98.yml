name: Apply Sticker v98

on:
  push:
    branches:
      - feature/sticker-economy-v98
    paths:
      - .github/workflows/apply-sticker-v98.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sticker-economy-v98
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Apply sticker v98 patches
        run: python3 scripts/apply_sticker_economy_v98.py
      - name: Full tests
        run: npm test
      - name: TypeScript diagnostics
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src worker shared schema.sql public tests
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "完成貼紙積分機制 v98 整合"
          git push origin HEAD:feature/sticker-economy-v98
