name: v250 live Amway card check

on:
  push:
    branches:
      - verify/v250-live-amway-card
    paths:
      - .github/workflows/v250-live-amway-card-check.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify 7392157 resolves to the correct public card
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0 StarryProductionCheck/1.0' \
            -D /tmp/headers.txt \
            'https://id.starry.phd/7392157' -o /tmp/card.html
          grep -qi '^content-type: text/html' /tmp/headers.txt
          grep -Fq '張佑安' /tmp/card.html
          grep -Fq '7392157' /tmp/card.html
          grep -Fq 'Starry ID 電子名片' /tmp/card.html
          if grep -Fq '"error":"Not found"' /tmp/card.html; then
            echo 'Still returned Not found' >&2
            exit 1
          fi
          echo 'Live direct-ID card verified: 7392157 -> 張佑安'
