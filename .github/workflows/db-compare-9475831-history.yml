name: Diagnostic 9475831 history

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compare:
    if: github.head_ref == 'safe/v229-db-compare'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Read-only history check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/db-history
          npx wrangler d1 execute starry_id_db --remote --command "SELECT p.name,p.amwayId,p.center,p.rank,p.approvedRank,p.rankApproved,p.rankAuditStatus,p.updatedAt,u.status FROM users u JOIN profiles p ON p.userId=u.id WHERE TRIM(COALESCE(p.name,''))='杜杜龍' ORDER BY p.updatedAt DESC LIMIT 20" --json > /tmp/db-history/central-by-name.json
          npx wrangler d1 execute echoes_db --remote --command "SELECT name,amwayId,center,rank,approvedRank,rankApproved,rankAuditStatus FROM users WHERE TRIM(COALESCE(name,''))='杜杜龍' ORDER BY registerDate DESC LIMIT 20" --json > /tmp/db-history/echo-by-name.json
          npx wrangler d1 execute starry_id_db --remote --command "SELECT l.fieldName,l.oldValue,l.newValue,l.appId,l.createdAt FROM profile_audit_logs l JOIN profiles p ON p.userId=l.userId WHERE TRIM(COALESCE(p.name,''))='杜杜龍' AND l.fieldName IN ('amwayId','spouse-single-unlink') ORDER BY l.createdAt DESC LIMIT 50" --json > /tmp/db-history/full-number-audit.json
          npx wrangler d1 execute starry_id_db --remote --command "SELECT p.name,n.number,n.createdAt,h.lastNumber,h.updatedAt FROM profiles p LEFT JOIN non_distributor_ids n ON n.userId=p.userId LEFT JOIN non_distributor_history h ON h.userId=p.userId WHERE TRIM(COALESCE(p.name,''))='杜杜龍' LIMIT 20" --json > /tmp/db-history/non-distributor-state.json
          npx wrangler d1 execute starry_id_db --remote --command "SELECT pa.name AS userAName,pb.name AS userBName,sl.status,sl.createdAt,sl.updatedAt FROM spouse_links sl LEFT JOIN profiles pa ON pa.userId=sl.userA LEFT JOIN profiles pb ON pb.userId=sl.userB WHERE TRIM(COALESCE(pa.name,''))='杜杜龍' OR TRIM(COALESCE(pb.name,''))='杜杜龍' ORDER BY sl.updatedAt DESC LIMIT 20" --json > /tmp/db-history/spouse-history.json
      - name: Upload private diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: db-history-9475831-${{ github.sha }}
          path: /tmp/db-history
          if-no-files-found: error
          retention-days: 1
