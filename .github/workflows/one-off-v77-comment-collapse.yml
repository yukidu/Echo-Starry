name: One-off v77 comment collapse

on:
  push:
    branches:
      - feat/comment-collapse-full-export-v77

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/comment-collapse-full-export-v77
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patch
        run: python scripts/one_off_patch_v77.py
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/CollapsibleCommentText.tsx src/components/CommentsSection.tsx src/components/ProfileModal.tsx src/components/MemberPreviewModal.tsx src/utils/memberLearningCardExport.ts src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts tests/commentCollapse.test.ts
          git diff --cached --check
          git commit -m '心得留言三行收合並完整匯出學習卡'
          git push origin HEAD:feat/comment-collapse-full-export-v77
