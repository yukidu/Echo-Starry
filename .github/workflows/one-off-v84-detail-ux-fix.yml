name: One-off v84 detail page UX fix

on:
  push:
    branches: [ui/detail-page-ux-v84]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/detail-page-ux-v84
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply robust patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          detail = Path('src/components/DetailView.tsx')
          text = detail.read_text()

          def once(source, old, new, label):
              if old not in source:
                  raise RuntimeError(f'missing target: {label}')
              return source.replace(old, new, 1)

          text = once(text,
              "  const [keywordError, setKeywordError] = useState<string | null>(null);",
              "  const [keywordError, setKeywordError] = useState<string | null>(null);\n  const [showDetailKeywords, setShowDetailKeywords] = useState(false);",
              'keyword collapse state')
          sync = "  useEffect(() => {\n    setTrackKeywords(track.keywords || []);\n    setKeywordMeta(track.keywordMeta || {});\n  }, [track.id, track.keywords, track.keywordMeta]);"
          text = once(text, sync, sync + "\n\n  useEffect(() => {\n    setShowDetailKeywords(false);\n    setIsAddingKeyword(false);\n  }, [track.id]);", 'keyword reset')

          text = once(text, ": track.category ? [track.category] : ['未分類'];", ": track.category ? [track.category] : [];", 'category empty fallback')
          text = once(text, "    return text || '未填寫';", "    return text;", 'empty display')
          text = once(text, "    if (!raw) return '未填寫';", "    if (!raw) return '';", 'empty date')

          safe = "  const safeDuration = duration > 0 ? duration : (track.durationSeconds || 600);"
          seek = safe + "\n  const scrubberDragAllowedRef = useRef(false);\n\n  const handleScrubberPointerDown = (event: React.PointerEvent<HTMLInputElement>) => {\n    const rect = event.currentTarget.getBoundingClientRect();\n    const ratio = safeDuration > 0 ? Math.min(1, Math.max(0, currentTime / safeDuration)) : 0;\n    const thumbX = rect.left + rect.width * ratio;\n    const thumbTouchRadius = 28;\n    if (Math.abs(event.clientX - thumbX) > thumbTouchRadius) {\n      scrubberDragAllowedRef.current = false;\n      event.preventDefault();\n      return;\n    }\n    scrubberDragAllowedRef.current = true;\n  };\n\n  const handleScrubberChange = (event: React.ChangeEvent<HTMLInputElement>) => {\n    if (!scrubberDragAllowedRef.current) return;\n    onSeek(Number(event.target.value));\n  };\n\n  const finishScrubberDrag = () => {\n    scrubberDragAllowedRef.current = false;\n  };"
          text = once(text, safe, seek, 'seek guard')
          text = once(text, '    <div className="max-w-2xl mx-auto px-3.5 py-3 sm:px-6 space-y-4 pb-28">', '    <div className="max-w-2xl mx-auto px-3.5 py-3 sm:px-6 space-y-3 pb-28 leading-snug">', 'detail density')

          pattern = re.compile(r'''          <div className="flex items-center gap-1\.5 font-bold text-xs text-slate-800 dark:text-slate-200">\n            <span>網友關鍵字</span>\n            <span className="text-\[10px\] text-slate-400 font-normal">\n              \(\{trackKeywords\.length\}/50 組\)\n            </span>\n          </div>\n          \{canAddKeywords && !isAddingKeyword && \(''')
          replacement = '''          <button
            type="button"
            onClick={() => setShowDetailKeywords(prev => !prev)}
            className="flex flex-wrap items-center gap-x-1.5 gap-y-0.5 font-bold text-sm text-slate-800 dark:text-slate-200 text-left cursor-pointer"
          >
            <span>網友關鍵字</span>
            <span className="text-xs text-slate-400 font-normal">({trackKeywords.length}/50 組)</span>
            <span className="text-sm font-bold text-slate-400">{showDetailKeywords ? '▲ 收起' : '▼ 展開'}</span>
          </button>
          {showDetailKeywords && canAddKeywords && !isAddingKeyword && ('''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1: raise RuntimeError('keyword header structure not found')
          text = once(text, '<div className="flex flex-wrap gap-x-1 gap-y-0.5 items-center">', '<div className={`${showDetailKeywords ? \'flex\' : \'hidden\'} flex-wrap gap-x-1 gap-y-0.5 items-center`}>', 'keyword body')
          text = once(text, '{keywordError && !isAddingKeyword && <p role="alert"', '{showDetailKeywords && keywordError && !isAddingKeyword && <p role="alert"', 'keyword error visibility')
          text = once(text, '{isAddingKeyword && (\n          <div className="mt-2.5', '{showDetailKeywords && isAddingKeyword && (\n          <div className="mt-2.5', 'keyword add visibility')

          timeline_old = '''            value={currentTime}
            onChange={e => onSeek(Number(e.target.value))}
            className="audio-scrubber w-full h-1.5 cursor-pointer"
          />
          <div className="flex justify-between items-center text-xs font-mono text-slate-500 dark:text-slate-400 px-0.5">
            <span>{formatTime(currentTime)} / {formatTime(safeDuration)}</span>
            <span className="text-[11px] text-slate-400">
              {Math.round((currentTime / safeDuration) * 100)}%
            </span>
          </div>'''
          timeline_new = '''            value={currentTime}
            onPointerDown={handleScrubberPointerDown}
            onPointerUp={finishScrubberDrag}
            onPointerCancel={finishScrubberDrag}
            onBlur={finishScrubberDrag}
            onKeyDown={event => event.preventDefault()}
            onChange={handleScrubberChange}
            className="audio-scrubber w-full h-1.5 cursor-grab active:cursor-grabbing"
            aria-label="播放進度，請拖曳目前播放位置的圓點調整"
          />
          <div className="grid grid-cols-[1fr_auto_1fr] items-center text-xs font-mono text-slate-500 dark:text-slate-400 px-0.5">
            <span aria-hidden="true" />
            <span className="justify-self-center text-center">{formatTime(currentTime)} / {formatTime(safeDuration)}</span>
            <span className="justify-self-end text-[11px] text-slate-400">{Math.round((currentTime / safeDuration) * 100)}%</span>
          </div>'''
          text = once(text, timeline_old, timeline_new, 'timeline')

          text = once(text, 'rounded-2xl p-4 border border-rose-100/60 dark:border-slate-800 shadow-xs space-y-2.5 text-xs overflow-hidden', 'rounded-2xl p-3.5 border border-rose-100/60 dark:border-slate-800 shadow-xs space-y-2 text-xs overflow-hidden', 'info density')
          heading = re.compile(r'''<div className="relative z-10 space-y-2\.5">\n          <div className="flex items-center justify-between">\n            <h3 className="font-bold text-slate-800 dark:text-slate-100 text-sm">\n              演講資訊與備註\n            </h3>''')
          text, n = heading.subn('<div className="relative z-10 space-y-2">\n          <div className="flex items-center justify-end">', text, count=1)
          if n != 1: raise RuntimeError('info heading structure not found')
          text = once(text, '<span>編輯演講資訊與連結</span>', '<span>編輯</span>', 'edit label')
          text = once(text, 'leading-relaxed whitespace-pre-wrap', 'leading-snug whitespace-pre-wrap', 'description line height')
          text = once(text, 'className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-500"', 'className="grid grid-cols-2 gap-x-2 gap-y-1 pt-1.5 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-500"', 'metadata gaps')
          text = once(text, 'className="col-start-2 row-start-1 text-right whitespace-nowrap"', 'className="col-start-2 row-start-1 flex items-baseline gap-1 whitespace-nowrap"', 'speech date align')
          text = once(text, 'className="col-start-2 row-start-2 text-right whitespace-nowrap"', 'className="col-start-2 row-start-2 flex items-baseline gap-1 whitespace-nowrap"', 'upload date align')
          detail.write_text(text)

          comments = Path('src/components/CommentsSection.tsx')
          c = comments.read_text()
          c = once(c, "const showBadge = !!displayAuthorBadge && displayAuthorBadge !== '訪客稱號' && displayAuthorBadge !== '訪客' && displayAuthorBadge !== '無';", 'const showBadge = !!registeredAuthor;', 'comment rank line')
          c = once(c, 'className="w-full bg-white/70 dark:bg-slate-900/60 rounded-3xl p-5 sm:p-7 border border-rose-100/60 dark:border-slate-800 shadow-xs relative"', 'className="w-full bg-white/70 dark:bg-slate-900/60 rounded-3xl p-4 sm:p-5 border border-rose-100/60 dark:border-slate-800 shadow-xs relative leading-snug"', 'comment density')
          c = once(c, 'className="flex items-center justify-between mb-4"', 'className="flex items-center justify-between mb-3"', 'comment heading gap')
          c = once(c, '<form onSubmit={handleSubmit} className="mb-8 relative">', '<form onSubmit={handleSubmit} className="mb-5 relative">', 'comment form gap')
          c = once(c, 'rounded-2xl p-4 border border-slate-200/70', 'rounded-2xl p-3.5 border border-slate-200/70', 'composer density')

          footer_pattern = re.compile(r'''          <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-200/50 dark:border-slate-700/50 mt-2">.*?          </div>(?=\n        </div>\n\n        \{errorMessage)''', re.S)
          footer_new = '''          <div className="flex items-center justify-end gap-3 pt-2.5 border-t border-slate-200/50 dark:border-slate-700/50 mt-1.5">
            <span className="text-xs text-slate-400 font-mono">{inputText.length}/2000</span>
            <button type="submit" disabled={isSubmitting || !inputText.trim()} className="px-5 py-2 rounded-xl text-white font-medium text-sm transition-all shadow-xs active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" style={{ backgroundColor: 'var(--color-primary, #c06c84)' }}>
              {isSubmitting ? '送出中…' : '送出'}
            </button>
          </div>'''
          c, n = footer_pattern.subn(footer_new, c, count=1)
          if n != 1: raise RuntimeError('composer footer structure not found')

          author_pattern = re.compile(r'''                <div className="flex items-center justify-between gap-2 text-xs">\n                  <div onClick=\{isClickable \? \(\) => handleAuthorClick\(c\) : undefined\} className=\{`flex items-center gap-1\.5 flex-wrap \$\{isClickable \? 'cursor-pointer hover:opacity-85 transition-opacity' : 'cursor-default pointer-events-none'\}`\} title=\{isClickable \? `點擊查看【\$\{displayAuthorName\}】會員個人檔案` : undefined\}>.*?                  <div className="flex items-center gap-2 shrink-0">''', re.S)
          author_new = '''                <div className="flex items-start justify-between gap-2">
                  <div onClick={isClickable ? () => handleAuthorClick(c) : undefined} className={`flex items-center gap-2 min-w-0 ${isClickable ? 'cursor-pointer hover:opacity-85 transition-opacity' : 'cursor-default pointer-events-none'}`} title={isClickable ? `點擊查看【${displayAuthorName}】會員個人檔案` : undefined}>
                    {isAvatarUrl ? <img src={displayAuthorAvatar} alt={displayAuthorName} className="w-10 h-10 rounded-full object-cover shrink-0 ring-1 ring-slate-200 dark:ring-slate-700" /> : <span className="w-10 h-10 rounded-full flex items-center justify-center text-2xl shrink-0">{displayAuthorAvatar || '👤'}</span>}
                    <div className="h-10 min-w-0 flex flex-col justify-center gap-0.5 leading-none">
                      {c.isAdmin || displayAuthorBadge === '貢獻者' ? <span className="rainbow-admin-text font-bold text-sm truncate">{displayAuthorName}</span> : isClickable ? <span className="font-bold text-slate-800 dark:text-slate-100 text-sm underline decoration-dotted underline-offset-2 hover:text-rose-600 transition-colors truncate">{displayAuthorName}</span> : <span className="font-bold text-slate-700 dark:text-slate-300 text-sm select-none truncate">{displayAuthorName}</span>}
                      <div className="flex items-center gap-1 min-w-0">
                        {isVisitor && <span className="text-xs px-1.5 py-0.5 rounded-md bg-[var(--color-light-pill,#fae8ed)] text-[var(--color-primary,#c06c84)] border border-[var(--theme-border-subtle,#f1e7ea)] dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 font-medium select-none">訪客</span>}
                        {showBadge && <span className="text-xs px-1.5 py-0.5 rounded-md bg-[var(--color-light-pill,#fae8ed)] text-[var(--color-primary,#c06c84)] border border-[var(--theme-border-subtle,#f1e7ea)] dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 font-medium truncate">{displayAuthorBadge}</span>}
                        <span className="text-[11px] text-slate-400 dark:text-slate-500 font-mono whitespace-nowrap">{c.timestamp}</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-1 shrink-0 pt-0.5">'''
          c, n = author_pattern.subn(author_new, c, count=1)
          if n != 1: raise RuntimeError('comment author structure not found')
          c = once(c, 'className="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed pl-6 whitespace-pre-wrap mt-0.5 break-words"', 'className="text-base text-slate-700 dark:text-slate-300 leading-snug pl-12 whitespace-pre-wrap mt-1 break-words"', 'comment body size')
          c = once(c, 'className="mt-1.5 space-y-1.5 pl-5"', 'className="mt-1.5 space-y-1.5 pl-12"', 'edit indent')
          c = once(c, 'dark:bg-slate-700/60 text-xs text-slate-800', 'dark:bg-slate-700/60 text-sm text-slate-800', 'edit font')
          comments.write_text(c)

          test = Path('tests/detailPageUx.test.ts')
          test.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nconst detail = readFileSync(new URL('../src/components/DetailView.tsx', import.meta.url), 'utf8');\nconst comments = readFileSync(new URL('../src/components/CommentsSection.tsx', import.meta.url), 'utf8');\ntest('detail scrubber requires thumb drag and centers time', () => {\n  assert.match(detail, /thumbTouchRadius = 28/);\n  assert.match(detail, /onPointerDown=\\{handleScrubberPointerDown\\}/);\n  assert.match(detail, /onChange=\\{handleScrubberChange\\}/);\n  assert.doesNotMatch(detail, /onChange=\\{e => onSeek/);\n  assert.match(detail, /grid-cols-\\[1fr_auto_1fr\\]/);\n});\ntest('detail metadata and keyword panel follow compact rules', () => {\n  assert.match(detail, /showDetailKeywords, setShowDetailKeywords\\] = useState\\(false\\)/);\n  assert.match(detail, /'▲ 收起' : '▼ 展開'/);\n  assert.match(detail, /return text;/);\n  assert.match(detail, /if \\(!raw\\) return '';/);\n  assert.doesNotMatch(detail, />演講資訊與備註</);\n  assert.match(detail, /<span>編輯<\\/span>/);\n});\ntest('comment composer removes identity and enlarges author presentation', () => {\n  assert.doesNotMatch(comments, /送出心得/);\n  assert.match(comments, /'送出'/);\n  assert.match(comments, /w-10 h-10 rounded-full object-cover/);\n  assert.match(comments, /h-10 min-w-0 flex flex-col justify-center/);\n  assert.match(comments, /text-base text-slate-700[\\s\\S]*leading-snug pl-12/);\n});\n""")

          changelog = Path('src/changelogReleaseNotes.ts')
          notes = changelog.read_text()
          anchor = "    '首頁網友關鍵字視覺再統一：關閉 X 會跟著目前調色盤主色同步；展開清單與已選條件中的關鍵字都改為一般字重；排序整排按鈕與上方搜尋框統一高度，切換排序時不再因縮放造成高度跳動。',\n"
          note = "    '音檔詳細頁操作整理：播放時間軸改成只能從目前播放圓點按住拖曳，避免誤點跳段；時間置中。演講資訊空白欄位不再顯示「未填寫」，編輯按鈕簡化為「編輯」，關鍵字預設收起並可展開；心得輸入移除姓名獎銜、送出按鈕簡化，留言頭像放大、姓名與獎銜上下排列，全文字體與頁面行距同步優化。',\n"
          if note not in notes:
              if anchor not in notes: raise RuntimeError('changelog anchor missing')
              notes = notes.replace(anchor, anchor + note, 1)
          changelog.write_text(notes)

          sw = Path('public/sw.js')
          s = sw.read_text()
          if 'echostars-shell-v83' not in s: raise RuntimeError('unexpected cache version')
          sw.write_text(s.replace('echostars-shell-v83', 'echostars-shell-v84', 1))
          release = Path('tests/releaseIntegrity.test.ts')
          r = release.read_text()
          r = r.replace("test('v83 is the single current PWA cache version'", "test('v84 is the single current PWA cache version'", 1)
          r = r.replace('echostars-shell-v83', 'echostars-shell-v84')
          release.write_text(r)

          # Final structural checks before writing a commit.
          for marker in ['handleScrubberPointerDown', 'showDetailKeywords', "<span>編輯</span>", 'grid-cols-[1fr_auto_1fr]']:
              if marker not in detail.read_text(): raise RuntimeError(f'detail verification failed: {marker}')
          for marker in ["'送出'", 'w-10 h-10 rounded-full object-cover', 'text-base text-slate-700']:
              if marker not in comments.read_text(): raise RuntimeError(f'comment verification failed: {marker}')
          PY
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/DetailView.tsx src/components/CommentsSection.tsx tests/detailPageUx.test.ts src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts
          git diff --cached --check
          git commit -m '整理音檔詳細頁播放器資訊與心得介面'
          git push origin HEAD:ui/detail-page-ux-v84
