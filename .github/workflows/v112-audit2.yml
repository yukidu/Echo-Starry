name: v112 audit 2

on:
  push:
    branches:
      - safe/v112-sticker-rank-integrity

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Specific live member checks
        shell: bash
        run: |
          set -u
          for name in 'Ming Yao' 'hank Lai' '曾采婕' '陳泰榮'; do
            echo "QUERY $name"
            curl -A 'Mozilla/5.0' -sS --retry 2 --get --data-urlencode "q=$name" https://echostars.yukidu.workers.dev/api/stickers/leaderboard \
              | python -c "import json,sys; d=json.load(sys.stdin); [print({'name':e.get('user',{}).get('name'),'rank':e.get('user',{}).get('rank'),'current':e.get('current'),'earned':e.get('earned'),'spent':e.get('spent')}) for e in d.get('entries',[])]" \
              || true
          done
      - name: Rank source audit
        shell: bash
        run: |
          set -u
          echo '=== API routes mentioning users ==='
          grep -RInE "api/(users|members)|users.*GET|GET.*users" worker src | head -n 200 || true
          echo '=== raw rank references in member-facing code ==='
          grep -RInE "rankApproved|approvedRank|\.rank" src/components src/utils src/App.tsx | head -n 600 || true
          echo '=== correction references ==='
          grep -RInE "balance_correction|HIDDEN_BALANCE_TARGETS|hidden-sticker-balance" worker tests src/components | head -n 300 || true
