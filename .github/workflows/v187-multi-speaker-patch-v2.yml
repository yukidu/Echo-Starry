name: v187 Multi Speaker Patch v2

on:
  push:
    branches:
      - safe/v187-multi-speaker-5
    paths:
      - .github/workflows/v187-multi-speaker-patch-v2.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: safe/v187-multi-speaker-5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply v187 patch from reviewed patch workflow
        shell: bash
        run: |
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/v187-multi-speaker-patch.yml \
            | sed '1d;$d;s/^          //' > /tmp/v187_patch.py
          python3 /tmp/v187_patch.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Regression
        run: npm test

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified product changes
        shell: bash
        run: |
          git status --short
          git diff --check
          git config user.name "EchoStars Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/UploadModal.tsx src/types.ts schema.sql tests/v187MultiSpeaker.test.ts
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "v187: multi-speaker upload edit UI"
          git push origin HEAD:safe/v187-multi-speaker-5
