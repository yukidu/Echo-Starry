name: v247 one-shot menu stability patch

on:
  push:
    branches:
      - safe/v247-menu-freeze-fix
    paths:
      - .github/workflows/v247-menu-freeze-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v247-menu-freeze-fix
          fetch-depth: 0
      - name: Patch Starry ID menu ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          menu_path = Path('worker/starryIdV216Enhancer.ts')
          menu = menu_path.read_text()
          old_apps = "const APPS=[['Starry ID','https://id.starry.phd'],['繁星回聲','https://echo.starry.phd'],['繁星下載','https://download.starry.phd'],['繁星短網址','https://go.starry.phd']];"
          new_apps = "const APPS=[['繁星宇宙','https://starry.phd'],['Starry ID','https://id.starry.phd'],['繁星回聲','https://echo.starry.phd'],['繁星下載','https://download.starry.phd'],['繁星任意門','https://go.starry.phd'],['繁星雞湯','https://quotes.starry.phd'],['繁星膠囊','https://box.starry.phd'],['美力之星','https://starbeauty.yukidu.workers.dev']];"
          assert old_apps in menu, 'v216 APPS baseline changed'
          menu = menu.replace(old_apps, new_apps, 1)
          old_loop = "for(const [name,url] of APPS){const a=document.createElement('a');a.href=url;a.textContent=name;nav.appendChild(a)}const card="
          new_loop = "for(const [name,url] of APPS){const a=document.createElement('a');a.href=url;a.textContent=name;nav.appendChild(a)}const ledger=document.createElement('a');ledger.href='/battery-ledger';ledger.textContent='🔋 電池餘額日誌';nav.appendChild(ledger);const card="
          assert old_loop in menu, 'v216 menu loop baseline changed'
          menu = menu.replace(old_loop, new_loop, 1)
          menu_path.write_text(menu)

          battery_path = Path('worker/starryIdV245BatteryRouter.ts')
          battery = battery_path.read_text()
          battery, count = re.subn(r"\n  const APPS=\[\n.*?\n  \];\n", "\n", battery, count=1, flags=re.S)
          assert count == 1, 'v245 APPS block not found'
          battery, count = re.subn(r"\n  function syncMenu\(\)\{[^\n]*\}\n", "\n", battery, count=1)
          assert count == 1, 'v245 syncMenu not found'
          old_sync = "function sync(){syncMenu();scheduleBattery()}"
          assert old_sync in battery, 'v245 sync function baseline changed'
          battery = battery.replace(old_sync, "function sync(){scheduleBattery()}", 1)
          old_observer = "  new MutationObserver(mutations=>{const relevant=mutations.some(m=>{const target=m.target instanceof Element?m.target:m.target.parentElement;return !target?.closest?.('[data-v245-battery=\"1\"],.v245-feedback')});if(relevant)sync()}).observe(document.documentElement,{childList:true,subtree:true});"
          new_observer = "  new MutationObserver(mutations=>{const relevant=mutations.some(m=>{const target=m.target instanceof Element?m.target:m.target.parentElement;if(target?.closest?.('[data-v245-battery=\"1\"],.v245-feedback,.v216-menu,.topbar'))return false;const nodes=[...m.addedNodes,...m.removedNodes].filter(n=>n instanceof Element);if(nodes.length&&nodes.every(n=>n.matches?.('.v216-menu')||n.closest?.('.v216-menu')))return false;return true});if(relevant)scheduleBattery()}).observe(document.documentElement,{childList:true,subtree:true});"
          assert old_observer in battery, 'v246 observer baseline changed'
          battery = battery.replace(old_observer, new_observer, 1)
          battery_path.write_text(battery)

          test = """import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const battery = readFileSync('worker/starryIdV245BatteryRouter.ts','utf8');
          const menu = readFileSync('worker/starryIdV216Enhancer.ts','utf8');

          test('v247 battery enhancer no longer owns or rebuilds the main menu', () => {
            assert.doesNotMatch(battery, /function syncMenu\\(/);
            assert.doesNotMatch(battery, /menu\\.dataset\\.v245/);
            assert.doesNotMatch(battery, /for\\(const a of qa\\(':scope > a',menu\\)\\)a\\.remove\\(\\)/);
          });

          test('v247 battery observer ignores main-menu and topbar mutations', () => {
            assert.match(battery, /\\.v216-menu,\\.topbar/);
            assert.match(battery, /if\\(relevant\\)scheduleBattery\\(\\)/);
          });

          test('v247 v216 menu is the single owner of ecosystem links and battery ledger', () => {
            for (const url of ['https://starry.phd','https://id.starry.phd','https://echo.starry.phd','https://download.starry.phd','https://go.starry.phd','https://quotes.starry.phd','https://box.starry.phd','https://starbeauty.yukidu.workers.dev']) {
              assert.ok(menu.includes(url), `missing ${url}`);
            }
            assert.match(menu, /ledger\\.href='\\/battery-ledger'/);
            assert.match(menu, /電池餘額日誌/);
          });
          """
          Path('tests/starryIdV247MenuFreezeFix.test.ts').write_text(test)
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Starry AI Dev"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v247-menu-freeze-fix.yml
          git add worker/starryIdV216Enhancer.ts worker/starryIdV245BatteryRouter.ts tests/starryIdV247MenuFreezeFix.test.ts
          git commit -m "v247: isolate Starry ID main menu from battery observer"
          git push origin HEAD:safe/v247-menu-freeze-fix
