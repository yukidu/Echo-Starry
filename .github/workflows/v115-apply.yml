name: v115 apply

on:
  push:
    branches:
      - safe/v115-superadmin-tabs-remove-logout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'yukidu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested changes
        run: python scripts/v115_apply.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: TypeScript diagnostic
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/v115_apply.py .github/workflows/v115-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v115：限制後台敏感分頁並移除個人中心登出按鈕"
          git push origin HEAD:safe/v115-superadmin-tabs-remove-logout
