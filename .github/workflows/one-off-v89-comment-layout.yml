name: One-off v89 comment layout

on:
  push:
    branches: [fix/comment-layout-v89]
    paths:
      - .github/workflows/one-off-v89-comment-layout.yml
      - scripts/patch-v89-comment-layout.py
      - scripts/patch-v89-tests.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comment-layout-v89
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: |
          python scripts/patch-v89-comment-layout.py
          python scripts/patch-v89-tests.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name echostars-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/components/CommentsSection.tsx tests/commentTimestamp.test.ts tests/detailPageUx.test.ts tests/miniPlayerCommentLayout.test.ts public/sw.js tests/releaseIntegrity.test.ts src/changelogReleaseNotes.ts
          git commit -m "重排心得留言資訊與回覆操作" || exit 0
          git push
