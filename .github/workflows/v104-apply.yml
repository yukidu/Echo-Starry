name: v104 multiplier apply

on:
  push:
    branches:
      - safe/v104-platinum-earning-multiplier

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply v104 multiplier refactor
        run: |
          python3 scripts/apply_v104_multiplier.py
          python3 scripts/fix_v104_manual_grant_exception.py
      - name: Full test suite
        run: npm test
      - name: TypeScript diagnostic
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified v104 changes
        run: |
          rm -f scripts/apply_v104_multiplier.py scripts/fix_v104_manual_grant_exception.py .github/workflows/v104-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v104: apply platinum earning multiplier to system rewards"
          git push origin HEAD:safe/v104-platinum-earning-multiplier
