name: One-off v80 dynamic keyword counts

on:
  push:
    branches: [feat/dynamic-keyword-counts-v80]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-keyword-counts-v80
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply keyword filter improvements
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx tests/homeKeywordCounts.test.ts src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts
          git diff --cached --check
          git commit -m '網友關鍵字新增動態交叉條件音檔數量'
          git push origin HEAD:feat/dynamic-keyword-counts-v80
