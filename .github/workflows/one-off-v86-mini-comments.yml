name: One-off v86 mini player comments
on:
  push:
    branches: [ui/mini-player-comments-v86]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mini-player-comments-v86
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mini player and comment layout patch
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          a = app.read_text()
          old = "          onReturnHome={handleReturnToHomePlaylist}\n          onTogglePlay={handleTogglePlay}"
          new = "          onReturnHome={handleReturnToHomePlaylist}\n          onClose={() => {\n            audioRef.current?.pause();\n            setIsPlaying(false);\n            setCurrentTrack(null);\n            setCurrentTime(0);\n            setDuration(0);\n            if ('mediaSession' in navigator) {\n              try {\n                navigator.mediaSession.playbackState = 'none';\n                navigator.mediaSession.metadata = null;\n              } catch {}\n            }\n          }}\n          onTogglePlay={handleTogglePlay}"
          assert old in a, 'MiniPlayer props anchor not found'
          app.write_text(a.replace(old, new, 1))

          comments = Path('src/components/CommentsSection.tsx')
          c = comments.read_text()
          c = c.replace('className={`flex items-start justify-between gap-2`}', 'className={`grid grid-cols-[minmax(0,1fr)_auto] items-start gap-2`}', 1) if 'className={`flex items-start justify-between gap-2`}' in c else c
          old = 'className="flex items-start justify-between gap-2"'
          assert old in c, 'comment header row anchor not found'
          c = c.replace(old, 'className="grid grid-cols-[minmax(0,1fr)_auto] items-start gap-2"', 1)
          old = 'className={`flex items-center gap-2 min-w-0 ${isClickable ? \'cursor-pointer hover:opacity-85 transition-opacity\' : \'cursor-default pointer-events-none\'}`}'
          assert old in c, 'author wrapper anchor not found'
          c = c.replace(old, 'className={`flex items-start gap-2 min-w-0 ${isClickable ? \'cursor-pointer hover:opacity-85 transition-opacity\' : \'cursor-default pointer-events-none\'}`}', 1)
          old = "          {isAvatarUrl ? <img src={displayAuthorAvatar} alt={displayAuthorName} className=\"w-10 h-10 rounded-full object-cover shrink-0 ring-1 ring-slate-200 dark:ring-slate-700\" /> : <span className=\"w-10 h-10 rounded-full flex items-center justify-center text-2xl shrink-0\">{displayAuthorAvatar || '👤'}</span>}\n          <div className=\"h-10 min-w-0 flex flex-col justify-center gap-0.5 leading-none\">"
          new = "          <div className=\"w-14 shrink-0 flex flex-col items-center gap-1\">\n            {isAvatarUrl ? <img src={displayAuthorAvatar} alt={displayAuthorName} className=\"w-14 h-14 rounded-full object-cover shrink-0 ring-1 ring-slate-200 dark:ring-slate-700\" /> : <span className=\"w-14 h-14 rounded-full flex items-center justify-center text-3xl shrink-0\">{displayAuthorAvatar || '👤'}</span>}\n            <span className=\"text-[10px] text-slate-400 dark:text-slate-500 font-mono whitespace-nowrap leading-none\">{c.timestamp}</span>\n          </div>\n          <div className=\"min-h-14 min-w-0 flex flex-col justify-center gap-1 leading-none\">"
          assert old in c, 'avatar block anchor not found'
          c = c.replace(old, new, 1)
          c = c.replace('rainbow-admin-text font-bold text-sm truncate', 'rainbow-admin-text font-bold text-base leading-tight break-words', 1)
          c = c.replace('font-bold text-slate-800 dark:text-slate-100 text-sm underline decoration-dotted underline-offset-2 hover:text-rose-600 transition-colors truncate', 'font-bold text-slate-800 dark:text-slate-100 text-base underline decoration-dotted underline-offset-2 hover:text-rose-600 transition-colors leading-tight break-words', 1)
          c = c.replace('font-bold text-slate-700 dark:text-slate-300 text-sm select-none truncate', 'font-bold text-slate-700 dark:text-slate-300 text-base select-none leading-tight break-words', 1)
          c = c.replace('text-xs px-1.5 py-0.5 rounded-md bg-[var(--color-light-pill,#fae8ed)] text-[var(--color-primary,#c06c84)] border border-[var(--theme-border-subtle,#f1e7ea)] dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 font-medium select-none', 'text-[10px] px-1.5 py-0.5 rounded-md bg-[var(--color-light-pill,#fae8ed)] text-[var(--color-primary,#c06c84)] border border-[var(--theme-border-subtle,#f1e7ea)] dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 font-medium select-none leading-tight', 1)
          c = c.replace('text-xs px-1.5 py-0.5 rounded-md bg-[var(--color-light-pill,#fae8ed)] text-[var(--color-primary,#c06c84)] border border-[var(--theme-border-subtle,#f1e7ea)] dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 font-medium truncate', 'text-[10px] px-1.5 py-0.5 rounded-md bg-[var(--color-light-pill,#fae8ed)] text-[var(--color-primary,#c06c84)] border border-[var(--theme-border-subtle,#f1e7ea)] dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 font-medium whitespace-normal leading-tight', 1)
          old = '              <span className="text-[11px] text-slate-400 dark:text-slate-500 font-mono whitespace-nowrap">{c.timestamp}</span>\n'
          assert old in c, 'old timestamp anchor not found'
          c = c.replace(old, '', 1)
          c = c.replace('className="mt-1.5 space-y-1.5 pl-12"', 'className="mt-1.5 space-y-1.5 pl-16"', 1)
          c = c.replace('className="text-base text-slate-700 dark:text-slate-300 leading-snug pl-12 whitespace-pre-wrap mt-1 break-words"', 'className="text-base text-slate-700 dark:text-slate-300 leading-snug pl-16 whitespace-pre-wrap mt-1 break-words"', 1)
          comments.write_text(c)

          sw = Path('public/sw.js')
          s = sw.read_text()
          assert 'echostars-shell-v85' in s
          sw.write_text(s.replace('echostars-shell-v85', 'echostars-shell-v86', 1))

          release = Path('tests/releaseIntegrity.test.ts')
          r = release.read_text()
          assert 'v85 is the single current PWA cache version' in r and 'echostars-shell-v85' in r
          r = r.replace('v85 is the single current PWA cache version', 'v86 is the single current PWA cache version', 1)
          r = r.replace('echostars-shell-v85', 'echostars-shell-v86', 1)
          release.write_text(r)

          test = Path('tests/miniPlayerCommentLayout.test.ts')
          test.write_text("import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nconst mini = readFileSync(new URL('../src/components/MiniPlayer.tsx', import.meta.url), 'utf8');\nconst app = readFileSync(new URL('../src/App.tsx', import.meta.url), 'utf8');\nconst comments = readFileSync(new URL('../src/components/CommentsSection.tsx', import.meta.url), 'utf8');\nconst collapsible = readFileSync(new URL('../src/components/CollapsibleCommentText.tsx', import.meta.url), 'utf8');\ntest('mini player has left shortcuts, themed title and close control', () => { const up = mini.indexOf('aria-label=\\\"回到頁面最前面\\\"'); const home = mini.indexOf('aria-label=\\\"返回首頁清單\\\"'); const bubble = mini.indexOf('group/bubble'); const close = mini.indexOf('aria-label=\\\"關閉迷你播放器\\\"'); assert.ok(up >= 0 && home >= 0 && bubble >= 0 && close >= 0); assert.ok(up < bubble && home < bubble && close > bubble); assert.match(mini, /text-\\[var\\(--color-primary,#c06c84\\)\\]/); assert.match(app, /onClose=\\{\\(\\) => \\{[\\s\\S]*setCurrentTrack\\(null\\)/); });\ntest('comment identity layout keeps avatar, time, name and badge readable', () => { assert.match(comments, /w-14 shrink-0 flex flex-col items-center gap-1/); assert.match(comments, /w-14 h-14 rounded-full object-cover/); assert.match(comments, /text-\\[10px\\][^\\n]*\\{c\\.timestamp\\}/); assert.match(comments, /displayAuthorName[^\\n]*text-base|text-base[^\\n]*displayAuthorName/); assert.match(comments, /displayAuthorBadge[^\\n]*text-\\[10px\\]|text-\\[10px\\][^\\n]*displayAuthorBadge/); assert.match(comments, /pl-16 whitespace-pre-wrap/); });\ntest('collapsed comments show triangle direction cues', () => { assert.match(collapsible, /▲ \\$\\{lessLabel\\}/); assert.match(collapsible, /▼ \\$\\{moreLabel\\}/); });\n")

          changelog = Path('src/changelogReleaseNotes.ts')
          ch = changelog.read_text()
          anchor = "    '詳細頁網友關鍵字版面再整理：展開與收起固定在同一位置；新增關鍵字移到標題下方，字體與標題同尺寸；所有關鍵字文字同步放大並取消粗體。',"
          assert anchor in ch
          note = "    '迷你播放器與心得閱讀再優化：回頂端與首頁按鈕移到播放器左側，右側新增關閉播放器 X，音檔標題跟隨調色盤主色；心得頭像再放大、留言時間移到頭像下方，姓名與本文同尺寸、獎銜縮小，更多與收起增加方向三角形。',"
          changelog.write_text(ch.replace(anchor, anchor + '\n' + note, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx src/components/CommentsSection.tsx public/sw.js tests/releaseIntegrity.test.ts tests/miniPlayerCommentLayout.test.ts src/changelogReleaseNotes.ts
          git diff --cached --check
          git commit -m '優化迷你播放器與留言作者版面'
          git push origin HEAD:ui/mini-player-comments-v86
