name: v190 one-time rank badge patch

on:
  push:
    branches:
      - safe/v190-rank-badges

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v190-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v190-rank-badges
          fetch-depth: 0

      - name: Apply v190 source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 exact match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Canonical rank -> R2 medal artwork mapping.
          Path('src/utils/speakerRankBadge.ts').write_text("""export type SpeakerRankBadge = {\n  rank: string;\n  fileName: string;\n  key: string;\n  url: string;\n};\n\nconst RANK_BADGE_FILES: Record<string, string> = {\n  '銅章': '01銅章.png',\n  '銀章': '02銀章.png',\n  '金章': '03金章.png',\n  '白金': '04白金.png',\n  '紅寶石': '05紅寶石.png',\n  '創辦人白金': '06創辦人白金.png',\n  '創辦人紅寶石': '07創辦人紅寶石.png',\n  '明珠': '08明珠.png',\n  '藍寶石': '09藍寶石.png',\n  '創辦人藍寶石': '10創辦人藍寶石.png',\n  '翡翠': '11翡翠.png',\n  '創辦人翡翠': '12創辦人翡翠.png',\n  '鑽石': '13鑽石.png',\n  '創辦人鑽石': '14創辦人鑽石.png',\n  '執行專才鑽石': '15 EDC.png',\n  '創辦人執行專才鑽石': '16創辦人EDC.png',\n  '雙鑽石': '17雙鑽石.png',\n  '創辦人雙鑽石': '18創辦人雙鑽石.png',\n  '參鑽石': '19參鑽石.png',\n  '創辦人參鑽石': '20創辦人參鑽石.png',\n  '皇冠': '21皇冠.png',\n  '創辦人皇冠': '22創辦人皇冠.png',\n  '皇冠大使': '23皇冠大使.png',\n  '創辦人皇冠大使': '24創辦人皇冠大使.png'\n};\n\nexport const normalizeSpeakerRankForBadge = (value: string) =>\n  String(value || '')\n    .trim()\n    .replace(/^GAR\\s*/i, '')\n    .replace(/\\s*GAR全球獎銜\\s*$/i, '')\n    .replace(/\\s*全球獎銜\\s*$/i, '')\n    .trim();\n\nexport const speakerRankBadge = (value: string): SpeakerRankBadge | null => {\n  const rank = normalizeSpeakerRankForBadge(value);\n  const fileName = RANK_BADGE_FILES[rank];\n  if (!fileName) return null;\n  const key = `Pin-Level/${fileName}`;\n  return {\n    rank,\n    fileName,\n    key,\n    url: `/api/r2/file/${encodeURIComponent(key)}`\n  };\n};\n\nexport const SPEAKER_RANK_BADGE_FILES = RANK_BADGE_FILES;\n""")

          # 2) Lightweight animation styling: floating medal + three twinkling points.
          Path('src/v190RankBadge.css').write_text("""@keyframes v190-rank-badge-bob {\n  0%, 100% { transform: translateY(0) scale(1); }\n  45% { transform: translateY(-6px) scale(1.045); }\n  65% { transform: translateY(-2px) scale(1.015); }\n}\n\n@keyframes v190-rank-badge-sparkle {\n  0%, 100% { opacity: .15; transform: scale(.55) rotate(0deg); }\n  35% { opacity: 1; transform: scale(1.18) rotate(22deg); }\n  62% { opacity: .45; transform: scale(.8) rotate(40deg); }\n}\n\n.v190-rank-badge-motion {\n  position: relative;\n  display: grid;\n  place-items: center;\n  animation: v190-rank-badge-bob 2.1s ease-in-out infinite;\n  filter: drop-shadow(0 8px 12px rgba(15, 23, 42, .24));\n  transform-origin: 50% 70%;\n}\n\n.v190-rank-badge-image {\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: contain;\n}\n\n.v190-rank-badge-sparkle {\n  position: absolute;\n  z-index: 2;\n  color: #fff7c2;\n  text-shadow: 0 0 6px #fff, 0 0 12px rgba(250, 204, 21, .95);\n  line-height: 1;\n  pointer-events: none;\n  animation: v190-rank-badge-sparkle 1.55s ease-in-out infinite;\n}\n\n.v190-rank-badge-sparkle--one { top: -7px; right: -5px; font-size: 18px; animation-delay: 0s; }\n.v190-rank-badge-sparkle--two { bottom: 1px; left: -7px; font-size: 13px; animation-delay: .5s; }\n.v190-rank-badge-sparkle--three { top: 28%; left: -10px; font-size: 9px; animation-delay: .92s; }\n\n@media (prefers-reduced-motion: reduce) {\n  .v190-rank-badge-motion,\n  .v190-rank-badge-sparkle {\n    animation-duration: 4.5s;\n  }\n}\n""")

          # 3) DetailView: add medal to the right of the round cover and expose rank click callback.
          replace_once(
              'src/components/DetailView.tsx',
              "import { TwinklingStars } from './TwinklingStars';\n",
              "import { TwinklingStars } from './TwinklingStars';\nimport { speakerRankBadge } from '../utils/speakerRankBadge';\n"
          )
          replace_once(
              'src/components/DetailView.tsx',
              "  onSelectKeyword?: (keyword: string) => void;\n  onEditTrack?: (track: Track) => void;",
              "  onSelectKeyword?: (keyword: string) => void;\n  onSelectSpeakerRank?: (rank: string) => void;\n  onEditTrack?: (track: Track) => void;"
          )
          replace_once(
              'src/components/DetailView.tsx',
              "  onUpdateTrack,\n  onSelectKeyword,\n  onEditTrack,",
              "  onUpdateTrack,\n  onSelectKeyword,\n  onSelectSpeakerRank,\n  onEditTrack,"
          )
          replace_once(
              'src/components/DetailView.tsx',
              "  const categories = track.categories && track.categories.length > 0\n    ? track.categories\n    : track.category ? [track.category] : [];\n",
              "  const categories = track.categories && track.categories.length > 0\n    ? track.categories\n    : track.category ? [track.category] : [];\n  const rankBadge = speakerRankBadge(track.speakerRank || '');\n"
          )
          replace_once(
              'src/components/DetailView.tsx',
              "            </button>\n\n            {/* Badge: Required permission (Requirement 11 v2.7: 私秘VIP顯示鎖頭+私秘VIP) */}",
              """            </button>\n\n            {rankBadge && (\n              <button\n                type=\"button\"\n                onClick={event => {\n                  event.stopPropagation();\n                  onSelectSpeakerRank?.(rankBadge.rank);\n                }}\n                className=\"absolute top-1/2 -translate-y-1/2 z-20 w-16 h-16 sm:w-20 sm:h-20 p-1 rounded-2xl cursor-pointer hover:scale-110 active:scale-95 transition-transform focus:outline-hidden focus-visible:ring-2 focus-visible:ring-amber-300\"\n                style={{ left: 'calc(100% + 0.55rem)' }}\n                title={`查看所有「${rankBadge.rank}」講師音檔`}\n                aria-label={`篩選所有${rankBadge.rank}講師音檔`}\n              >\n                <span className=\"v190-rank-badge-motion w-full h-full\">\n                  <img\n                    src={rankBadge.url}\n                    alt={`${rankBadge.rank}獎章`}\n                    className=\"v190-rank-badge-image\"\n                  />\n                  <span aria-hidden=\"true\" className=\"v190-rank-badge-sparkle v190-rank-badge-sparkle--one\">✦</span>\n                  <span aria-hidden=\"true\" className=\"v190-rank-badge-sparkle v190-rank-badge-sparkle--two\">✦</span>\n                  <span aria-hidden=\"true\" className=\"v190-rank-badge-sparkle v190-rank-badge-sparkle--three\">✦</span>\n                </span>\n              </button>\n            )}\n\n            {/* Badge: Required permission (Requirement 11 v2.7: 私秘VIP顯示鎖頭+私秘VIP) */}"""
          )

          # 4) App: exact medal-rank filter independent from the existing base-rank dropdown.
          replace_once(
              'src/App.tsx',
              "import { baseSpeakerRank, effectiveMemberRank } from './utils/ranks';\n",
              "import { baseSpeakerRank, effectiveMemberRank } from './utils/ranks';\nimport { normalizeSpeakerRankForBadge } from './utils/speakerRankBadge';\n"
          )
          replace_once(
              'src/App.tsx',
              "  const [selectedSpeakerRank, setSelectedSpeakerRank] = useState<string>('全部');\n  const [isSpeakerRankDropdownOpen, setIsSpeakerRankDropdownOpen] = useState(false);",
              "  const [selectedSpeakerRank, setSelectedSpeakerRank] = useState<string>('全部');\n  const [selectedBadgeSpeakerRank, setSelectedBadgeSpeakerRank] = useState<string>('');\n  const [isSpeakerRankDropdownOpen, setIsSpeakerRankDropdownOpen] = useState(false);"
          )
          replace_once(
              'src/App.tsx',
              "    const baseTracks = (Array.isArray(tracks) ? tracks : []).filter(track =>\n      trackMatchesHomeBaseFilters(track, selectedCategory, selectedSpeakerRank, searchQuery)\n    );",
              "    const baseTracks = (Array.isArray(tracks) ? tracks : []).filter(track =>\n      (!selectedBadgeSpeakerRank || normalizeSpeakerRankForBadge(track.speakerRank || '') === selectedBadgeSpeakerRank) &&\n      trackMatchesHomeBaseFilters(track, selectedCategory, selectedSpeakerRank, searchQuery)\n    );"
          )
          replace_once(
              'src/App.tsx',
              "  }, [tracks, allAvailableKeywords, selectedCategory, selectedSpeakerRank, selectedKeywords, searchQuery]);",
              "  }, [tracks, allAvailableKeywords, selectedCategory, selectedSpeakerRank, selectedBadgeSpeakerRank, selectedKeywords, searchQuery]);"
          )
          replace_once(
              'src/App.tsx',
              "      if (!currentUser && !isVisibleOnGuestHome(t)) return false;\n      if (!trackMatchesHomeBaseFilters(t, selectedCategory, selectedSpeakerRank, searchQuery)) return false;",
              "      if (!currentUser && !isVisibleOnGuestHome(t)) return false;\n      if (selectedBadgeSpeakerRank && normalizeSpeakerRankForBadge(t.speakerRank || '') !== selectedBadgeSpeakerRank) return false;\n      if (!trackMatchesHomeBaseFilters(t, selectedCategory, selectedSpeakerRank, searchQuery)) return false;"
          )
          app_path = Path('src/App.tsx')
          app_text = app_path.read_text()
          app_text = app_text.replace(
              "    selectedSpeakerRank,\n    selectedKeywords,",
              "    selectedSpeakerRank,\n    selectedBadgeSpeakerRank,\n    selectedKeywords,"
          )
          app_path.write_text(app_text)
          replace_once(
              'src/App.tsx',
              """                onSelectKeyword={kw => {\n                  setSelectedDetailTrack(null);\n                  setPlayerMode(savedPreferredMode);\n                  setSearchQuery(kw);\n                  setCurrentTab('home');\n                }}""",
              """                onSelectSpeakerRank={rank => {\n                  setSelectedDetailTrack(null);\n                  setPlayerMode(savedPreferredMode);\n                  setSelectedCategory('全部');\n                  setSelectedSpeakerRank('全部');\n                  setSelectedKeywords([]);\n                  setSearchQuery('');\n                  setIsSearchFocused(false);\n                  setSelectedBadgeSpeakerRank(rank);\n                  setUseDefaultHomeOrder(true);\n                  setCurrentTab('home');\n                  window.setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 0);\n                }}\n                onSelectKeyword={kw => {\n                  setSelectedDetailTrack(null);\n                  setPlayerMode(savedPreferredMode);\n                  setSelectedBadgeSpeakerRank('');\n                  setSearchQuery(kw);\n                  setCurrentTab('home');\n                }}"""
          )
          replace_once(
              'src/App.tsx',
              """            {/* Requirement 6 (v2.8): 多組網友關鍵字交叉複合搜尋 (Selected Keywords Chips & Tag Drawer) */}""",
              """            {selectedBadgeSpeakerRank && (\n              <div className=\"flex items-center justify-center gap-2 rounded-2xl border border-amber-200/80 bg-amber-50/90 px-3 py-2 text-sm text-amber-900 shadow-2xs dark:border-amber-700/40 dark:bg-amber-950/30 dark:text-amber-200\">\n                <span aria-hidden=\"true\">🏅</span>\n                <span className=\"font-bold\">獎章篩選：{selectedBadgeSpeakerRank}</span>\n                <button\n                  type=\"button\"\n                  onClick={() => setSelectedBadgeSpeakerRank('')}\n                  className=\"ml-1 rounded-full border border-amber-300/80 bg-white/80 px-2 py-0.5 text-xs font-bold text-amber-800 shadow-2xs hover:bg-amber-100 dark:border-amber-600/60 dark:bg-slate-900/70 dark:text-amber-200 cursor-pointer\"\n                  title=\"清除獎章篩選\"\n                >\n                  清除\n                </button>\n              </div>\n            )}\n\n            {/* Requirement 6 (v2.8): 多組網友關鍵字交叉複合搜尋 (Selected Keywords Chips & Tag Drawer) */}"""
          )

          # 5) Load the CSS and changelog note.
          replace_once(
              'src/main.tsx',
              "import './v166FilterSearchMatch.css';\n",
              "import './v166FilterSearchMatch.css';\nimport './v190RankBadge.css';\n"
          )
          replace_once(
              'index.html',
              "    <script type=\"module\" src=\"/src/v187ReleaseNote.ts\"></script>\n",
              "    <script type=\"module\" src=\"/src/v187ReleaseNote.ts\"></script>\n    <script type=\"module\" src=\"/src/v190ReleaseNote.ts\"></script>\n"
          )

          Path('src/v190ReleaseNote.ts').write_text("""type ChangelogEntry = {\n  version: string;\n  date: string;\n  isLatest?: boolean;\n  summary: string;\n  added: string[];\n  modified: string[];\n  removed: string[];\n};\n\nconst V190_RELEASE: ChangelogEntry = {\n  version: 'v190',\n  date: '2026/10/12',\n  isLatest: true,\n  summary: '音檔詳細介紹新增講師獎銜獎章，點獎章可直接回首頁查看同獎章的所有音檔。',\n  added: [\n    '詳細音檔介紹卡的講師照片右側，依講師獎銜顯示 R2「Pin-Level」資料夾內對應獎章。',\n    '獎章增加輕微跳動與三處閃光點綴，讓獎銜視覺更醒目。',\n    '點擊獎章會回到首頁播放清單，並只顯示講師獎銜與該獎章完全相同的音檔資訊卡。'\n  ],\n  modified: [\n    '獎章篩選使用獨立的精確獎銜條件，不會把「白金」與「創辦人白金」等不同獎章混在一起。',\n    '首頁在獎章篩選期間會顯示目前獎章名稱與「清除」按鈕，可一鍵恢復完整播放清單。'\n  ],\n  removed: []\n};\n\nconst runtime = window as Window & typeof globalThis & {\n  __ECHOSTARS_V190_RELEASE_PATCH__?: boolean;\n};\n\nfunction isChangelogGet(input: Parameters<typeof fetch>[0], init?: Parameters<typeof fetch>[1]) {\n  const method = String(init?.method || (input instanceof Request ? input.method : 'GET')).toUpperCase();\n  if (method !== 'GET') return false;\n  try {\n    const rawUrl = input instanceof Request ? input.url : String(input);\n    const url = new URL(rawUrl, window.location.origin);\n    return url.origin === window.location.origin && url.pathname === '/api/changelog';\n  } catch {\n    return false;\n  }\n}\n\nfunction mergeV190(data: unknown): ChangelogEntry[] {\n  const list = Array.isArray(data)\n    ? data.filter(item => item && typeof item === 'object') as ChangelogEntry[]\n    : [];\n  return [\n    V190_RELEASE,\n    ...list\n      .filter(item => item.version !== V190_RELEASE.version)\n      .map(item => ({ ...item, isLatest: false }))\n  ];\n}\n\nif (!runtime.__ECHOSTARS_V190_RELEASE_PATCH__) {\n  runtime.__ECHOSTARS_V190_RELEASE_PATCH__ = true;\n  const previousFetch = window.fetch.bind(window);\n  window.fetch = (async (...args: Parameters<typeof fetch>) => {\n    const [input, init] = args;\n    if (!isChangelogGet(input, init)) return previousFetch(...args);\n    try {\n      const response = await previousFetch(...args);\n      const data = response.ok ? await response.clone().json().catch(() => []) : [];\n      const headers = new Headers(response.headers);\n      headers.set('Content-Type', 'application/json; charset=utf-8');\n      headers.delete('Content-Length');\n      headers.delete('Content-Encoding');\n      return new Response(JSON.stringify(mergeV190(data)), {\n        status: 200,\n        statusText: 'OK',\n        headers\n      });\n    } catch {\n      return new Response(JSON.stringify(mergeV190([])), {\n        status: 200,\n        headers: { 'Content-Type': 'application/json; charset=utf-8' }\n      });\n    }\n  }) as typeof window.fetch;\n}\n""")

          Path('tests/v190RankBadgeIntegration.test.ts').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\nconst badge = readFileSync(new URL('../src/utils/speakerRankBadge.ts', import.meta.url), 'utf8');\nconst detail = readFileSync(new URL('../src/components/DetailView.tsx', import.meta.url), 'utf8');\nconst app = readFileSync(new URL('../src/App.tsx', import.meta.url), 'utf8');\nconst css = readFileSync(new URL('../src/v190RankBadge.css', import.meta.url), 'utf8');\nconst index = readFileSync(new URL('../index.html', import.meta.url), 'utf8');\n\ntest('v190 maps every R2 Pin-Level medal filename to its exact speaker rank', () => {\n  const required = [\n    ['銅章', '01銅章.png'], ['銀章', '02銀章.png'], ['金章', '03金章.png'], ['白金', '04白金.png'],\n    ['紅寶石', '05紅寶石.png'], ['創辦人白金', '06創辦人白金.png'], ['創辦人紅寶石', '07創辦人紅寶石.png'],\n    ['明珠', '08明珠.png'], ['藍寶石', '09藍寶石.png'], ['創辦人藍寶石', '10創辦人藍寶石.png'],\n    ['翡翠', '11翡翠.png'], ['創辦人翡翠', '12創辦人翡翠.png'], ['鑽石', '13鑽石.png'],\n    ['創辦人鑽石', '14創辦人鑽石.png'], ['執行專才鑽石', '15 EDC.png'], ['創辦人執行專才鑽石', '16創辦人EDC.png'],\n    ['雙鑽石', '17雙鑽石.png'], ['創辦人雙鑽石', '18創辦人雙鑽石.png'], ['參鑽石', '19參鑽石.png'],\n    ['創辦人參鑽石', '20創辦人參鑽石.png'], ['皇冠', '21皇冠.png'], ['創辦人皇冠', '22創辦人皇冠.png'],\n    ['皇冠大使', '23皇冠大使.png'], ['創辦人皇冠大使', '24創辦人皇冠大使.png']\n  ];\n  for (const [rank, file] of required) {\n    assert.match(badge, new RegExp(`'${rank}': '${file.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}'`));\n  }\n  assert.match(badge, /Pin-Level\\/\\$\\{fileName\\}/);\n  assert.match(badge, /api\\/r2\\/file/);\n});\n\ntest('v190 detail card shows a clickable medal to the right of the cover with sparkle animation', () => {\n  assert.match(detail, /const rankBadge = speakerRankBadge\(track\.speakerRank/);\n  assert.match(detail, /left: 'calc\(100% \+ 0\.55rem\)'/);\n  assert.match(detail, /onSelectSpeakerRank\?\.\(rankBadge\.rank\)/);\n  assert.match(detail, /v190-rank-badge-sparkle--one/);\n  assert.match(detail, /v190-rank-badge-sparkle--two/);\n  assert.match(detail, /v190-rank-badge-sparkle--three/);\n  assert.match(css, /@keyframes v190-rank-badge-bob/);\n  assert.match(css, /@keyframes v190-rank-badge-sparkle/);\n});\n\ntest('v190 medal click returns home and applies an exact medal-rank filter', () => {\n  assert.match(app, /selectedBadgeSpeakerRank/);\n  assert.match(app, /normalizeSpeakerRankForBadge\(t\.speakerRank \|\| ''\) !== selectedBadgeSpeakerRank/);\n  assert.match(app, /onSelectSpeakerRank=\{rank =>/);\n  assert.match(app, /setSelectedCategory\('全部'\)/);\n  assert.match(app, /setSelectedSpeakerRank\('全部'\)/);\n  assert.match(app, /setSelectedKeywords\(\[\]\)/);\n  assert.match(app, /setSearchQuery\(''\)/);\n  assert.match(app, /setCurrentTab\('home'\)/);\n  assert.match(app, /獎章篩選：\{selectedBadgeSpeakerRank\}/);\n});\n\ntest('v190 release note is loaded and no DOM MutationObserver is introduced for the medal feature', () => {\n  assert.match(index, /\\/src\\/v190ReleaseNote\.ts/);\n  assert.doesNotMatch(badge, /MutationObserver/);\n  assert.doesNotMatch(css, /MutationObserver/);\n});\n""")

          # Self-remove the one-time patch workflow so it never becomes product code.
          Path('.github/workflows/v190-apply-rank-badges.yml').unlink()
          PY

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "EchoStars v190 automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "v190：詳細頁顯示獎銜獎章並可點擊精確篩選 [v190-patched]"
          git push origin HEAD:safe/v190-rank-badges
