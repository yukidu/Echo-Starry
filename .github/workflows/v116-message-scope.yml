name: v116 message scope

on:
  push:
    branches:
      - safe/v116-notification-tabs

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply message scope fix
        run: python3 scripts/v116_message_scope.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run tests
        run: npm test
      - name: TypeScript diagnostic
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit verified source
        run: |
          rm -f scripts/v116_message_scope.py .github/workflows/v116-message-scope.yml package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified source changes to commit"
            exit 0
          fi
          git commit -m "v116：我的訊息只顯示與本人相關內容"
          git push origin HEAD:safe/v116-notification-tabs
