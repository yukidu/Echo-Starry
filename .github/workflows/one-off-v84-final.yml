name: One-off v84 final detail UX
on:
  push:
    branches: [ui/detail-page-ux-v84]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/detail-page-ux-v84
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch detail and comments
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def once(s, old, new, label):
              if old not in s:
                  raise RuntimeError(f'missing target: {label}')
              return s.replace(old, new, 1)

          p = Path('src/components/DetailView.tsx')
          s = p.read_text()
          s = once(s, "  const [keywordError, setKeywordError] = useState<string | null>(null);", "  const [keywordError, setKeywordError] = useState<string | null>(null);\n  const [showDetailKeywords, setShowDetailKeywords] = useState(false);", 'keyword state')
          sync = "  useEffect(() => {\n    setTrackKeywords(track.keywords || []);\n    setKeywordMeta(track.keywordMeta || {});\n  }, [track.id, track.keywords, track.keywordMeta]);"
          s = once(s, sync, sync + "\n\n  useEffect(() => {\n    setShowDetailKeywords(false);\n    setIsAddingKeyword(false);\n  }, [track.id]);", 'keyword reset')
          s = once(s, ": track.category ? [track.category] : ['未分類'];", ": track.category ? [track.category] : [];", 'category fallback')
          s = once(s, "    return text || '未填寫';", "    return text;", 'blank text')
          s = once(s, "    if (!raw) return '未填寫';", "    if (!raw) return '';", 'blank date')
          safe = "  const safeDuration = duration > 0 ? duration : (track.durationSeconds || 600);"
          seek = safe + "\n  const scrubberDragAllowedRef = useRef(false);\n\n  const handleScrubberPointerDown = (event: React.PointerEvent<HTMLInputElement>) => {\n    const rect = event.currentTarget.getBoundingClientRect();\n    const ratio = safeDuration > 0 ? Math.min(1, Math.max(0, currentTime / safeDuration)) : 0;\n    const thumbX = rect.left + rect.width * ratio;\n    const thumbTouchRadius = 28;\n    if (Math.abs(event.clientX - thumbX) > thumbTouchRadius) {\n      scrubberDragAllowedRef.current = false;\n      event.preventDefault();\n      return;\n    }\n    scrubberDragAllowedRef.current = true;\n  };\n\n  const handleScrubberChange = (event: React.ChangeEvent<HTMLInputElement>) => {\n    if (!scrubberDragAllowedRef.current) return;\n    onSeek(Number(event.target.value));\n  };\n\n  const finishScrubberDrag = () => { scrubberDragAllowedRef.current = false; };"
          s = once(s, safe, seek, 'seek functions')
          s = once(s, '    <div className="max-w-2xl mx-auto px-3.5 py-3 sm:px-6 space-y-4 pb-28">', '    <div className="max-w-2xl mx-auto px-3.5 py-3 sm:px-6 space-y-3 pb-28 leading-snug">', 'density')

          header = re.compile(r'''          <div className="flex items-center gap-1\.5 font-bold text-xs text-slate-800 dark:text-slate-200">\s*<span>網友關鍵字</span>\s*<span className="text-\[10px\] text-slate-400 font-normal">\s*\(\{trackKeywords\.length\}/50 組\)\s*</span>\s*</div>\s*\{canAddKeywords && !isAddingKeyword && \(''', re.S)
          repl = '''          <button type="button" onClick={() => setShowDetailKeywords(prev => !prev)} className="flex flex-wrap items-center gap-x-1.5 gap-y-0.5 font-bold text-sm text-slate-800 dark:text-slate-200 text-left cursor-pointer">
            <span>網友關鍵字</span>
            <span className="text-xs text-slate-400 font-normal">({trackKeywords.length}/50 組)</span>
            <span className="text-sm font-bold text-slate-400">{showDetailKeywords ? '▲ 收起' : '▼ 展開'}</span>
          </button>
          {showDetailKeywords && canAddKeywords && !isAddingKeyword && ('''
          s, n = header.subn(repl, s, count=1)
          if n != 1: raise RuntimeError('keyword header')
          s = once(s, '<div className="flex flex-wrap gap-x-1 gap-y-0.5 items-center">', '<div className={`${showDetailKeywords ? \'flex\' : \'hidden\'} flex-wrap gap-x-1 gap-y-0.5 items-center`}>', 'keyword body')
          s = once(s, '{keywordError && !isAddingKeyword && <p role="alert"', '{showDetailKeywords && keywordError && !isAddingKeyword && <p role="alert"', 'keyword error')
          s = once(s, '{isAddingKeyword && (\n          <div className="mt-2.5', '{showDetailKeywords && isAddingKeyword && (\n          <div className="mt-2.5', 'keyword form')

          s = once(s, '            onChange={e => onSeek(Number(e.target.value))}\n            className="audio-scrubber w-full h-1.5 cursor-pointer"', '            onPointerDown={handleScrubberPointerDown}\n            onPointerUp={finishScrubberDrag}\n            onPointerCancel={finishScrubberDrag}\n            onBlur={finishScrubberDrag}\n            onKeyDown={event => event.preventDefault()}\n            onChange={handleScrubberChange}\n            className="audio-scrubber w-full h-1.5 cursor-grab active:cursor-grabbing"\n            aria-label="播放進度，請拖曳目前播放位置的圓點調整"', 'scrubber events')
          time_pattern = re.compile(r'''          <div className="flex justify-between items-center text-xs font-mono text-slate-500 dark:text-slate-400 px-0\.5">\s*<span>\{formatTime\(currentTime\)\} / \{formatTime\(safeDuration\)\}</span>\s*<span className="text-\[11px\] text-slate-400">\s*\{Math\.round\(\(currentTime / safeDuration\) \* 100\)\}%\s*</span>\s*</div>''', re.S)
          s, n = time_pattern.subn('''          <div className="grid grid-cols-[1fr_auto_1fr] items-center text-xs font-mono text-slate-500 dark:text-slate-400 px-0.5">
            <span aria-hidden="true" />
            <span className="justify-self-center text-center">{formatTime(currentTime)} / {formatTime(safeDuration)}</span>
            <span className="justify-self-end text-[11px] text-slate-400">{Math.round((currentTime / safeDuration) * 100)}%</span>
          </div>''', s, count=1)
          if n != 1: raise RuntimeError('time row')

          s = once(s, 'rounded-2xl p-4 border border-rose-100/60 dark:border-slate-800 shadow-xs space-y-2.5 text-xs overflow-hidden', 'rounded-2xl p-3.5 border border-rose-100/60 dark:border-slate-800 shadow-xs space-y-2 text-xs overflow-hidden', 'info density')
          info_head = re.compile(r'''<div className="relative z-10 space-y-2\.5">\s*<div className="flex items-center justify-between">\s*<h3 className="font-bold text-slate-800 dark:text-slate-100 text-sm">\s*演講資訊與備註\s*</h3>''', re.S)
          s, n = info_head.subn('<div className="relative z-10 space-y-2">\n          <div className="flex items-center justify-end">', s, count=1)
          if n != 1: raise RuntimeError('info heading')
          s = once(s, '<span>編輯演講資訊與連結</span>', '<span>編輯</span>', 'edit text')
          s = once(s, 'leading-relaxed whitespace-pre-wrap', 'leading-snug whitespace-pre-wrap', 'description spacing')
          s = once(s, 'className="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-500"', 'className="grid grid-cols-2 gap-x-2 gap-y-1 pt-1.5 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-500"', 'metadata spacing')
          s = once(s, 'className="col-start-2 row-start-1 text-right whitespace-nowrap"', 'className="col-start-2 row-start-1 flex items-baseline gap-1 whitespace-nowrap"', 'speech align')
          s = once(s, 'className="col-start-2 row-start-2 text-right whitespace-nowrap"', 'className="col-start-2 row-start-2 flex items-baseline gap-1 whitespace-nowrap"', 'upload align')
          p.write_text(s)

          p = Path('src/components/CommentsSection.tsx')
          s = p.read_text()
          s = once(s, "const showBadge = !!displayAuthorBadge && displayAuthorBadge !== '訪客稱號' && displayAuthorBadge !== '訪客' && displayAuthorBadge !== '無';", 'const showBadge = !!registeredAuthor;', 'rank line')
          s = once(s, 'className="w-full bg-white/70 dark:bg-slate-900/60 rounded-3xl p-5 sm:p-7 border border-rose-100/60 dark:border-slate-800 shadow-xs relative"', 'className="w-full bg-white/70 dark:bg-slate-900/60 rounded-3xl p-4 sm:p-5 border border-rose-100/60 dark:border-slate-800 shadow-xs relative leading-snug"', 'comment density')
          s = once(s, 'className="flex items-center justify-between mb-4"', 'className="flex items-center justify-between mb-3"', 'heading margin')
          s = once(s, '<form onSubmit={handleSubmit} className="mb-8 relative">', '<form onSubmit={handleSubmit} className="mb-5 relative">', 'form margin')
          s = once(s, 'rounded-2xl p-4 border border-slate-200/70', 'rounded-2xl p-3.5 border border-slate-200/70', 'composer padding')

          footer = re.compile(r'''          <div className="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-200/50 dark:border-slate-700/50 mt-2">.*?          </div>(?=\n        </div>\n\n        \{errorMessage)''', re.S)
          s, n = footer.subn('''          <div className="flex items-center justify-end gap-3 pt-2.5 border-t border-slate-200/50 dark:border-slate-700/50 mt-1.5">
            <span className="text-xs text-slate-400 font-mono">{inputText.length}/2000</span>
            <button type="submit" disabled={isSubmitting || !inputText.trim()} className="px-5 py-2 rounded-xl text-white font-medium text-sm transition-all shadow-xs active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer" style={{ backgroundColor: 'var(--color-primary, #c06c84)' }}>
              {isSubmitting ? '送出中…' : '送出'}
            </button>
          </div>''', s, count=1)
          if n != 1: raise RuntimeError('comment composer footer')

          author = re.compile(r'''                <div className="flex items-center justify-between gap-2 text-xs">\s*<div onClick=\{isClickable \? \(\) => handleAuthorClick\(c\) : undefined\} className=\{`flex items-center gap-1\.5 flex-wrap \$\{isClickable \? 'cursor-pointer hover:opacity-85 transition-opacity' : 'cursor-default pointer-events-none'\}`\} title=\{isClickable \? `點擊查看【\$\{displayAuthorName\}】會員個人檔案` : undefined\}>.*?<div className="flex items-center gap-2 shrink-0">''', re.S)
          author_new = '''                <div className="flex items-start justify-between gap-2">
                  <div onClick={isClickable ? () => handleAuthorClick(c) : undefined} className={`flex items-center gap-2 min-w-0 ${isClickable ? 'cursor-pointer hover:opacity-85 transition-opacity' : 'cursor-default pointer-events-none'}`} title={isClickable ? `點擊查看【${displayAuthorName}】會員個人檔案` : undefined}>
                    {isAvatarUrl ? <img src={displayAuthorAvatar} alt={displayAuthorName} className="w-10 h-10 rounded-full object-cover shrink-0 ring-1 ring-slate-200 dark:ring-slate-700" /> : <span className="w-10 h-10 rounded-full flex items-center justify-center text-2xl shrink-0">{displayAuthorAvatar || '👤'}</span>}
                    <div className="h-10 min-w-0 flex flex-col justify-center gap-0.5 leading-none">
                      {c.isAdmin || displayAuthorBadge === '貢獻者' ? <span className="rainbow-admin-text font-bold text-sm truncate">{displayAuthorName}</span> : isClickable ? <span className="font-bold text-slate-800 dark:text-slate-100 text-sm underline decoration-dotted underline-offset-2 hover:text-rose-600 transition-colors truncate">{displayAuthorName}</span> : <span className="font-bold text-slate-700 dark:text-slate-300 text-sm select-none truncate">{displayAuthorName}</span>}
                      <div className="flex items-center gap-1 min-w-0">
                        {isVisitor && <span className="text-xs px-1.5 py-0.5 rounded-md bg-[var(--color-light-pill,#fae8ed)] text-[var(--color-primary,#c06c84)] border border-[var(--theme-border-subtle,#f1e7ea)] dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 font-medium select-none">訪客</span>}
                        {showBadge && <span className="text-xs px-1.5 py-0.5 rounded-md bg-[var(--color-light-pill,#fae8ed)] text-[var(--color-primary,#c06c84)] border border-[var(--theme-border-subtle,#f1e7ea)] dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700 font-medium truncate">{displayAuthorBadge}</span>}
                        <span className="text-[11px] text-slate-400 dark:text-slate-500 font-mono whitespace-nowrap">{c.timestamp}</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-1 shrink-0 pt-0.5">'''
          s, n = author.subn(author_new, s, count=1)
          if n != 1: raise RuntimeError('comment author row')
          s = once(s, 'className="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed pl-6 whitespace-pre-wrap mt-0.5 break-words"', 'className="text-base text-slate-700 dark:text-slate-300 leading-snug pl-12 whitespace-pre-wrap mt-1 break-words"', 'comment text')
          s = once(s, 'className="mt-1.5 space-y-1.5 pl-5"', 'className="mt-1.5 space-y-1.5 pl-12"', 'edit indent')
          s = once(s, 'dark:bg-slate-700/60 text-xs text-slate-800', 'dark:bg-slate-700/60 text-sm text-slate-800', 'edit size')
          p.write_text(s)

          Path('tests/detailPageUx.test.ts').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nconst detail = readFileSync(new URL('../src/components/DetailView.tsx', import.meta.url), 'utf8');\nconst comments = readFileSync(new URL('../src/components/CommentsSection.tsx', import.meta.url), 'utf8');\ntest('detail page mobile interaction rules', () => { assert.match(detail, /thumbTouchRadius = 28/); assert.match(detail, /onPointerDown=\\{handleScrubberPointerDown\\}/); assert.match(detail, /grid-cols-\\[1fr_auto_1fr\\]/); assert.match(detail, /showDetailKeywords, setShowDetailKeywords\\] = useState\\(false\\)/); assert.match(detail, /<span>編輯<\\/span>/); assert.doesNotMatch(detail, />演講資訊與備註</); assert.match(detail, /if \\(!raw\\) return '';/); });\ntest('comment composer and rows are compact and readable', () => { assert.doesNotMatch(comments, /送出心得/); assert.match(comments, /'送出'/); assert.match(comments, /w-10 h-10 rounded-full object-cover/); assert.match(comments, /h-10 min-w-0 flex flex-col justify-center/); assert.match(comments, /text-base text-slate-700[\\s\\S]*leading-snug pl-12/); });\n""")

          p = Path('src/changelogReleaseNotes.ts')
          s = p.read_text()
          anchor = "    '首頁網友關鍵字視覺再統一：關閉 X 會跟著目前調色盤主色同步；展開清單與已選條件中的關鍵字都改為一般字重；排序整排按鈕與上方搜尋框統一高度，切換排序時不再因縮放造成高度跳動。',\n"
          note = "    '音檔詳細頁操作整理：播放時間軸改成只能從目前播放圓點按住拖曳，避免誤點跳段；時間置中。演講資訊空白欄位不再顯示「未填寫」，編輯按鈕簡化為「編輯」，關鍵字預設收起並可展開；心得輸入移除姓名獎銜、送出按鈕簡化，留言頭像放大、姓名與獎銜上下排列，全文字體與頁面行距同步優化。',\n"
          if anchor not in s: raise RuntimeError('changelog anchor')
          p.write_text(s.replace(anchor, anchor + note, 1))
          p = Path('public/sw.js'); s = p.read_text(); p.write_text(once(s, 'echostars-shell-v83', 'echostars-shell-v84', 'cache'))
          p = Path('tests/releaseIntegrity.test.ts'); s = p.read_text(); s = once(s, "test('v83 is the single current PWA cache version'", "test('v84 is the single current PWA cache version'", 'release title'); p.write_text(s.replace('echostars-shell-v83', 'echostars-shell-v84'))
          PY
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/DetailView.tsx src/components/CommentsSection.tsx tests/detailPageUx.test.ts src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts
          git diff --cached --check
          git commit -m '整理音檔詳細頁播放器資訊與心得介面'
          git push origin HEAD:ui/detail-page-ux-v84
