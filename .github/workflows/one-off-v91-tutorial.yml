name: One-off v91 tutorial layout

on:
  push:
    branches: [fix/tutorial-layout-copy-v91]
    paths:
      - .github/workflows/one-off-v91-tutorial.yml
      - scripts/patch-v91-tutorial.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tutorial-layout-copy-v91
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply tutorial patch
        run: python scripts/patch-v91-tutorial.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name echostars-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/App.tsx src/components/TutorialSpotlight.tsx tests/tutorialSpotlight.test.ts public/sw.js tests/releaseIntegrity.test.ts src/changelogReleaseNotes.ts
          git commit -m "調整新手教學文字與自適應位置" || exit 0
          git push
