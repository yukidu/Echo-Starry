name: v106 finalize changelog

on:
  push:
    branches:
      - safe/v106-sticker-leaderboard

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v106-sticker-leaderboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Finalize changelog
        run: python scripts/v106_finalize_changelog.py
      - name: Full test suite
        run: npm test
      - name: TypeScript diagnostic
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit verified changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/v106_finalize_changelog.py .github/workflows/v106-finalize-changelog.yml
          git add src/changelogReleaseNotes.ts
          git commit -m "v106: publish sticker leaderboard changelog"
          git push origin HEAD:safe/v106-sticker-leaderboard
