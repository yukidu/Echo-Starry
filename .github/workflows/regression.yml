name: Regression audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run every regression test file and report all failures
        id: tests
        shell: bash
        run: |
          set +e
          failed=0
          total=0
          passed=0
          for test_file in tests/*.test.ts; do
            total=$((total + 1))
            echo ""
            echo "============================================================"
            echo "TEST FILE: ${test_file}"
            echo "============================================================"
            node --import tsx --test "${test_file}"
            status=$?
            if [ ${status} -eq 0 ]; then
              passed=$((passed + 1))
              echo "PASS: ${test_file}"
            else
              failed=1
              echo "FAIL: ${test_file} (exit ${status})"
            fi
          done
          echo ""
          echo "Regression files passed: ${passed}/${total}"
          exit ${failed}

      - name: TypeScript diagnostic
        if: always()
        run: npm run lint

      - name: Production build
        if: always()
        run: npm run build
