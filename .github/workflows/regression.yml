name: Regression audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Personal learning card and image exports
        run: node --import tsx --test tests/imageExportQuality.test.ts tests/learningHistoryAccess.test.ts tests/learningHistoryCompatibility.test.ts tests/learningProgress.test.ts
      - name: Login session and playback ownership
        run: node --import tsx --test tests/googleAuthSecurity.test.ts tests/playbackOwnerRouter.test.ts tests/publicLearningHistoryRoute.test.ts
      - name: Categories community and upload flows
        run: node --import tsx --test tests/categoryIntegrity.test.ts tests/categoryManagementPolicy.test.ts tests/community.test.ts tests/uploadModalPresentationPolicy.test.ts
      - name: Sharing PWA privacy and mobile navigation
        run: node --import tsx --test tests/shareLinks.test.ts tests/releaseIntegrity.test.ts tests/privacyCrawler.test.ts tests/mediaSessionPolicy.test.ts tests/mobileMenuHalfLayout.test.ts tests/mobileMenuWidth.test.ts tests/vipAutoplay.test.ts
      - name: TypeScript diagnostic
        run: npm run lint
      - name: Production build
        run: npm run build
