name: Regression audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: regression-tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: echostars-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            echostars-npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Run isolated regression shard
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: |
          set +e
          mkdir -p /tmp/regression-output
          log_file="/tmp/regression-output/shard-${SHARD_INDEX}.log"
          : > "${log_file}"

          mapfile -t test_files < <(find tests -maxdepth 1 -type f -name '*.test.ts' -print | sort)
          total=${#test_files[@]}
          if [ "${total}" -eq 0 ]; then
            echo "No regression test files found." | tee -a "${log_file}"
            exit 1
          fi

          selected=0
          failed=0
          for index in "${!test_files[@]}"; do
            if [ $((index % SHARD_COUNT)) -ne "${SHARD_INDEX}" ]; then
              continue
            fi

            test_file="${test_files[$index]}"
            selected=$((selected + 1))
            echo "" | tee -a "${log_file}"
            echo "============================================================" | tee -a "${log_file}"
            echo "TEST FILE: ${test_file}" | tee -a "${log_file}"
            echo "============================================================" | tee -a "${log_file}"
            node --import tsx --test "${test_file}" 2>&1 | tee -a "${log_file}"
            status=${PIPESTATUS[0]}
            if [ "${status}" -ne 0 ]; then
              failed=1
              echo "FAIL: ${test_file} (exit ${status})" | tee -a "${log_file}"
            else
              echo "PASS: ${test_file}" | tee -a "${log_file}"
            fi
          done

          echo "Shard ${SHARD_INDEX}: ${selected} test files" | tee -a "${log_file}"
          exit "${failed}"
      - name: Upload regression failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output-${{ github.sha }}-shard-${{ matrix.shard }}
          path: /tmp/regression-output
          if-no-files-found: ignore
          retention-days: 1

  diagnostics-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: echostars-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            echostars-npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: TypeScript diagnostic
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Share production build with browser checks
        uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  browser-ui:
    needs: diagnostics-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: echostars-npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            echostars-npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: dist
      - name: Browser UI check
        shell: bash
        run: |
          if [ ! -f dist/index.html ]; then
            echo "dist/index.html missing; production build did not produce a runnable app."
            exit 1
          fi

          node scripts/scanThemeLegacy.mjs

          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/echostars-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill ${preview_pid} >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ ${ready} -ne 1 ]; then
            echo "Vite preview did not become ready."
            cat /tmp/echostars-preview.log || true
            exit 1
          fi

          if ! node scripts/verifyThemeMenuUi.mjs; then
            echo "Theme browser UI check startup failed once; retrying one final time."
            sleep 2
            node scripts/verifyThemeMenuUi.mjs
          fi

          if [ -f scripts/verifyV167CategoryFilterUi.mjs ]; then
            if ! node scripts/verifyV167CategoryFilterUi.mjs; then
              echo "Category dropdown browser UI check startup failed once; retrying one final time."
              sleep 2
              node scripts/verifyV167CategoryFilterUi.mjs
            fi
          else
            if ! node scripts/verifyCategoryFilterUi.mjs; then
              echo "Category browser UI check startup failed once; retrying one final time."
              sleep 2
              node scripts/verifyCategoryFilterUi.mjs
            fi
          fi

          if ! node scripts/verifyV156Ui.mjs; then
            echo "v156 browser UI check startup failed once; retrying one final time."
            sleep 2
            node scripts/verifyV156Ui.mjs
          fi

          if ! node scripts/verifyV163RootUi.mjs; then
            echo "v163 root UI check startup failed once; retrying one final time."
            sleep 2
            node scripts/verifyV163RootUi.mjs
          fi

          if ! node scripts/verifyV167PageNavigation.mjs; then
            echo "v169 filter behavior/browser editor check startup failed once; retrying one final time."
            sleep 2
            node scripts/verifyV167PageNavigation.mjs
          fi

          if ! node scripts/verifyV168AudioEditSave.mjs; then
            echo "v168 audio-edit save browser check startup failed once; retrying one final time."
            sleep 2
            node scripts/verifyV168AudioEditSave.mjs
          fi

          if ! node scripts/verifyV169UploadTabs.mjs; then
            echo "v169 upload-tab browser check startup failed once; retrying one final time."
            sleep 2
            node scripts/verifyV169UploadTabs.mjs
          fi

          if ! node scripts/verifyV174CrownTruePage.mjs; then
            echo "v174 Crown true-page browser check startup failed once; retrying one final time."
            sleep 2
            node scripts/verifyV174CrownTruePage.mjs
          fi
      - name: Upload browser UI failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ github.sha }}
          path: |
            /tmp/echostars-preview.log
            /tmp/echostars-theme-*
            /tmp/echostars-category-*
            /tmp/echostars-v156-*
            /tmp/echostars-v163-*
            /tmp/echostars-v167-*
            /tmp/echostars-v168-*
            /tmp/echostars-v169-*
            /tmp/echostars-v174-*
          if-no-files-found: ignore
          retention-days: 7
