name: Migrate Starry ID Members

# Never run production D1 mutations on a main push.
# Manual execution additionally requires the exact typed approval phrase.
on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: 'Type MIGRATE_STARRY_ID_PRODUCTION to authorize production D1 changes'
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approval_phrase == 'MIGRATE_STARRY_ID_PRODUCTION' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ECHOSTARS_D1_ID: e0a696a9-0233-4186-be4d-229435b19a27
      STARRY_ID_D1_ID: 01195c92-555e-4816-bddc-5b8cb2e795db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify migration code
        run: npm run lint
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
      - name: Migrate EchoStars member profiles to Starry ID
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p starry-id/audit-output
          npx tsx starry-id/remoteMigrate.ts | tee starry-id/audit-output/member-migration.json
      - name: Migrate EchoStars sticker ledger to central battery ledger
        shell: bash
        run: |
          set -euo pipefail
          npx tsx starry-id/migrateBatteries.ts | tee starry-id/audit-output/battery-migration.json
      - name: Retire verified legacy sticker ledger
        shell: bash
        run: |
          set -euo pipefail
          npx tsx starry-id/retireLegacyStickerLedger.ts | tee starry-id/audit-output/battery-retirement.json
      - name: Upload non-PII migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starry-id-member-and-battery-migration
          path: starry-id/audit-output/*.json
          if-no-files-found: warn
