name: One-off v95 lucky slot reel

on:
  push:
    branches: [fix/lucky-slot-reel-v95]
    paths:
      - .github/workflows/one-off-v95-lucky-slot-reel.yml
      - scripts/patch-v95-lucky-slot-reel.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lucky-slot-reel-v95
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixed surrounding cards lucky reel
        run: python scripts/patch-v95-lucky-slot-reel.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name echostars-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/App.tsx src/index.css src/changelogReleaseNotes.ts public/sw.js tests/homeLuckyDrawUi.test.ts tests/releaseIntegrity.test.ts
          git commit -m "重做好手氣第二槽轉輪避免整頁晃動" || exit 0
          git push
