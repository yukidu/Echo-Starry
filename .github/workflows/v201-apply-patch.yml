name: v201 apply safe patch

on:
  push:
    branches:
      - safe/v201-member-profile-menu-upline

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v201-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v201-member-profile-menu-upline
          fetch-depth: 0
      - name: Apply v201 changes
        run: python scripts/v201_apply_patch.py
      - name: Check patch
        run: git diff --check
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src shared worker tests index.html
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "[v201-patch] v201：會員工具、基本資料與上手關聯詞整合"
          git push origin HEAD:safe/v201-member-profile-menu-upline
