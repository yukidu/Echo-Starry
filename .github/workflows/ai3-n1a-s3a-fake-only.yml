name: AI3 N1A S3A offline shared gate and B07
on:
  pull_request:
    branches:
      - safety/ai2-n1a-s3a-shared-envelope-20261020
    paths:
      - 'tests/ai3N1aS3aB07.test.ts'
      - 'tests/ai3_s3a_fake_driver.py'
      - 'tests/n1a_s1_b07*.py'
      - 'tests/test_n1a_s1_b07*.py'
      - 'docs/STARRY_AI3_N1A_S3A_OFFLINE_INTEGRATION.md'
      - '.github/workflows/ai3-n1a-s3a-fake-only.yml'
permissions:
  contents: read
jobs:
  offline-shared-b07:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Same-process shared TS gate with local Python SQLite child
        run: node --import tsx --test tests/ai3N1aS3aB07.test.ts tests/n1aS3aSharedEnvelope.test.ts
      - name: Original S1 fake regression, no cloud or provider
        run: python3 -m unittest discover -s tests -p 'test_n1a_s1_b07*.py' -v
      - run: npm run lint
      - name: Existing TypeScript regression
        run: npm test
