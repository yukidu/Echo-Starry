name: Apply v101 patch

on:
  push:
    branches:
      - safe/v101-sticker-rank-lucky-ui

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v101 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v101-sticker-rank-lucky-ui
      - name: Apply prepared patch
        run: |
          base64 -d scripts/v101.patch.gz.b64 | gzip -d > /tmp/v101.patch
          git apply -p2 --check /tmp/v101.patch
          git apply -p2 /tmp/v101.patch
          rm scripts/v101.patch.gz.b64 .github/workflows/apply-v101.yml
      - name: Commit v101 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v101：獎銜貼紙與召喚繁星解答 [v101 applied]"
          git push origin HEAD:safe/v101-sticker-rank-lucky-ui
