name: v111 production trigger

on:
  push:
    branches: [safe/v111-hidden-balance-correction]

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v111-hidden-balance-correction
      - name: Trigger production sticker worker
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/response.json -w "%{http_code}" --max-time 30 https://echostars.yukidu.workers.dev/api/stickers/leaderboard)
          echo "Production sticker API HTTP ${code}"
          test "${code}" = "200"
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "yukidu"
          git config user.email "yukidu@gmail.com"
          git rm .github/workflows/v111-production-trigger.yml
          git commit -m "chore：移除 v111 正式觸發工具"
          git push origin HEAD:safe/v111-hidden-balance-correction
