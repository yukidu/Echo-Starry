name: One-off v90 comment replies

on:
  push:
    branches: [fix/comment-reply-display-v90]
    paths:
      - .github/workflows/one-off-v90-comment-replies.yml
      - scripts/patch-v90-comment-replies.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comment-reply-display-v90
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reply display patch
        run: python scripts/patch-v90-comment-replies.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: |
          set +e
          npm test > test-output-v90.txt 2>&1
          status=$?
          set -e
          cat test-output-v90.txt
          if [ "$status" -ne 0 ]; then
            git config user.name echostars-release-bot
            git config user.email actions@users.noreply.github.com
            git add test-output-v90.txt
            git commit -m "記錄 v90 回歸失敗輸出" || true
            git push
            exit "$status"
          fi
          rm -f test-output-v90.txt
      - name: Production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name echostars-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/components/CommentsSection.tsx tests/commentTimestamp.test.ts tests/commentCollapse.test.ts public/sw.js tests/releaseIntegrity.test.ts src/changelogReleaseNotes.ts
          git add -A test-output-v90.txt || true
          git commit -m "精簡留言回覆顯示與時間字體" || exit 0
          git push

# Final rerun after synchronizing the collapsible-comment regression rule.
