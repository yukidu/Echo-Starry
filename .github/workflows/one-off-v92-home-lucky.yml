name: One-off v92 home lucky draw

on:
  push:
    branches: [feat/home-default-random-lucky-draw-v92]
    paths:
      - .github/workflows/one-off-v92-home-lucky.yml
      - scripts/patch-v92-home-lucky.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-default-random-lucky-draw-v92
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply home lucky draw patch
        run: python scripts/patch-v92-home-lucky.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name echostars-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/App.tsx src/index.css src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts
          git commit -m "新增首頁個人化預設排序與好手氣轉輪" || exit 0
          git push
