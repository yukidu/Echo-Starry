name: v112 audit

on:
  push:
    branches:
      - safe/v112-sticker-rank-integrity

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live sticker leaderboard snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail --retry 3 https://echostars.yukidu.workers.dev/api/stickers/leaderboard > /tmp/leaderboard.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/leaderboard.json'))
          for i,e in enumerate(data.get('entries',[]),1):
              u=e.get('user',{})
              print(f"{i:02d}\t{u.get('name')}\t{u.get('rank')}\tcurrent={e.get('current')}\tearned={e.get('earned')}\tspent={e.get('spent')}")
          PY
      - name: Rank usage audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== raw rank references in member-facing components ==='
          rg -n "rankApproved|approvedRank|\.rank" src/components src/utils src/App.tsx | head -n 500 || true
          echo '=== sticker correction references ==='
          rg -n "balance_correction|HIDDEN_BALANCE_TARGETS|hidden-sticker-balance" worker tests src/components || true
