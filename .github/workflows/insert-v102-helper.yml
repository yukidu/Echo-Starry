name: Insert v102 couple helper

on:
  push:
    branches:
      - safe/v102-ui-admin-lucky-upline
    paths:
      - .github/workflows/insert-v102-helper.yml

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v102-ui-admin-lucky-upline
          fetch-depth: 0
      - name: Insert helper block from original prepared patch
        shell: bash
        run: |
          set -euo pipefail
          git show 93baef42c1cc8bef879892b01d2cefc6829afc45:scripts/v102-couple.patch.gz.b64 | base64 -d | gzip -d > /tmp/v102-couple.patch
          python - <<'PY'
          from pathlib import Path
          patch = Path('/tmp/v102-couple.patch').read_text()
          start = patch.index("+type UplineKind = 'platinum' | 'diamond';")
          end = patch.index(" async function awardRankApprovalReward", start)
          helper_lines = []
          for line in patch[start:end].splitlines():
              if line.startswith('+'):
                  helper_lines.append(line[1:])
              elif line.startswith(' '):
                  helper_lines.append(line[1:])
          helper = '\n'.join(helper_lines).rstrip() + '\n\n'
          router = Path('worker/stickerRouter.ts')
          text = router.read_text()
          if 'async function handleCoupleApi(' not in text:
              marker = "const RANK_TIER_PRIORITY: Record<RankRewardTier, number>"
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit('RANK_TIER_PRIORITY marker not found')
              text = text[:idx] + helper + text[idx:]
              router.write_text(text)
          PY
          rm -f scripts/v102-helper.ts.gz.b64 .github/workflows/insert-v102-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v102: 完成夫妻共同組織後端 helper"
          git push origin HEAD:safe/v102-ui-admin-lucky-upline
