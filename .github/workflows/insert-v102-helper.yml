name: Insert v102 couple helper

on:
  push:
    branches:
      - safe/v102-ui-admin-lucky-upline
    paths:
      - .github/workflows/insert-v102-helper.yml

permissions:
  contents: write

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v102-ui-admin-lucky-upline
          fetch-depth: 0
      - name: Insert helper block into current sticker router
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          router = Path('worker/stickerRouter.ts')
          text = router.read_text()
          helper = gzip.decompress(base64.b64decode(Path('scripts/v102-helper.ts.gz.b64').read_text().strip())).decode()
          if 'async function handleCoupleApi(' not in text:
              marker = "const RANK_TIER_PRIORITY: Record<RankRewardTier, number>"
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit('RANK_TIER_PRIORITY marker not found')
              text = text[:idx] + helper + "\n" + text[idx:]
              router.write_text(text)
          PY
          rm -f scripts/v102-helper.ts.gz.b64 .github/workflows/insert-v102-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v102: 完成夫妻共同組織後端 helper"
          git push origin HEAD:safe/v102-ui-admin-lucky-upline
