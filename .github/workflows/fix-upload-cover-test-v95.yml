name: Fix upload cover test v95

on:
  push:
    branches:
      - fix/upload-cover-library-r2-v95
    paths:
      - '.github/workflows/fix-upload-cover-test-v95.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/upload-cover-library-r2-v95
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply corrected source changes
        run: node .github/scripts/fix-upload-cover-test-v95.mjs
      - name: Install dependencies
        run: npm install
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修復上傳封面圖庫與 R2 同步"
          git push origin HEAD:fix/upload-cover-library-r2-v95

# retry: parser-safe cover library assertions
