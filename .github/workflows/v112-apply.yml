name: v112 apply

on:
  push:
    branches:
      - safe/v112-sticker-rank-integrity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply v112 source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def must(path, old, new, count=1):
              text=read(path)
              n=text.count(old)
              if n < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {n}: {old[:100]!r}')
              text=text.replace(old,new,count)
              write(path,text)
          def optional(path, old, new, count=-1):
              text=read(path)
              if old not in text: return False
              write(path,text.replace(old,new,count))
              return True
          def add_import(path, statement):
              text=read(path)
              if statement not in text:
                  write(path, statement+'\n'+text)

          # Sticker history: show legitimate correction rows as 系統錯誤修正, while
          # suppressing only the already-shipped erroneous v111 negative row.
          path='worker/stickerRouter.ts'
          must(path,
              'WHERE ${outgoing ? "tx.actorUserId = ? AND tx.type = \'manual_grant\'" : "tx.userId = ? AND tx.type <> \'balance_correction\'"}',
              'WHERE ${outgoing ? "tx.actorUserId = ? AND tx.type = \'manual_grant\'" : "tx.userId = ? AND NOT (tx.type = \'balance_correction\' AND tx.uniqueKey LIKE \'hidden-sticker-balance-v111:%\' AND tx.balanceAfterUnits < 0)"}')
          must(path,
              'id: tx.id, type: tx.type, description: tx.description, createdAt: tx.createdAt,',
              "id: tx.id, type: tx.type, description: tx.type === 'balance_correction' ? '系統錯誤修正' : tx.description, createdAt: tx.createdAt,")

          # Sticker book labels + official rank in grant target labels.
          path='src/components/StickersModal.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          must(path,
              "manual_grant:'人工加貼紙',manual_grant_debit:'加發貼紙給下線'};",
              "manual_grant:'人工加貼紙',manual_grant_debit:'加發貼紙給下線',balance_correction:'系統錯誤修正'};")
          must(path,
              "{target.name}（{target.approvedRank || target.rank || '會員'}）",
              "{target.name}（{effectiveMemberRank(target,'會員')}）")

          # Navbar display and permission gates use the same approved/effective rank.
          path='src/components/Navbar.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          must(path, ": (currentUser.rank || '會員');", ": effectiveMemberRank(currentUser, '會員');")
          must(path, "const userRank = currentUser?.rank || '';", "const userRank = currentUser ? effectiveMemberRank(currentUser, '') : '';")

          # Admin member list, filters and access gates use effective rank; edit form
          # deliberately keeps raw requested rank so administrators can still edit it.
          path='src/components/AdminModal.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          must(path, "const userRank = currentUser?.rank || '';", "const userRank = currentUser ? effectiveMemberRank(currentUser, '') : '';")
          must(path, "if (filterRank !== '全部' && u.rank !== filterRank) return false;", "if (filterRank !== '全部' && effectiveMemberRank(u) !== filterRank) return false;")
          must(path, "{u.rank || '無'}", "{effectiveMemberRank(u)}")

          # Rank statistics and member cards.
          path='src/components/StatisticsView.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          must(path, "const r = u.rank || '無';", "const r = effectiveMemberRank(u);")
          must(path, "{user.rank || '無'}", "{effectiveMemberRank(user)}")

          path='src/components/DataCenterTab.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          must(path, "const r = u.rank || '無';", "const r = effectiveMemberRank(u);")

          path='src/components/MemberPreviewModal.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          must(path, "{liveUser.rank || '無'}", "{effectiveMemberRank(liveUser)}")

          path='src/components/MemberDetailPreviewModal.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          optional(path, "user.rank || '一般會員'", "effectiveMemberRank(user, '一般會員')")
          optional(path, "user.rank || '-'", "effectiveMemberRank(user, '-')")

          # Personal profile static display and upline suggestions should not grant
          # status based on an unapproved requested rank. Editing state stays raw.
          path='src/components/ProfileModal.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          must(path,
              "if (u.rank && (u.rank.includes('白金') || u.rank.includes('翡翠') || u.rank.includes('鑽石') || u.rank.includes('皇冠') || u.rank.includes('大使'))) {",
              "const rank = effectiveMemberRank(u, '');\n      if (rank && (rank.includes('白金') || rank.includes('翡翠') || rank.includes('鑽石') || rank.includes('皇冠') || rank.includes('大使'))) {")
          must(path,
              "if (u.rank && (u.rank.includes('鑽石') || u.rank.includes('皇冠') || u.rank.includes('大使'))) {",
              "const rank = effectiveMemberRank(u, '');\n      if (rank && (rank.includes('鑽石') || rank.includes('皇冠') || rank.includes('大使'))) {")
          must(path, "{currentUser.rank}", "{effectiveMemberRank(currentUser)}")

          # Comment/member badges and exported track cards follow official rank.
          for path in ['src/components/CommentPreviewModal.tsx','src/components/CommentsSection.tsx']:
              add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
              optional(path, "(u.rank && u.rank.toLowerCase().includes(q))", "effectiveMemberRank(u, '').toLowerCase().includes(q)")
              optional(path, "[u.center, u.rank || '會員']", "[u.center, effectiveMemberRank(u, '會員')]")
              optional(path, "(currentUser?.rank || '訪客')", "(effectiveMemberRank(currentUser, '訪客'))")
              optional(path, "(registeredAuthor.rank || '無')", "effectiveMemberRank(registeredAuthor)")

          path='src/components/DetailView.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          optional(path, "authorRank:author.rank", "authorRank:effectiveMemberRank(author)")

          path='src/components/BwExportModal.tsx'
          add_import(path, "import { effectiveMemberRank } from '../utils/ranks';")
          optional(path, "currentUser.rank", "effectiveMemberRank(currentUser)")

          path='src/utils/canvasExportLegacy.ts'
          add_import(path, "import { effectiveMemberRank } from './ranks';")
          optional(path, "user.rank || '無'", "effectiveMemberRank(user)")

          path='src/utils/memberLearningCardExport.ts'
          add_import(path, "import { effectiveMemberRank } from './ranks';")
          optional(path,
              "const titleRank = resolved.rank && resolved.rank !== '無' ? ` ${resolved.rank}` : '';",
              "const resolvedRank = effectiveMemberRank(resolved);\n  const titleRank = resolvedRank !== '無' ? ` ${resolvedRank}` : '';")

          # Update v111 regression expectations for the corrected production mapping,
          # visible correction label, and the new fail-closed negative target guard.
          path='tests/v111HiddenBalanceCorrection.test.ts'
          text=read(path)
          text=text.replace("  HIDDEN_BALANCE_TARGETS_V111,", "  HIDDEN_BALANCE_TARGETS_V111,\n  HIDDEN_BALANCE_TARGETS_V112,")
          text=text.replace("test('hidden correction sets exact final balances, permits a negative target, and runs only once', async () => {", "test('hidden correction sets exact non-negative final balances and runs only once', async () => {")
          text=text.replace("{ memberNameHash: await hashNormalizedMemberName('測試乙'), targetUnits: -1000 },", "{ memberNameHash: await hashNormalizedMemberName('測試乙'), targetUnits: 2061 },")
          text=text.replace("assert.equal(balance(db.sqlite, 'b'), -1000);", "assert.equal(balance(db.sqlite, 'b'), 2061);")
          text=text.replace("test('production mapping keeps three hash-only targets and includes the requested negative calibration', () => {\n  assert.equal(HIDDEN_BALANCE_TARGETS_V111.length, 3);\n  assert.deepEqual(HIDDEN_BALANCE_TARGETS_V111.map(item => item.targetUnits).sort((a,b) => a-b), [-1000, 3060, 3160]);\n  assert.ok(HIDDEN_BALANCE_TARGETS_V111.every(item => /^[a-f0-9]{64}$/.test(item.memberNameHash)));\n});",
              "test('production mappings keep three hash-only non-negative targets and v112 repairs the exact final balances', () => {\n  assert.equal(HIDDEN_BALANCE_TARGETS_V111.length, 3);\n  assert.equal(HIDDEN_BALANCE_TARGETS_V112.length, 3);\n  assert.deepEqual(HIDDEN_BALANCE_TARGETS_V111.map(item => item.targetUnits).sort((a,b) => a-b), [2061, 3060, 3160]);\n  assert.deepEqual(HIDDEN_BALANCE_TARGETS_V112.map(item => item.targetUnits).sort((a,b) => a-b), [2061, 3060, 3160]);\n  assert.ok(HIDDEN_BALANCE_TARGETS_V111.every(item => item.targetUnits >= 0 && /^[a-f0-9]{64}$/.test(item.memberNameHash)));\n});")
          text=text.replace("test('member surfaces hide correction entries while current balance still includes them', () => {", "test('member history shows valid correction entries while earned/spent and toast streams still exclude them', () => {")
          text=text.replace("  assert.match(source, /tx\\.userId = \\? AND tx\\.type <> 'balance_correction'/);", "  assert.match(source, /系統錯誤修正/);\n  assert.match(source, /hidden-sticker-balance-v111:%/);")
          write(path,text)

          Path('tests/v112RankIntegrity.test.ts').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { effectiveMemberRank } from '../src/utils/ranks';
          import { HIDDEN_BALANCE_TARGETS_V112 } from '../worker/hiddenStickerBalanceCorrection';

          test('effective member rank matches backend official-rank semantics', () => {
            assert.equal(effectiveMemberRank({rank:'鑽石級以上',approvedRank:'無',rankApproved:true} as any), '無');
            assert.equal(effectiveMemberRank({rank:'翡翠',approvedRank:'翡翠',rankApproved:true} as any), '翡翠');
            assert.equal(effectiveMemberRank({rank:'18%',approvedRank:'15%',rankApproved:false} as any), '18%');
          });

          test('all v112 production sticker targets are exact and non-negative', () => {
            assert.deepEqual(HIDDEN_BALANCE_TARGETS_V112.map(x=>x.targetUnits).sort((a,b)=>a-b), [2061,3060,3160]);
            assert.ok(HIDDEN_BALANCE_TARGETS_V112.every(x => Number.isInteger(x.targetUnits) && x.targetUnits >= 0));
          });

          test('sticker correction is visible as system error fix but excluded from earned/spent/toast', () => {
            const router=readFileSync(new URL('../worker/stickerRouter.ts', import.meta.url),'utf8');
            const modal=readFileSync(new URL('../src/components/StickersModal.tsx', import.meta.url),'utf8');
            assert.match(router,/系統錯誤修正/);
            assert.match(modal,/balance_correction:'系統錯誤修正'/);
            assert.match(router,/t\.type <> 'balance_correction' AND t\.deltaUnits > 0/);
            assert.match(router,/t\.type <> 'balance_correction' AND t\.deltaUnits < 0/);
            assert.match(router,/type NOT IN \('initial','balance_correction'\)/);
          });

          test('requested UI styling is locked in', () => {
            const css=readFileSync(new URL('../src/components/Navbar.css', import.meta.url),'utf8');
            const guide=readFileSync(new URL('../src/components/StickerGuideTable.tsx', import.meta.url),'utf8');
            assert.match(css,/content: "未安裝"/);
            assert.match(css,/aria-label="貼紙簿分頁"/);
            assert.match(css,/overflow-x: auto/);
            assert.match(guide,/border-amber-200/);
            assert.match(guide,/bg-amber-50/);
            assert.match(guide,/text-amber-900/);
          });
          '''.replace(/^          /gm,''))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove temporary audit workflows and commit verified source
        shell: bash
        run: |
          rm -f .github/workflows/v112-audit.yml .github/workflows/v112-audit2.yml .github/workflows/v112-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v112：修正貼紙餘額、獎銜一致性與貼紙簿介面"
          git push origin HEAD:safe/v112-sticker-rank-integrity
