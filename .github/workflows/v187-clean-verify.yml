name: v187 Clean Verification

on:
  push:
    branches:
      - safe/v187-multi-speaker-5
    paths:
      - .github/workflows/v187-clean-verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Regression
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
