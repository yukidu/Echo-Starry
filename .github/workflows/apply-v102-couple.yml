name: Apply v102 couple organization patch

on:
  push:
    branches:
      - safe/v102-ui-admin-lucky-upline
    paths:
      - .github/workflows/apply-v102-couple.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v102-ui-admin-lucky-upline
          fetch-depth: 0
      - name: Apply non-conflicting prepared changes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/v102-couple.patch.gz.b64 | gzip -d > /tmp/v102-couple.patch
          git apply --reject --whitespace=nowarn /tmp/v102-couple.patch || true
          echo 'Rejected hunks (will be completed manually against current branch):'
          find . -name '*.rej' -print || true
          find . -name '*.rej' -delete
          rm -f scripts/v102-couple.patch.gz.b64 .github/workflows/apply-v102-couple.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v102: 套用夫妻共同組織非衝突變更"
          git push origin HEAD:safe/v102-ui-admin-lucky-upline
