name: One-off v76 upline autocomplete

on:
  push:
    branches: [feat/profile-upline-autocomplete-v76]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-upline-autocomplete-v76
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          old = """        onClearListeningHistory={handleClearListeningHistory}\n      />"""
          new = """        onClearListeningHistory={handleClearListeningHistory}\n        allUsers={allUsers}\n      />"""
          if new not in text:
              assert old in text, 'ProfileModal mount point not found'
              text = text.replace(old, new, 1)
          app.write_text(text)

          sw = Path('public/sw.js')
          text = sw.read_text()
          text = text.replace("echostars-shell-v75", "echostars-shell-v76")
          sw.write_text(text)

          release = Path('tests/releaseIntegrity.test.ts')
          text = release.read_text()
          text = text.replace("test('v75 is the single current PWA cache version'", "test('v76 is the single current PWA cache version'")
          text = text.replace("echostars-shell-v75", "echostars-shell-v76")
          release.write_text(text)

          changelog = Path('src/changelogReleaseNotes.ts')
          text = changelog.read_text()
          marker = "    '重新核對訪客與登入會員的功能界線：訪客仍可使用公開播放與可用的分享圖功能；會員學習紀錄、個人學習圖卡與需要身分的操作仍以已驗證會員身分為準。'"
          addition = marker + ",\n    '個人中心的「上手白金」與「上手鑽石」改為真正可用的關聯詞提示：輸入或點進欄位時，會從現有會員姓名與既有上手資料中自動顯示符合候選詞，可直接點選帶入。'"
          if '上手白金」與「上手鑽石」改為真正可用的關聯詞提示' not in text:
              assert marker in text, 'changelog marker not found'
              text = text.replace(marker, addition, 1)
          changelog.write_text(text)

          test = Path('tests/profileUplineAutocomplete.test.ts')
          test.write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\nconst app = readFileSync(new URL('../src/App.tsx', import.meta.url), 'utf8');\nconst profile = readFileSync(new URL('../src/components/ProfileModal.tsx', import.meta.url), 'utf8');\n\ntest('profile modal receives the loaded member list so upline autocomplete is not empty', () => {\n  assert.match(app, /<ProfileModal[\\s\\S]*allUsers=\\{allUsers\\}/);\n  assert.match(app, /isProfileOpen[\\s\\S]*fetchAllUsers\\(\\)/);\n});\n\ntest('platinum and diamond fields show related member and existing-upline suggestions while typing or focusing', () => {\n  assert.match(profile, /const platinumSuggestions = useMemo/);\n  assert.match(profile, /if \\(u\\.platinumUpline\\) set\\.add\\(u\\.platinumUpline\\)/);\n  assert.match(profile, /const diamondSuggestions = useMemo/);\n  assert.match(profile, /if \\(u\\.diamondUpline\\) set\\.add\\(u\\.diamondUpline\\)/);\n  assert.match(profile, /setActiveSuggestField\\('platinum'\\)/);\n  assert.match(profile, /setActiveSuggestField\\('diamond'\\)/);\n  assert.match(profile, /activeSuggestField === 'platinum' && platinumSuggestions\\.length > 0/);\n  assert.match(profile, /activeSuggestField === 'diamond' && diamondSuggestions\\.length > 0/);\n  assert.match(profile, /setPlatinumUpline\\(nameItem\\)/);\n  assert.match(profile, /setDiamondUpline\\(nameItem\\)/);\n});\n""")
          PY
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/App.tsx src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts tests/profileUplineAutocomplete.test.ts
          git diff --cached --check
          git commit -m '啟用上手白金與鑽石關聯詞提示'
          git push origin HEAD:feat/profile-upline-autocomplete-v76
