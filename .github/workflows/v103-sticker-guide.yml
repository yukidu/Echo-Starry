name: Apply v103 sticker guide

on:
  push:
    branches:
      - safe/v103-sticker-guide-table
    paths:
      - scripts/apply-v103-sticker-guide.mjs
      - .github/workflows/v103-sticker-guide.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v103-sticker-guide-table
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply sticker guide integration
        run: node scripts/apply-v103-sticker-guide.mjs
      - name: Full tests
        run: npm test
      - name: TypeScript diagnostic
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified integration and remove temporary tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-v103-sticker-guide.mjs .github/workflows/v103-sticker-guide.yml
          git add -A
          git commit -m "v103: add personalized sticker earning and spending guide"
          git push origin HEAD:safe/v103-sticker-guide-table
