name: v251 live card theme check

on:
  push:
    branches:
      - verify/v251-live-card-themes
    paths:
      - .github/workflows/v251-live-card-theme-check.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live member center and public card themes
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 StarryProductionCheck/1.0'
          curl -fsSL --retry 3 --retry-delay 2 -A "$UA" 'https://id.starry.phd/' -o /tmp/home.html
          grep -Fq 'v251-card-theme-style' /tmp/home.html
          grep -Fq 'v251-card-theme-script' /tmp/home.html
          grep -Fq 'v251CardThemeSelect' /tmp/home.html
          for name in '繁星深空' '曜金尊爵' '極光秘境' '晨曦紙境' '霓虹脈衝' '森語自然' '海洋流光' '緋櫻和風' '月白極簡' '皇家寶石'; do
            grep -Fq "$name" /tmp/home.html
          done
          curl -fsSL --retry 3 --retry-delay 2 -A "$UA" 'https://id.starry.phd/7392157' -o /tmp/card.html
          grep -Fq '張佑安' /tmp/card.html
          grep -Fq '7392157' /tmp/card.html
          grep -Fq 'Starry ID 電子名片' /tmp/card.html
          grep -Fq 'v251-card-theme-style' /tmp/card.html
          grep -Fq 'data-card-theme=' /tmp/card.html
          if grep -Fq '"error":"Not found"' /tmp/card.html; then
            echo 'Public card unexpectedly returned Not found' >&2
            exit 1
          fi
          echo 'v251 live production verified'
