name: v148 apply lucky stability patch

on:
  push:
    branches:
      - safe/v148-lucky-draw-stability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe/v148-lucky-draw-stability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact v148 source patch
        run: python .github/v148_patch.py
      - name: Commit source patch and remove one-time patcher
        shell: bash
        run: |
          rm .github/v148_patch.py .github/workflows/v148-apply-lucky-stability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v148: stabilize lucky draw on mobile"
          git push origin HEAD:safe/v148-lucky-draw-stability
