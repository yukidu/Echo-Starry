name: One-off v87 comment time
on:
  push:
    branches:
      - fix/comment-time-badge-v87
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comment-time-badge-v87
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: python scripts/patch-v87-comment-time.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: TypeScript diagnostic
        continue-on-error: true
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "echostars-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add shared/commentTime.ts worker/community.ts server.ts src/components/CommentsSection.tsx src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts tests/commentTimestamp.test.ts
          git commit -m "修正留言時間與獎銜單行顯示"
          git push origin HEAD:fix/comment-time-badge-v87