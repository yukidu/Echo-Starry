name: Apply v274 spouse public-card patch

on:
  push:
    branches: [fix/v274-spouse-public-card-number]
    paths:
      - 'scripts/v274ApplySpousePublicPatch.mjs'
      - '.github/workflows/v274-apply-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v274-spouse-public-card-number
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patch
        run: node scripts/v274ApplySpousePublicPatch.mjs
      - name: Remove one-time patch helpers and commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/v274ApplySpousePublicPatch.mjs .github/workflows/v274-apply-patch.yml
          git add worker/starryIdCentralRouter.ts worker/starryIdMemberCenterPage.ts worker/starryIdV211Router.ts worker/starryIdV212PublicCardBridge.ts tests/starryIdV212PublicCardBridge.test.ts tests/v274StarryIdSpousePublicNumber.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v274：夫妻綁定顯示與會員編號公開頁直達'
          git push origin HEAD:fix/v274-spouse-public-card-number
