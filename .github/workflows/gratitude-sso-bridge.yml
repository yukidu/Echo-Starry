name: Gratitude SSO bridge - validate and deploy
on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/starryEcosystemSsoRouter.ts'
      - 'worker/starryEcosystemAuthEntryRouter.ts'
      - 'worker/starryAppAccess.ts'
      - 'wrangler.toml'
      - '.github/workflows/gratitude-sso-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'worker/starryEcosystemSsoRouter.ts'
      - 'worker/starryEcosystemAuthEntryRouter.ts'
      - 'worker/starryAppAccess.ts'
      - 'wrangler.toml'
      - '.github/workflows/gratitude-sso-bridge.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests
        run: npm test
      - name: Build existing frontend
        run: npm run build
      - name: Validate production Worker bundle without deploying
        run: npx wrangler deploy --dry-run
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build existing frontend
        run: npm run build
      - name: Deploy Echo + Starry ID Worker without modifying other services
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          command: deploy
      - name: Verify central login and existing Echo health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --connect-timeout 10 --max-time 20 https://id.starry.phd/auth/gratitude | grep -F '繁星通行證'               && curl -fsS --connect-timeout 10 --max-time 20 https://echo.starry.phd/ | grep -F '<html'; then
              echo 'Starry ID + Echo production checked.'
              exit 0
            fi
            sleep 10
          done
          echo 'Central login production smoke failed.'
          exit 1
