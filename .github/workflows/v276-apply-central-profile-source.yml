name: Apply v276 central profile source
on:
  push:
    branches: [refactor/v276-central-profile-source]
    paths:
      - scripts/v276CentralProfileSourcePatch.mjs
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v276-central-profile-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: node scripts/v276CentralProfileSourcePatch.mjs
      - name: Remove one-time helpers and commit
        run: |
          rm scripts/v276CentralProfileSourcePatch.mjs
          rm .github/workflows/v276-apply-central-profile-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/authRouter.ts worker/privacyCrawlerRouter.ts scripts/v276CentralProfileSourcePatch.mjs .github/workflows/v276-apply-central-profile-source.yml
          git commit -m "feat(v276): make Starry ID the direct Echo profile source"
          git push origin HEAD:refactor/v276-central-profile-source
