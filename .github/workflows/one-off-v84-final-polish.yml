name: One-off v84 final polish
on:
  push:
    branches: [ui/detail-page-ux-v84]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/detail-page-ux-v84
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final polish
        run: |
          python - <<'PY'
          from pathlib import Path

          comments = Path('src/components/CommentsSection.tsx')
          c = comments.read_text()
          assert "{isSubmitting ? '送出中…' : '送出'}" in c
          c = c.replace("{isSubmitting ? '送出中…' : '送出'}", "{isSubmitting ? '送出中...' : '送出'}", 1)
          comments.write_text(c)

          detail = Path('src/components/DetailView.tsx')
          d = detail.read_text()
          old = 'className="flex flex-wrap items-center gap-x-1.5 gap-y-0.5 font-bold text-sm text-slate-800 dark:text-slate-200 text-left cursor-pointer"'
          new = 'className="flex flex-wrap items-center gap-x-1.5 gap-y-0.5 font-bold text-sm text-amber-700 dark:text-amber-300 hover:text-amber-800 dark:hover:text-amber-200 transition-colors text-left cursor-pointer"'
          assert old in d
          detail.write_text(d.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'echostars-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/CommentsSection.tsx src/components/DetailView.tsx
          git diff --cached --check
          git commit -m '補強詳細頁關鍵字樣式與送出狀態相容'
          git push origin HEAD:ui/detail-page-ux-v84
