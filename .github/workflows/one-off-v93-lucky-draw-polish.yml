name: One-off v93 lucky draw polish

on:
  push:
    branches: [fix/lucky-draw-persistence-motion-v93]
    paths:
      - .github/workflows/one-off-v93-lucky-draw-polish.yml
      - scripts/patch-v93-lucky-draw-polish.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lucky-draw-persistence-motion-v93
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lucky draw polish
        run: python scripts/patch-v93-lucky-draw-polish.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name echostars-release-bot
          git config user.email actions@users.noreply.github.com
          git add src/App.tsx src/index.css src/changelogReleaseNotes.ts public/sw.js tests/homeLuckyDrawUi.test.ts tests/releaseIntegrity.test.ts
          git commit -m "優化好手氣抽卡定格與整列動畫" || exit 0
          git push
