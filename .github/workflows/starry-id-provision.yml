name: Provision Starry ID

on:
  push:
    branches: [main]
    paths:
      - 'starry-id/**'
      - '.github/workflows/starry-id-provision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-and-audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Detect Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare provisioning credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare provisioning credentials are not configured for GitHub Actions; skipping D1 creation and remote audit safely."
          fi
      - name: Provision central D1 and audit source members
        if: steps.cloudflare.outputs.available == 'true'
        run: bash starry-id/provision-and-audit.sh
      - name: Upload non-PII audit report
        if: steps.cloudflare.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: starry-id-member-audit
          path: starry-id/audit-output/member-audit.json
          if-no-files-found: error
      - name: Provisioning status
        if: steps.cloudflare.outputs.available != 'true'
        run: echo "Starry ID code is ready; remote provisioning remains pending until Cloudflare GitHub Actions credentials are configured."
