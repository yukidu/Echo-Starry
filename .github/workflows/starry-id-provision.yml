name: Provision Starry ID

# Production D1 changes must never be triggered by main pushes.
on:
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: 'Type PROVISION_STARRY_ID_PRODUCTION to authorize production D1 changes'
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision-and-audit:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approval_phrase == 'PROVISION_STARRY_ID_PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: starry-production-write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify independent production approval gate
        shell: bash
        env:
          STARRY_PRODUCTION_WRITE_APPROVAL_KEY: ${{ secrets.STARRY_PRODUCTION_WRITE_APPROVAL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STARRY_PRODUCTION_WRITE_APPROVAL_KEY:-}" ]; then
            echo 'Production access disabled: configure protected environment and approval secret.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Detect Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare provisioning credentials are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare provisioning credentials are not configured for GitHub Actions; skipping D1 creation and remote audit safely."
          fi
      - name: Provision central D1 and audit source members
        if: steps.cloudflare.outputs.available == 'true'
        run: bash starry-id/provision-and-audit.sh
      - name: Upload non-PII audit report
        if: steps.cloudflare.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: starry-id-member-audit
          path: starry-id/audit-output/member-audit.json
          if-no-files-found: error
      - name: Provisioning status
        if: steps.cloudflare.outputs.available != 'true'
        run: echo "Starry ID code is ready; remote provisioning remains pending until Cloudflare GitHub Actions credentials are configured."
