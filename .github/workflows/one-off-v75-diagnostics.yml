name: One-off v75 diagnostics

on:
  push:
    branches:
      - fix/profile-autoedit-member-delete-v75
    paths:
      - .github/workflows/one-off-v75-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-autoedit-member-delete-v75
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture tests
        run: |
          set +e
          npm test > v75-test-output.txt 2>&1
          echo "exit_code=$?" >> v75-test-output.txt
          exit 0
      - name: Commit diagnostics and remove helper workflow
        run: |
          git rm .github/workflows/one-off-v75-diagnostics.yml
          git config user.name "echostars-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add v75-test-output.txt
          git commit -m "暫存 v75 測試診斷輸出"
          git push origin HEAD:fix/profile-autoedit-member-delete-v75
