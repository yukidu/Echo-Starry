name: Apply keyword header detail layout v96

on:
  push:
    branches:
      - fix/keyword-header-detail-layout-v96

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node .github/scripts/apply-keyword-header-detail-layout-v96.mjs
      - name: Run tests with diagnostic capture
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/npm-test-v96.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/npm-test-v96.log .github/npm-test-v96.log
          fi
          exit "$status"
      - name: Save failing test log
        if: failure()
        run: |
          git config user.name "echostars-release-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f .github/npm-test-v96.log ]; then
            git add .github/npm-test-v96.log
            git commit -m "暫存 v96 測試診斷紀錄"
            git push origin HEAD:fix/keyword-header-detail-layout-v96
          fi
      - run: npm run build
      - name: Commit verified UI changes
        run: |
          git config user.name "echostars-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/components/DetailView.tsx src/components/AudioCard.tsx src/changelogReleaseNotes.ts public/sw.js tests/releaseIntegrity.test.ts tests/keywordHeaderDetailLayout.test.ts
          git commit -m "壓縮網友關鍵字與詳細播放頁版面"
          git push origin HEAD:fix/keyword-header-detail-layout-v96
