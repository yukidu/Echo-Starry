name: One-off v96 lucky result pinned

on:
  push:
    branches:
      - fix/lucky-result-pinned-v96
    paths:
      - scripts/patch-v96-lucky-result-pinned.py
      - .github/workflows/one-off-v96-lucky-result-pinned.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply pinned lucky-result patch
        run: python scripts/patch-v96-lucky-result-pinned.py
      - name: Install dependencies
        run: npm install
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "echostars-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.tsx src/changelogReleaseNotes.ts public/sw.js tests/homeLuckyDrawUi.test.ts tests/releaseIntegrity.test.ts
          git commit -m "固定好手氣結果卡避免手機捲動跳位"
          git push
