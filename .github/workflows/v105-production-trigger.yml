name: v105 production topup trigger

on:
  push:
    branches:
      - safe/v105-one-time-rank-sticker-topup

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production one-time migration through safe public GET
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/response.json -w '%{http_code}' --retry 3 --retry-delay 2 https://echostars.yukidu.workers.dev/api/stickers/public-settings)
          echo "HTTP $code"
          cat /tmp/response.json
          test "$code" = "200"
